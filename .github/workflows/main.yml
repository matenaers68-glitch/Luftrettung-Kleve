      # =====================================================
      # PUSH-NACHRICHT
      # =====================================================

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import os

          TOPIC = "luftrettung-goch-jm-26092026-x7k4"

          def send_ntfy(
              title,
              message
          ):

              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode(
                      "utf-8"
                  ),
                  method="POST",
                  headers={
                      "Title": title,
                      "Priority": "high",
                      "Tags": "helicopter"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return response.status


          # -------------------------------------------------
          # MANUELLER START = TEST
          # -------------------------------------------------

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              == "workflow_dispatch"
          ):

              print(
                  "Manueller V4.1-Test."
              )

              status = send_ntfy(
                  "Luftrettung KLE - V4.1 Test",
                  (
                      "Version 4.1 läuft.\n"
                      "80-km-Hintergrundüberwachung aktiv.\n"
                      "30-km-Aktionsradius aktiv."
                  )
              )

              print(
                  "Test-Push HTTP:",
                  status
              )

              raise SystemExit(0)


          # -------------------------------------------------
          # AUTOMATISCHER BETRIEB
          # -------------------------------------------------

          try:

              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  detected = json.load(
                      f
                  )

          except Exception as e:

              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []


          if not detected:

              print(
                  "Keine relevante neue Erkennung."
              )

              raise SystemExit(0)


          for item in detected:

              name = (
                  item.get("name")
                  or "Hubschrauber"
              )

              registration = (
                  item.get("registration")
                  or "unbekannt"
              )

              callsign = (
                  item.get("callsign")
                  or "unbekannt"
              )

              service = (
                  item.get("service")
                  or "unbekannt"
              )

              station = (
                  item.get("station")
                  or "noch nicht bestimmt"
              )

              distance = item.get(
                  "distance_km"
              )

              first_distance = item.get(
                  "first_seen_distance_km"
              )

              if distance is None:
                  distance_text = "unbekannt"
              else:
                  distance_text = (
                      f"{distance} km"
                  )

              if first_distance is None:
                  first_text = "unbekannt"
              else:
                  first_text = (
                      f"{first_distance} km"
                  )

              message = (
                  f"{name} im 30-km-Radius erkannt\n"
                  f"Art: {service}\n"
                  f"Kennzeichen: {registration}\n"
                  f"Rufname: {callsign}\n"
                  f"Station: {station}\n"
                  f"Jetzt: {distance_text} von Goch\n"
                  f"Erstmals erfasst bei: {first_text}"
              )

              status = send_ntfy(
                  "Luftrettung KLE",
                  message
              )

              print(
                  "Push gesendet:",
                  name,
                  registration,
                  "HTTP:",
                  status
              )

          PY


