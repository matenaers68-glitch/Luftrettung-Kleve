name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten abrufen und Historie führen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          from datetime import datetime, timezone, timedelta

          # =================================================
          # GRUNDEINSTELLUNGEN
          # =================================================

          VERSION = "3.7"

          GOCH_LAT = 51.678
          GOCH_LON = 6.159

          # 30 km ≈ 16,2 NM
          RADIUS_NM = 16.2

          URL = (
              f"https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/{RADIUS_NM}"
          )

          now = datetime.now(timezone.utc)

          # =================================================
          # BEKANNTE HUBSCHRAUBER
          #
          # Hier können wir später weitere eindeutig
          # identifizierte Maschinen ergänzen.
          #
          # WICHTIG:
          # "station" bedeutet Heimat-/Regelstation.
          # Daraus wird NICHT automatisch ein Startort.
          # =================================================

          KNOWN_AIRCRAFT = {

              # Lifeliner 3
              "PH-DOC": {
                  "name": "Lifeliner 3",
                  "service": "Traumahelikopter",
                  "station": "Volkel / Region Nijmegen",
                  "country": "Niederlande"
              },

              # Christoph 3
              "D-HZSA": {
                  "name": "Christoph 3",
                  "service": "Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "country": "Deutschland"
              }

          }

          # =================================================
          # HUBSCHRAUBERTYPEN / ERKENNUNG
          # =================================================

          KNOWN_ROTOR_TYPES = {
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          }

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "SAR"
          )

          # =================================================
          # HILFSFUNKTIONEN
          # =================================================

          def load_json(filename, default):

              if not os.path.exists(filename):
                  return default

              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception:
                  return default


          def save_json(filename, data):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def parse_time(value):

              if not value:
                  return None

              try:
                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:
                  return None


          def distance_km(
              lat1,
              lon1,
              lat2,
              lon2
          ):

              r = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(
                  lat2 - lat1
              )

              dl = math.radians(
                  lon2 - lon1
              )

              a = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1)
                  * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )

              return (
                  2
                  * r
                  * math.asin(
                      math.sqrt(a)
                  )
              )


          def normalize_registration(value):

              return str(
                  value or ""
              ).strip().upper()


          def normalize_callsign(value):

              return str(
                  value or ""
              ).strip().upper()


          def is_rotorcraft(ac):

              category = str(
                  ac.get("category") or ""
              ).strip().upper()

              ac_type = str(
                  ac.get("t") or ""
              ).strip().upper()

              callsign = normalize_callsign(
                  ac.get("flight")
              )

              registration = normalize_registration(
                  ac.get("r")
              )

              description = str(
                  ac.get("desc") or ""
              ).strip().upper()

              # ADS-B Kategorie A7 = Rotorcraft
              if category == "A7":
                  return True

              # Bekannte konkrete Maschine
              if registration in KNOWN_AIRCRAFT:
                  return True

              # Bekannte Hubschraubertypen
              for rotor_type in KNOWN_ROTOR_TYPES:

                  if rotor_type in ac_type:
                      return True

              # Rufname / Beschreibung
              text = " ".join([
                  callsign,
                  registration,
                  description,
                  ac_type
              ])

              for word in ROTOR_WORDS:

                  if word in text:
                      return True

              return False


          def get_profile(
              registration,
              callsign
          ):

              reg = normalize_registration(
                  registration
              )

              cs = normalize_callsign(
                  callsign
              )

              # -----------------------------
              # Registrierung hat Vorrang
              # -----------------------------

              if reg in KNOWN_AIRCRAFT:

                  return KNOWN_AIRCRAFT[
                      reg
                  ].copy()

              # -----------------------------
              # Lifeliner 3
              # -----------------------------

              if (
                  "LIFELN3" in cs
                  or "LIFELINER3" in cs
                  or "LIFELINER 3" in cs
              ):

                  return {
                      "name": "Lifeliner 3",
                      "service": "Traumahelikopter",
                      "station": "Region Nijmegen",
                      "country": "Niederlande"
                  }

              # -----------------------------
              # Christoph-Rufname
              # -----------------------------

              if "CHRISTOPH" in cs:

                  cleaned = (
                      cs
                      .replace("_", " ")
                      .strip()
                  )

                  return {
                      "name": cleaned.title(),
                      "service": "Rettungshubschrauber",
                      "station": None,
                      "country": "Deutschland"
                  }

              # -----------------------------
              # Polizei
              # -----------------------------

              if (
                  "POLICE" in cs
                  or "POLIZEI" in cs
              ):

                  return {
                      "name": "Polizeihubschrauber",
                      "service": "Polizei",
                      "station": None,
                      "country": None
                  }

              # -----------------------------
              # Unbekannter Hubschrauber
              # -----------------------------

              return {
                  "name": (
                      callsign
                      or registration
                      or "Unbekannter Hubschrauber"
                  ),
                  "service": "Hubschrauber",
                  "station": None,
                  "country": None
              }


          # =================================================
          # ADSB.LOL ABRUFEN
          # =================================================

          try:

              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                      f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON,
                      "radius_km": 30
                  },
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:

              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }

          save_json(
              "aircraft.json",
              output
          )

          # =================================================
          # HISTORIE LADEN
          # =================================================

          history = load_json(
              "history.json",
              []
          )

          if not isinstance(
              history,
              list
          ):
              history = []

          # Nur 14 Tage behalten

          cutoff = (
              now
              - timedelta(days=14)
          )

          cleaned_history = []

          for old in history:

              old_time = parse_time(
                  old.get("timestamp")
              )

              if (
                  old_time is not None
                  and old_time >= cutoff
              ):

                  cleaned_history.append(
                      old
                  )

          history = cleaned_history

          # =================================================
          # FLUGSTATUS LADEN
          #
          # Hier merken wir uns die laufenden Erfassungen.
          # =================================================

          flight_state = load_json(
              "flight_state.json",
              {}
          )

          if not isinstance(
              flight_state,
              dict
          ):
              flight_state = {}

          # =================================================
          # PUSH-STATUS LADEN
          # =================================================

          push_state = load_json(
              "push_state.json",
              {}
          )

          if not isinstance(
              push_state,
              dict
          ):
              push_state = {}

          detected_for_push = []
          stored_positions = []
          current_rotorcraft = []

          # =================================================
          # LUFTFAHRZEUGE VERARBEITEN
          # =================================================

          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(ac):
                  continue

              registration = str(
                  ac.get("r") or ""
              ).strip()

              callsign = str(
                  ac.get("flight") or ""
              ).strip()

              hexcode = str(
                  ac.get("hex") or ""
              ).strip().lower()

              ac_type = str(
                  ac.get("t") or ""
              ).strip().upper()

              category = str(
                  ac.get("category") or ""
              ).strip().upper()

              alat = ac.get("lat")
              alon = ac.get("lon")

              if not (
                  isinstance(
                      alat,
                      (int, float)
                  )
                  and isinstance(
                      alon,
                      (int, float)
                  )
              ):
                  continue

              identity = (
                  hexcode
                  or normalize_registration(
                      registration
                  )
                  or normalize_callsign(
                      callsign
                  )
              )

              if not identity:
                  continue

              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      alat,
                      alon
                  ),
                  1
              )

              profile = get_profile(
                  registration,
                  callsign
              )

              # =============================================
              # LAUFENDEN FLUG / ERFASSUNG BESTIMMEN
              # =============================================

              previous_state = flight_state.get(
                  identity,
                  {}
              )

              previous_seen = parse_time(
                  previous_state.get(
                      "last_seen"
                  )
              )

              # Wenn länger als 60 Minuten nicht gesehen,
              # behandeln wir die neue Erfassung als
              # neuen Flugabschnitt / neue Begegnung.

              new_segment = True

              if previous_seen is not None:

                  gap = (
                      now
                      - previous_seen
                  ).total_seconds()

                  if gap <= 3600:
                      new_segment = False

              if new_segment:

                  segment_id = (
                      identity
                      + "-"
                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = now.isoformat()

              else:

                  segment_id = (
                      previous_state.get(
                          "segment_id"
                      )
                      or (
                          identity
                          + "-"
                          + now.strftime(
                              "%Y%m%dT%H%M%S"
                          )
                      )
                  )

                  first_seen = (
                      previous_state.get(
                          "first_seen"
                      )
                      or now.isoformat()
                  )

              # =============================================
              # POSITIONSEINTRAG
              # =============================================

              entry = {
                  "timestamp": now.isoformat(),

                  "identity": identity,
                  "segment_id": segment_id,

                  "hex": hexcode,
                  "registration": registration,
                  "callsign": callsign,

                  "name": profile.get(
                      "name"
                  ),

                  "service": profile.get(
                      "service"
                  ),

                  "station": profile.get(
                      "station"
                  ),

                  "country": profile.get(
                      "country"
                  ),

                  "type": ac_type,
                  "category": category,

                  "lat": alat,
                  "lon": alon,

                  "distance_km": dist,

                  "altitude_ft": ac.get(
                      "alt_baro"
                  ),

                  "ground_speed": ac.get(
                      "gs"
                  ),

                  "track": ac.get(
                      "track"
                  ),

                  "first_seen": first_seen,
                  "last_seen": now.isoformat(),

                  # Wichtig:
                  # Station != tatsächlicher Start.
                  "actual_start": None,
                  "actual_destination": None
              }

              current_rotorcraft.append(
                  entry
              )

              # =============================================
              # POSITION SPEICHERN
              #
              # GitHub läuft etwa alle 5 Minuten.
              # Wir speichern jeden verwertbaren Lauf.
              # Nur sehr schnelle Doppelstarts < 2 Minuten
              # werden unterdrückt.
              # =============================================

              save_position = True

              for old in reversed(
                  history
              ):

                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  if old_time is not None:

                      seconds = (
                          now
                          - old_time
                      ).total_seconds()

                      if seconds < 120:
                          save_position = False

                  break

              if save_position:

                  history.append(
                      entry
                  )

                  stored_positions.append(
                      entry
                  )

              # =============================================
              # FLUGSTATUS AKTUALISIEREN
              # =============================================

              flight_state[
                  identity
              ] = {
                  "identity": identity,
                  "segment_id": segment_id,
                  "name": profile.get(
                      "name"
                  ),
                  "registration": registration,
                  "callsign": callsign,
                  "type": ac_type,
                  "service": profile.get(
                      "service"
                  ),
                  "station": profile.get(
                      "station"
                  ),
                  "country": profile.get(
                      "country"
                  ),
                  "first_seen": first_seen,
                  "last_seen": now.isoformat(),
                  "last_lat": alat,
                  "last_lon": alon,
                  "last_distance_km": dist
              }

              # =============================================
              # PUSH
              #
              # Maximal einmal je Maschine / 60 Minuten.
              # =============================================

              send_push = True

              last_push = push_state.get(
                  identity
              )

              if last_push:

                  last_push_time = parse_time(
                      last_push
                  )

                  if last_push_time is not None:

                      seconds = (
                          now
                          - last_push_time
                      ).total_seconds()

                      if seconds < 3600:
                          send_push = False

              if send_push:

                  detected_for_push.append(
                      entry
                  )

                  push_state[
                      identity
                  ] = now.isoformat()

          # =================================================
          # ALTE FLIGHT-STATES BEREINIGEN
          # =================================================

          state_cutoff = (
              now
              - timedelta(days=2)
          )

          cleaned_states = {}

          for identity, state in flight_state.items():

              state_time = parse_time(
                  state.get(
                      "last_seen"
                  )
              )

              if (
                  state_time is not None
                  and state_time >= state_cutoff
              ):

                  cleaned_states[
                      identity
                  ] = state

          flight_state = cleaned_states

          # =================================================
          # HISTORIE SORTIEREN
          # =================================================

          history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )

          # =================================================
          # DATEIEN SPEICHERN
          # =================================================

          save_json(
              "history.json",
              history
          )

          save_json(
              "flight_state.json",
              flight_state
          )

          save_json(
              "push_state.json",
              push_state
          )

          save_json(
              "detected.json",
              detected_for_push
          )

          save_json(
              "current_rotorcraft.json",
              {
                  "updated": now.isoformat(),
                  "aircraft": current_rotorcraft
              }
          )

          # =================================================
          # LOG
          # =================================================

          print(
              "Luftrettung KLE V"
              + VERSION
          )

          print(
              "Luftfahrzeuge im Suchgebiet:",
              output.get(
                  "total",
                  0
              )
          )

          print(
              "Aktuelle Hubschrauber:",
              len(
                  current_rotorcraft
              )
          )

          print(
              "Neue Positionspunkte:",
              len(
                  stored_positions
              )
          )

          print(
              "Push-Kandidaten:",
              len(
                  detected_for_push
              )
          )

          for item in stored_positions:

              print(
                  "POSITION:",
                  item.get("name"),
                  item.get("registration"),
                  item.get("callsign"),
                  item.get("distance_km"),
                  "km",
                  "Station:",
                  item.get("station")
              )

          PY

      # =====================================================
      # PUSH-NACHRICHT
      # =====================================================

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import os

          TOPIC = "luftrettung-goch-jm-26092026-x7k4"

          def send_ntfy(
              title,
              message
          ):

              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode(
                      "utf-8"
                  ),
                  method="POST",
                  headers={
                      "Title": title,
                      "Priority": "high",
                      "Tags": "helicopter"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return response.status

          # -------------------------------------------------
          # MANUELLER START = TEST-PUSH
          # -------------------------------------------------

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              == "workflow_dispatch"
          ):

              print(
                  "Manueller Start erkannt."
              )

              try:

                  status = send_ntfy(
                      "Luftrettung KLE - Test",
                      (
                          "TEST - Luftrettung Goch\n"
                          "GitHub Actions hat den "
                          "Push-Test ausgeführt."
                      )
                  )

                  print(
                      "TEST-PUSH HTTP:",
                      status
                  )

              except Exception as e:

                  print(
                      "TEST-PUSH FEHLGESCHLAGEN:",
                      repr(e)
                  )

                  raise

              raise SystemExit(0)

          # -------------------------------------------------
          # AUTOMATISCHER BETRIEB
          # -------------------------------------------------

          try:

              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  detected = json.load(
                      f
                  )

          except Exception as e:

              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []

          if not detected:

              print(
                  "Keine neue Erkennung - kein Push."
              )

              raise SystemExit(0)

          for item in detected:

              name = (
                  item.get("name")
                  or "Hubschrauber"
              )

              registration = (
                  item.get("registration")
                  or "unbekannt"
              )

              callsign = (
                  item.get("callsign")
                  or "unbekannt"
              )

              ac_type = (
                  item.get("type")
                  or "unbekannt"
              )

              station = (
                  item.get("station")
                  or "unbekannt"
              )

              distance = item.get(
                  "distance_km"
              )

              if distance is None:
                  distance_text = "unbekannt"
              else:
                  distance_text = (
                      f"{distance} km"
                  )

              message = (
                  f"{name} im 30-km-Radius erkannt\n"
                  f"Kennzeichen: {registration}\n"
                  f"Rufname: {callsign}\n"
                  f"Typ: {ac_type}\n"
                  f"Station: {station}\n"
                  f"Entfernung zu Goch: "
                  f"{distance_text}"
              )

              try:

                  status = send_ntfy(
                      "Luftrettung KLE",
                      message
                  )

                  print(
                      "Push gesendet:",
                      name,
                      registration,
                      "HTTP:",
                      status
                  )

              except Exception as e:

                  print(
                      "Push fehlgeschlagen:",
                      repr(e)
                  )

                  raise

          PY

      # =====================================================
      # DATEIEN INS REPOSITORY SCHREIBEN
      # =====================================================

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add \
            aircraft.json \
            history.json \
            flight_state.json \
            current_rotorcraft.json \
            push_state.json

          if git diff --cached --quiet; then

            echo "Keine Änderung vorhanden."

          else

            git commit \
              -m "Luftrettung V3.7 Flugdaten aktualisiert"

            git pull \
              --rebase \
              origin main

            git push \
              origin main

          fi
