name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flugdaten V4.7 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          import re

          from datetime import datetime, timezone, timedelta


          # =====================================================
          # VERSION / GRUNDEINSTELLUNGEN
          # =====================================================

          VERSION = "4.7"

          GOCH_LAT = 51.678
          GOCH_LON = 6.159

          ACTION_RADIUS_KM = 30
          BACKGROUND_RADIUS_KM = 80

          # Nach dieser Zeit ohne Sichtung beginnt ein neuer Flug.
          # 75 Minuten verhindern, dass kurze ADS-B-Lücken
          # fälschlich einen neuen Einsatz erzeugen.
          NEW_FLIGHT_AFTER_MINUTES = 75

          # Erst wenn die Maschine mindestens 32 km entfernt war,
          # gilt ein späterer Eintritt <=30 km als echter Wiedereinflug.
          # Die Hysterese verhindert Flattern direkt an der Grenze.
          REENTRY_ARM_DISTANCE_KM = 32

          BACKGROUND_RADIUS_NM = round(
              BACKGROUND_RADIUS_KM / 1.852,
              1
          )

          URL = (
              "https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{BACKGROUND_RADIUS_NM}"
          )

          now = datetime.now(timezone.utc)


          # =====================================================
          # DATEIEN
          # =====================================================

          AIRCRAFT_FILE = "aircraft.json"
          HISTORY_FILE = "history.json"
          BACKGROUND_FILE = "background_history.json"
          CURRENT_FILE = "current_rotorcraft.json"
          FLIGHT_STATE_FILE = "flight_state.json"
          PUSH_STATE_FILE = "push_state.json"
          DETECTED_FILE = "detected.json"
          DATABASE_FILE = "aircraft_db.json"
          UNKNOWN_FILE = "unknown_aircraft.json"


          # =====================================================
          # BEKANNTE RUFNAMEN
          # =====================================================

          KNOWN_CALLSIGNS = {

              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "country": "Deutschland"
              },

              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPHWESTFALEN": {
                  "name": "Christoph Westfalen",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "country": "Deutschland"
              },

              "CHRISTOPHDORTMUND": {
                  "name": "Christoph Dortmund",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "country": "Deutschland"
              },

              "CHRISTOPHRHEINLAND": {
                  "name": "Christoph Rheinland",
                  "classification": "rescue",
                  "service": "Intensivtransport-/Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "country": "Deutschland"
              }
          }


          # =====================================================
          # HUBSCHRAUBERTYPEN
          # =====================================================

          ROTOR_TYPES = (
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          )

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "POLITIE",
              "HUMMEL",
              "SAR"
          )


          # =====================================================
          # JSON
          # =====================================================

          def load_json(filename, default):
              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception:
                  return default


          def save_json(filename, data):
              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # ZEIT
          # =====================================================

          def parse_time(value):
              try:
                  if not value:
                      return None

                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:
                  return None


          # =====================================================
          # ENTFERNUNG
          # =====================================================

          def distance_km(lat1, lon1, lat2, lon2):
              radius = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)

              a = (
                  math.sin(dp / 2) ** 2
                  +
                  math.cos(p1)
                  *
                  math.cos(p2)
                  *
                  math.sin(dl / 2) ** 2
              )

              return (
                  2
                  *
                  radius
                  *
                  math.asin(
                      math.sqrt(a)
                  )
              )


          # =====================================================
          # RICHTUNG
          # =====================================================

          def bearing_degrees(lat1, lon1, lat2, lon2):
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dl = math.radians(
                  lon2 - lon1
              )

              y = (
                  math.sin(dl)
                  *
                  math.cos(p2)
              )

              x = (
                  math.cos(p1)
                  *
                  math.sin(p2)
                  -
                  math.sin(p1)
                  *
                  math.cos(p2)
                  *
                  math.cos(dl)
              )

              return (
                  math.degrees(
                      math.atan2(y, x)
                  )
                  +
                  360
              ) % 360


          def direction_name(value):
              directions = [
                  "Nord",
                  "Nordost",
                  "Ost",
                  "Südost",
                  "Süd",
                  "Südwest",
                  "West",
                  "Nordwest"
              ]

              return directions[
                  int(
                      (value + 22.5)
                      //
                      45
                  ) % 8
              ]


          # =====================================================
          # NORMALISIERUNG
          # =====================================================

          def normalize(value):
              return str(
                  value or ""
              ).strip().upper()


          def compact(value):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(value)
              )


          # =====================================================
          # STAMMDATENBANK
          # =====================================================

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )

          if not isinstance(
              aircraft_db,
              dict
          ):
              aircraft_db = {}


          def database_profile(ac):
              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              registration = normalize(
                  ac.get("r")
              )

              registration_compact = compact(
                  registration
              )

              possible_keys = (
                  hexcode,
                  registration,
                  registration_compact
              )

              for key in possible_keys:
                  if not key:
                      continue

                  profile = aircraft_db.get(
                      key
                  )

                  if (
                      isinstance(profile, dict)
                      and
                      profile.get("classification")
                  ):
                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "aircraft_db"

                      return result

              return None


          # =====================================================
          # HUBSCHRAUBERERKENNUNG
          # =====================================================

          def is_rotorcraft(ac):
              if database_profile(ac):
                  return True

              category = normalize(
                  ac.get("category")
              )

              if category == "A7":
                  return True

              ac_type = normalize(
                  ac.get("t")
              )

              if any(
                  rotor_type in ac_type
                  for rotor_type in ROTOR_TYPES
              ):
                  return True

              text = " ".join(
                  normalize(
                      ac.get(key)
                  )
                  for key in (
                      "flight",
                      "r",
                      "desc",
                      "ownOp",
                      "t"
                  )
              )

              if any(
                  word in text
                  for word in ROTOR_WORDS
              ):
                  return True

              return False


          # =====================================================
          # KLASSIFIZIERUNG
          # =====================================================

          def classify(ac):
              profile = database_profile(ac)

              if profile:
                  return profile

              registration = normalize(
                  ac.get("r")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              callsign_key = compact(
                  callsign
              )

              description = normalize(
                  ac.get("desc")
              )

              operator = normalize(
                  ac.get("ownOp")
              )


              # ---------------------------------------------
              # Bekannte Rettungshubschrauber
              # ---------------------------------------------

              for key, profile in KNOWN_CALLSIGNS.items():
                  if key in callsign_key:
                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "callsign"

                      return result


              # ---------------------------------------------
              # Allgemeiner CHRISTOPH-Rufname
              # ---------------------------------------------

              if callsign_key.startswith(
                  "CHRISTOPH"
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Christoph Rettungshubschrauber",

                      "classification":
                          "rescue",

                      "service":
                          "Rettungshubschrauber",

                      "station":
                          None,

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign"
                  }


              # ---------------------------------------------
              # Allgemeiner Lifeliner
              # ---------------------------------------------

              if (
                  callsign_key.startswith(
                      "LIFELINER"
                  )
                  or
                  callsign_key.startswith(
                      "LIFELN"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Lifeliner",

                      "classification":
                          "rescue",

                      "service":
                          "Traumahelikopter",

                      "station":
                          None,

                      "country":
                          "Niederlande",

                      "classification_source":
                          "callsign"
                  }


              # ---------------------------------------------
              # Polizei NRW
              # ---------------------------------------------

              if (
                  callsign_key.startswith(
                      "HUMMEL"
                  )
                  or
                  re.fullmatch(
                      r"NRW\d+",
                      callsign_key
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Polizeihubschrauber NRW",

                      "classification":
                          "police",

                      "service":
                          "Polizeihubschrauber NRW",

                      "station":
                          "Polizeifliegerstaffel NRW",

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign"
                  }


              # ---------------------------------------------
              # Niederländische Polizei
              # ---------------------------------------------

              if (
                  callsign_key.startswith(
                      "POLICE"
                  )
                  or
                  callsign_key.startswith(
                      "ZXP"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Politie Nederland",

                      "classification":
                          "police",

                      "service":
                          "Politiehelikopter",

                      "station":
                          "Dienst Luchtvaartpolitie",

                      "country":
                          "Niederlande",

                      "classification_source":
                          "callsign"
                  }


              # ---------------------------------------------
              # Bundespolizei
              # ---------------------------------------------

              if (
                  re.fullmatch(
                      r"BPO\d+",
                      callsign_key
                  )
                  or
                  "BUNDESPOLIZEI"
                  in operator
                  or
                  "BUNDESPOLIZEI"
                  in description
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Bundespolizei",

                      "classification":
                          "police",

                      "service":
                          "Bundespolizei-Flugdienst",

                      "station":
                          None,

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign/metadata"
                  }


              # ---------------------------------------------
              # Sonstige Polizei
              # ---------------------------------------------

              police_text = " ".join(
                  (
                      callsign,
                      description,
                      operator
                  )
              )

              if any(
                  word in police_text
                  for word in (
                      "POLICE",
                      "POLIZEI",
                      "BUNDESPOLIZEI",
                      "POLITIE"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Polizeihubschrauber",

                      "classification":
                          "police",

                      "service":
                          "Polizei",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              # ---------------------------------------------
              # Militär / SAR
              # ---------------------------------------------

              military_text = " ".join(
                  (
                      callsign,
                      description,
                      operator
                  )
              )

              if any(
                  word in military_text
                  for word in (
                      "SAR",
                      "MILITARY",
                      "ARMY",
                      "AIR FORCE",
                      "LUFTWAFFE",
                      "BUNDESWEHR",
                      "NAVY",
                      "KONINKLIJKE LUCHTMACHT",
                      "ROYAL NETHERLANDS AIR FORCE"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Militärhubschrauber",

                      "classification":
                          "military",

                      "service":
                          "Militär / SAR",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              return {
                  "name":
                      callsign
                      or
                      registration
                      or
                      "Unbekannter Hubschrauber",

                  "classification":
                      "unknown",

                  "service":
                      "noch nicht bestimmt",

                  "station":
                      None,

                  "country":
                      None,

                  "classification_source":
                      "unknown"
              }


          # =====================================================
          # ADSB.LOL
          # =====================================================

          try:
              request = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                          f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=25
              ) as response:
                  source = json.load(
                      response
                  )

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "total":
                      len(aircraft),

                  "ac":
                      aircraft
              }

          except Exception as error:
              print(
                  "ADSB.lol Fehler:",
                  repr(error)
              )

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "error":
                      str(error),

                  "total":
                      0,

                  "ac":
                      []
              }


          save_json(
              AIRCRAFT_FILE,
              output
          )


          # =====================================================
          # BESTEHENDE DATEN LADEN
          # =====================================================

          history = load_json(
              HISTORY_FILE,
              []
          )

          background = load_json(
              BACKGROUND_FILE,
              []
          )

          states = load_json(
              FLIGHT_STATE_FILE,
              {}
          )

          pushes = load_json(
              PUSH_STATE_FILE,
              {}
          )

          unknown = load_json(
              UNKNOWN_FILE,
              {}
          )

          if not isinstance(history, list):
              history = []

          if not isinstance(background, list):
              background = []

          if not isinstance(states, dict):
              states = {}

          if not isinstance(pushes, dict):
              pushes = {}

          if not isinstance(unknown, dict):
              unknown = {}


          # =====================================================
          # ALTE HISTORIE BEREINIGEN
          # =====================================================

          def clean(entries, cutoff):
              cleaned = []

              for item in entries:
                  timestamp = parse_time(
                      item.get("timestamp")
                  )

                  if (
                      timestamp
                      and
                      timestamp >= cutoff
                  ):
                      cleaned.append(
                          item
                      )

              return cleaned


          history = clean(
              history,
              now - timedelta(days=14)
          )

          background = clean(
              background,
              now - timedelta(days=2)
          )


          # =====================================================
          # HILFSFUNKTION HISTORIE
          # =====================================================

          def recent_same(
              entries,
              identity,
              seconds=120
          ):
              for old in reversed(
                  entries
              ):
                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  return bool(
                      old_time
                      and
                      (
                          now - old_time
                      ).total_seconds()
                      <
                      seconds
                  )

              return False


          # =====================================================
          # VERARBEITUNG
          # =====================================================

          current = []
          detected = []

          rotor_count = 0


          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(ac):
                  continue

              rotor_count += 1


              lat = ac.get("lat")
              lon = ac.get("lon")

              if not isinstance(
                  lat,
                  (int, float)
              ):
                  continue

              if not isinstance(
                  lon,
                  (int, float)
              ):
                  continue


              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              registration = str(
                  ac.get("r")
                  or ""
              ).strip()

              callsign = str(
                  ac.get("flight")
                  or ""
              ).strip()

              identity = (
                  hexcode
                  or
                  compact(registration)
                  or
                  compact(callsign)
              )

              if not identity:
                  continue


              ac_type = str(
                  ac.get("t")
                  or ""
              ).strip().upper()

              category = str(
                  ac.get("category")
                  or ""
              ).strip().upper()

              description = str(
                  ac.get("desc")
                  or ""
              ).strip()

              operator = str(
                  ac.get("ownOp")
                  or ""
              ).strip()


              distance = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      lat,
                      lon
                  ),
                  1
              )


              profile = classify(
                  ac
              )

              classification = profile.get(
                  "classification",
                  "unknown"
              )

              relevant = (
                  classification
                  in (
                      "rescue",
                      "police",
                      "military"
                  )
              )


              # =================================================
              # BISHERIGER ZUSTAND
              # =================================================

              previous = states.get(
                  identity,
                  {}
              )

              previous_seen = parse_time(
                  previous.get(
                      "last_seen"
                  )
              )


              # =================================================
              # NEUER FLUG?
              # =================================================

              new_flight = False

              if not previous_seen:
                  new_flight = True

              else:
                  gap_seconds = (
                      now - previous_seen
                  ).total_seconds()

                  if (
                      gap_seconds
                      >
                      NEW_FLIGHT_AFTER_MINUTES
                      *
                      60
                  ):
                      new_flight = True


              if new_flight:
                  segment_id = (
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      now.isoformat()
                  )

                  first_distance = (
                      distance
                  )

                  minimum_distance = (
                      distance
                  )

                  entered_30km = None

                  # Für einen neuen Flug darf innerhalb 30 km
                  # sofort alarmiert werden.
                  alert_sent_for_segment = False

                  # Außerhalb des Bereichs ist ein späterer
                  # Eintritt automatisch scharf.
                  reentry_armed = (
                      distance
                      >
                      REENTRY_ARM_DISTANCE_KM
                  )

              else:
                  segment_id = (
                      previous.get(
                          "segment_id"
                      )
                      or
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      previous.get(
                          "first_seen"
                      )
                      or
                      now.isoformat()
                  )

                  first_distance = (
                      previous.get(
                          "first_seen_distance_km",
                          distance
                      )
                  )

                  old_minimum = (
                      previous.get(
                          "minimum_distance_km",
                          distance
                      )
                  )

                  if not isinstance(
                      old_minimum,
                      (int, float)
                  ):
                      old_minimum = (
                          distance
                      )

                  minimum_distance = min(
                      old_minimum,
                      distance
                  )

                  entered_30km = (
                      previous.get(
                          "entered_30km"
                      )
                  )

                  alert_sent_for_segment = bool(
                      previous.get(
                          "alert_sent_for_segment",
                          False
                      )
                  )

                  reentry_armed = bool(
                      previous.get(
                          "reentry_armed",
                          False
                      )
                  )


              # =================================================
              # 30-KM-ZUSTAND
              # =================================================

              inside = (
                  distance
                  <=
                  ACTION_RADIUS_KM
              )


              # Maschine war wirklich außerhalb.
              # Damit ist ein späterer Wiedereinflug alarmfähig.
              if (
                  distance
                  >
                  REENTRY_ARM_DISTANCE_KM
              ):
                  reentry_armed = True


              if (
                  inside
                  and
                  not entered_30km
              ):
                  entered_30km = (
                      now.isoformat()
                  )


              # =================================================
              # BEWEGUNG
              # =================================================

              movement_bearing = None
              movement_direction = None
              approaching_goch = None
              distance_change = None


              previous_lat = previous.get(
                  "last_lat"
              )

              previous_lon = previous.get(
                  "last_lon"
              )

              previous_distance = (
                  previous.get(
                      "last_distance_km"
                  )
              )


              if (
                  isinstance(
                      previous_lat,
                      (int, float)
                  )
                  and
                  isinstance(
                      previous_lon,
                      (int, float)
                  )
              ):
                  movement_bearing = round(
                      bearing_degrees(
                          previous_lat,
                          previous_lon,
                          lat,
                          lon
                      ),
                      1
                  )

                  movement_direction = (
                      direction_name(
                          movement_bearing
                      )
                  )


              if isinstance(
                  previous_distance,
                  (int, float)
              ):
                  distance_change = round(
                      distance
                      -
                      previous_distance,
                      1
                  )

                  if distance_change < -0.5:
                      approaching_goch = True

                  elif distance_change > 0.5:
                      approaching_goch = False


              # =================================================
              # PUSH-ENTSCHEIDUNG
              # =================================================

              push_reason = None
              allow_push = False


              if relevant and inside:

                  # Fall 1:
                  # Neuer Flug wird erstmals innerhalb
                  # des 30-km-Gebiets gesehen.

                  if (
                      new_flight
                      and
                      not alert_sent_for_segment
                  ):
                      allow_push = True

                      push_reason = (
                          "neuer Flug erstmals "
                          "innerhalb 30 km erkannt"
                      )


                  # Fall 2:
                  # Laufender Flug war mindestens 32 km weg
                  # und kommt wieder in den 30-km-Bereich.

                  elif (
                      reentry_armed
                      and
                      not previous.get(
                          "inside_30km",
                          False
                      )
                  ):
                      allow_push = True

                      push_reason = (
                          "neuer 30-km-Eintritt"
                      )


              # =================================================
              # EINTRAG
              # =================================================

              entry = {
                  "timestamp":
                      now.isoformat(),

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "hex":
                      hexcode,

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "description":
                      description,

                  "type":
                      ac_type,

                  "category":
                      category,

                  "lat":
                      lat,

                  "lon":
                      lon,

                  "distance_km":
                      distance,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get(
                          "alt_baro"
                      ),

                  "ground_speed":
                      ac.get(
                          "gs"
                      ),

                  "track":
                      ac.get(
                          "track"
                      ),

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change,

                  "approaching_goch":
                      approaching_goch,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "new_flight":
                      new_flight,

                  "push_reason":
                      push_reason,

                  "last_seen":
                      now.isoformat()
              }


              # =================================================
              # UNBEKANNTE HUBSCHRAUBER
              # =================================================

              if (
                  classification
                  ==
                  "unknown"
              ):
                  old_unknown = unknown.get(
                      identity,
                      {}
                  )

                  old_minimum = (
                      old_unknown.get(
                          "minimum_distance_km"
                      )
                  )

                  if not isinstance(
                      old_minimum,
                      (int, float)
                  ):
                      old_minimum = (
                          distance
                      )

                  unknown[identity] = {
                      "identity":
                          identity,

                      "hex":
                          hexcode,

                      "registration":
                          registration,

                      "callsign":
                          callsign,

                      "type":
                          ac_type,

                      "category":
                          category,

                      "description":
                          description,

                      "operator":
                          operator,

                      "first_seen":
                          old_unknown.get(
                              "first_seen"
                          )
                          or
                          now.isoformat(),

                      "last_seen":
                          now.isoformat(),

                      "last_lat":
                          lat,

                      "last_lon":
                          lon,

                      "last_distance_km":
                          distance,

                      "minimum_distance_km":
                          min(
                              old_minimum,
                              distance
                          ),

                      "inside_30km":
                          inside,

                      "status":
                          "needs_identification"
                  }


              # =================================================
              # 80-KM-HINTERGRUND
              # =================================================

              if not recent_same(
                  background,
                  identity
              ):
                  background.append(
                      entry
                  )


              # =================================================
              # 30-KM-HISTORIE
              # =================================================

              if (
                  relevant
                  and
                  inside
              ):
                  if not recent_same(
                      history,
                      identity
                  ):
                      history.append(
                          entry
                      )

                  current.append(
                      entry
                  )


              # =================================================
              # PUSH
              # =================================================

              if allow_push:

                  detected.append(
                      entry
                  )

                  alert_sent_for_segment = True

                  # Nach erfolgreicher Entscheidung ist
                  # der Wiedereinflug zunächst wieder gesperrt.
                  reentry_armed = False

                  pushes[identity] = {
                      "timestamp":
                          now.isoformat(),

                      "segment_id":
                          segment_id,

                      "reason":
                          push_reason,

                      "name":
                          profile.get(
                              "name"
                          ),

                      "distance_km":
                          distance
                  }


              # =================================================
              # DIAGNOSE
              # =================================================

              if relevant:

                  if allow_push:
                      push_status = (
                          "JA"
                      )

                  else:
                      push_status = (
                          "NEIN"
                      )


                  print(
                      "STATUS:",
                      profile.get(
                          "name"
                      ),
                      "|",
                      registration
                      or
                      callsign
                      or
                      identity,
                      "|",
                      distance,
                      "km",
                      "| innerhalb:",
                      inside,
                      "| neuer Flug:",
                      new_flight,
                      "| Wiedereinflug scharf:",
                      reentry_armed,
                      "| Push:",
                      push_status,
                      "| Grund:",
                      push_reason
                      or
                      "-"
                  )


              # =================================================
              # FLIGHT STATE
              # =================================================

              states[identity] = {
                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      lat,

                  "last_lon":
                      lon,

                  "last_distance_km":
                      distance,

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change,

                  "approaching_goch":
                      approaching_goch,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant,

                  "alert_sent_for_segment":
                      alert_sent_for_segment,

                  "reentry_armed":
                      reentry_armed
              }


          # =====================================================
          # ALTE STATES ENTFERNEN
          # =====================================================

          state_cutoff = (
              now
              -
              timedelta(days=2)
          )

          cleaned_states = {}

          for identity, state in states.items():
              timestamp = parse_time(
                  state.get(
                      "last_seen"
                  )
              )

              if (
                  timestamp
                  and
                  timestamp
                  >=
                  state_cutoff
              ):
                  cleaned_states[
                      identity
                  ] = state

          states = cleaned_states


          # =====================================================
          # ALTE PUSH-DATEN ENTFERNEN
          # =====================================================

          push_cutoff = (
              now
              -
              timedelta(days=14)
          )

          cleaned_pushes = {}

          for identity, item in pushes.items():

              if isinstance(
                  item,
                  str
              ):
                  timestamp = parse_time(
                      item
                  )

              elif isinstance(
                  item,
                  dict
              ):
                  timestamp = parse_time(
                      item.get(
                          "timestamp"
                      )
                  )

              else:
                  timestamp = None

              if (
                  timestamp
                  and
                  timestamp
                  >=
                  push_cutoff
              ):
                  cleaned_pushes[
                      identity
                  ] = item

          pushes = cleaned_pushes


          # =====================================================
          # SORTIEREN
          # =====================================================

          history.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )

          background.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          # =====================================================
          # SPEICHERN
          # =====================================================

          save_json(
              HISTORY_FILE,
              history
          )

          save_json(
              BACKGROUND_FILE,
              background
          )

          save_json(
              FLIGHT_STATE_FILE,
              states
          )

          save_json(
              PUSH_STATE_FILE,
              pushes
          )

          save_json(
              UNKNOWN_FILE,
              unknown
          )

          save_json(
              DETECTED_FILE,
              detected
          )

          save_json(
              CURRENT_FILE,
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "aircraft":
                      current
              }
          )


          # =====================================================
          # ZUSAMMENFASSUNG
          # =====================================================

          print(
              "=========================================="
          )

          print(
              "Luftrettung Goch V4.7"
          )

          print(
              "=========================================="
          )

          print(
              "ADSB-Luftfahrzeuge im 80-km-Bereich:",
              output.get(
                  "total",
                  0
              )
          )

          print(
              "Erkannte Hubschrauber:",
              rotor_count
          )

          print(
              "Relevante Hubschrauber im 30-km-Bereich:",
              len(
                  current
              )
          )

          print(
              "Telegram-Push-Kandidaten:",
              len(
                  detected
              )
          )

          print(
              "=========================================="
          )
          PY


      # =========================================================
      # TELEGRAM
      # =========================================================

      - name: Telegram Nachricht senden
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request


          token = os.environ.get(
              "TELEGRAM_BOT_TOKEN",
              ""
          ).strip()

          chat_id = os.environ.get(
              "TELEGRAM_CHAT_ID",
              ""
          ).strip()


          if not token or not chat_id:
              raise RuntimeError(
                  "TELEGRAM_BOT_TOKEN oder "
                  "TELEGRAM_CHAT_ID fehlt."
              )


          def send(text):

              url = (
                  "https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )

              data = urllib.parse.urlencode(
                  {
                      "chat_id":
                          chat_id,

                      "text":
                          text,

                      "disable_web_page_preview":
                          "true"
                  }
              ).encode(
                  "utf-8"
              )

              request = urllib.request.Request(
                  url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  http_status = (
                      response.status
                  )

                  result = json.load(
                      response
                  )


              if not result.get(
                  "ok"
              ):
                  raise RuntimeError(
                      "Telegram-Fehler: "
                      +
                      str(
                          result
                      )
                  )


              message_id = (
                  result
                  .get(
                      "result",
                      {}
                  )
                  .get(
                      "message_id"
                  )
              )


              print(
                  "Telegram HTTP:",
                  http_status,
                  "| message_id:",
                  message_id
              )


              return result


          # =====================================================
          # MANUELLER TEST
          # =====================================================

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              ==
              "workflow_dispatch"
          ):

              send(
                  "🚁 Luftrettung KLE – V4.7 Test\n\n"
                  "Version 4.7 läuft.\n"
                  "80-km-Hintergrundüberwachung aktiv.\n"
                  "30-km-Einsatzalarm aktiv.\n"
                  "Neue Flugsegment-Erkennung aktiv.\n"
                  "Wiedereinflug-Erkennung aktiv.\n"
                  "Polizei-/Bundespolizei-Erkennung aktiv.\n"
                  "aircraft_db.json aktiv.\n"
                  "Telegram-Verbindung funktioniert."
              )

              print(
                  "Telegram-Testnachricht "
                  "erfolgreich gesendet."
              )

              raise SystemExit(
                  0
              )


          # =====================================================
          # AUTOMATISCHE MELDUNGEN
          # =====================================================

          try:
              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as file:
                  detected = json.load(
                      file
                  )

          except Exception as error:
              print(
                  "detected.json Fehler:",
                  repr(
                      error
                  )
              )

              detected = []


          if not detected:
              print(
                  "Keine relevante neue "
                  "Erkennung – keine "
                  "Telegram-Nachricht nötig."
              )

              raise SystemExit(
                  0
              )


          for item in detected:

              name = (
                  item.get(
                      "name"
                  )
                  or
                  "Hubschrauber"
              )

              registration = (
                  item.get(
                      "registration"
                  )
                  or
                  "unbekannt"
              )

              callsign = (
                  item.get(
                      "callsign"
                  )
                  or
                  "unbekannt"
              )

              service = (
                  item.get(
                      "service"
                  )
                  or
                  "unbekannt"
              )

              station = (
                  item.get(
                      "station"
                  )
                  or
                  "noch nicht bestimmt"
              )

              country = (
                  item.get(
                      "country"
                  )
                  or
                  "unbekannt"
              )

              distance = item.get(
                  "distance_km"
              )

              first_distance = item.get(
                  "first_seen_distance_km"
              )

              minimum_distance = item.get(
                  "minimum_distance_km"
              )

              direction = (
                  item.get(
                      "movement_direction"
                  )
                  or
                  "noch unbekannt"
              )

              approaching = item.get(
                  "approaching_goch"
              )

              reason = (
                  item.get(
                      "push_reason"
                  )
                  or
                  "neue Erkennung"
              )


              if approaching is True:
                  movement = (
                      "nähert sich Goch"
                  )

              elif approaching is False:
                  movement = (
                      "entfernt sich von Goch"
                  )

              else:
                  movement = (
                      "Bewegung noch nicht bestimmbar"
                  )


              text = (
                  f"🚁 {name} im 30-km-Radius erkannt\n\n"
                  f"Art: {service}\n"
                  f"Kennzeichen: {registration}\n"
                  f"Rufname: {callsign}\n"
                  f"Station: {station}\n"
                  f"Land: {country}\n\n"
                  f"Jetzt: {distance} km von Goch\n"
                  f"Erstmals erfasst: {first_distance} km\n"
                  f"Bisher nächste Entfernung: {minimum_distance} km\n"
                  f"Flugrichtung: {direction}\n"
                  f"Status: {movement}\n\n"
                  f"Alarmgrund: {reason}"
              )


              result = send(
                  text
              )


              message_id = (
                  result
                  .get(
                      "result",
                      {}
                  )
                  .get(
                      "message_id"
                  )
              )


              print(
                  "TELEGRAM GESENDET:",
                  name,
                  "|",
                  registration,
                  "| message_id:",
                  message_id,
                  "| Grund:",
                  reason
              )

          PY


      # =========================================================
      # REPOSITORY AKTUALISIEREN
      # =========================================================

      - name: Neue Daten speichern
        shell: bash
        run: |

          git config \
            user.name \
            "Luftrettung-Kleve Bot"

          git config \
            user.email \
            "actions@github.com"


          git add \
            aircraft.json \
            history.json \
            background_history.json \
            flight_state.json \
            current_rotorcraft.json \
            push_state.json \
            unknown_aircraft.json \
            aircraft_db.json \
            detected.json


          if git diff --cached --quiet; then

            echo "Keine Änderung vorhanden."

          else

            git commit \
              -m "Luftrettung V4.7 Flugdaten aktualisiert"


            git pull \
              --rebase \
              origin main


            git push \
              origin main

          fi
