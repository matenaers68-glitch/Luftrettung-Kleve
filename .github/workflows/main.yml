          git config \
            user.name \
            "Luftrettung-Kleve Bot"

          git config \
            user.email \
            "actions@github.com"


          git add \
            aircraft.json \
            history.json \
            background_history.json \
            flight_state.json \
            current_rotorcraft.json \
            push_state.json \
            unknown_aircraft.json


          if [ -f aircraft_db.json ]; then

            git add \
              aircraft_db.json

          fi


          if git diff --cached --quiet; then

            echo "Keine Änderung vorhanden."

          else

            git commit \
              -m "Luftrettung V4.2 Flugdaten aktualisiert"


            git pull \
              --rebase \
              origin main


            git push \
              origin main

          fi
