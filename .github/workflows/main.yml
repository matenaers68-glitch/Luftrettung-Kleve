                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "new_flight":
                      new_flight,

                  "push_reason":
                      push_reason,

                  "last_seen":
                      now.isoformat()
              }


              # =================================================
              # UNBEKANNTE HUBSCHRAUBER
              # =================================================

              if classification == "unknown":

                  old_unknown = unknown.get(
