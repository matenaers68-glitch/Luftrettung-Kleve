                  # Hintergrundpositionen brauchen
                  # kein Reverse-Geocoding.

                  if not should_store_history:
                      background_entry[
                          "location"
                      ] = None

                  background.append(
                      background_entry
                  )


              # =================================================
              # 30-KM-HISTORIE
              # =================================================

              if (
                  relevant
                  and
                  inside
              ):

                  if should_store_history:

                      history.append(
                          entry
                      )


                  current.append(
                      entry
                  )


              # =================================================
              # PUSH
              # =================================================

              if allow_push:

                  detected.append(
                      entry
                  )

                  alert_sent_for_segment = True

                  reentry_armed = False


                  pushes[
                      identity
                  ] = {

                      "timestamp":
                          now.isoformat(),

                      "segment_id":
                          segment_id,

                      "reason":
                          push_reason,

                      "name":
                          profile.get(
                              "name"
                          ),

                      "distance_km":
                          distance
                  }


              # =================================================
              # DIAGNOSE
              # =================================================

              if relevant:

                  print(
                      "STATUS:",
                      profile.get(
                          "name"
                      ),
                      "|",
                      registration
                      or
                      callsign
                      or
                      identity,
                      "|",
                      distance,
                      "km",
                      "| innerhalb:",
                      inside,
                      "| neuer Flug:",
                      new_flight,
                      "| Push:",
                      "JA"
                      if allow_push
                      else
                      "NEIN",
                      "| Ort:",
                      (
                          location.get(
                              "display"
                          )
                          if isinstance(
                              location,
                              dict
                          )
                          else "-"
                      ),
                      "| Grund:",
                      push_reason
                      or
                      "-"
                  )


              # =================================================
              # FLIGHT STATE
              # =================================================

              states[
                  identity
              ] = {

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      lat,

                  "last_lon":
                      lon,

                  "last_distance_km":
                      distance,

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change,

                  "approaching_goch":
                      approaching_goch,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant,

                  "alert_sent_for_segment":
                      alert_sent_for_segment,

                  "reentry_armed":
                      reentry_armed
              }


          # =====================================================
          # ALTE STATES ENTFERNEN
          # =====================================================

          state_cutoff = (
              now
              -
              timedelta(days=2)
          )


          states = {
              identity: state
              for identity, state in states.items()
              if (
                  parse_time(
                      state.get(
                          "last_seen"
                      )
                  )
                  and
                  parse_time(
                      state.get(
                          "last_seen"
                      )
                  )
                  >=
                  state_cutoff
              )
          }


          # =====================================================
          # ALTE PUSH-DATEN ENTFERNEN
          # =====================================================

          push_cutoff = (
              now
              -
              timedelta(days=14)
          )


          cleaned_pushes = {}


          for identity, item in pushes.items():

              if isinstance(
                  item,
                  str
              ):

                  timestamp = parse_time(
                      item
                  )

              elif isinstance(
                  item,
                  dict
              ):

                  timestamp = parse_time(
                      item.get(
                          "timestamp"
                      )
                  )

              else:

                  timestamp = None


              if (
                  timestamp
                  and
                  timestamp >= push_cutoff
              ):

                  cleaned_pushes[
                      identity
                  ] = item


          pushes = cleaned_pushes


          # =====================================================
          # SORTIEREN
          # =====================================================

          history.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          background.sort(
              key=lambda item:
                  item.get(
                      "timestamp",
                      ""
                  )
          )


          # =====================================================
          # SPEICHERN
          # =====================================================

          save_json(
              HISTORY_FILE,
              history
          )

          save_json(
              BACKGROUND_FILE,
              background
          )

          save_json(
              FLIGHT_STATE_FILE,
              states
          )

          save_json(
              PUSH_STATE_FILE,
              pushes
          )

          save_json(
              UNKNOWN_FILE,
              unknown
          )

          save_json(
              DETECTED_FILE,
              detected
          )

          save_json(
              GEOCODE_CACHE_FILE,
              geocode_cache
          )


          save_json(
              CURRENT_FILE,
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "aircraft":
                      current
              }
          )


          # =====================================================
          # ZUSAMMENFASSUNG
          # =====================================================

          print(
              "=========================================="
          )

          print(
              "Luftrettung Goch V4.8"
          )

          print(
              "=========================================="
          )

          print(
              "ADSB-Luftfahrzeuge im 80-km-Bereich:",
              output.get(
                  "total",
                  0
              )
          )

          print(
              "Erkannte Hubschrauber:",
              rotor_count
          )

          print(
              "Relevante Hubschrauber im 30-km-Bereich:",
