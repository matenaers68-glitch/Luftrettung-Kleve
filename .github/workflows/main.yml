      # DATEIEN SPEICHERN
      # =====================================================

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add \
            aircraft.json \
            history.json \
            flight_state.json \
            current_rotorcraft.json \
            push_state.json

          if git diff --cached --quiet; then

            echo "Keine Änderung vorhanden."

          else

            git commit \
              -m "Luftrettung V4.1 Flugdaten aktualisiert"

            git pull \
              --rebase \
              origin main

            git push \
              origin main

          fi
