name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # REPOSITORY
      # =====================================================

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # FLUGDATEN
      # =====================================================

      - name: Flugdaten V4.2 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'

          import json
          import urllib.request
          import math
          import os
          import re

          from datetime import (
              datetime,
              timezone,
              timedelta
          )


          # =================================================
          # VERSION
          # =================================================

          VERSION = "4.2"


          # =================================================
          # MITTELPUNKT GOCH
          # =================================================

          GOCH_LAT = 51.678
          GOCH_LON = 6.159


          # =================================================
          # RADII
          # =================================================

          ACTION_RADIUS_KM = 30

          BACKGROUND_RADIUS_KM = 80

          BACKGROUND_RADIUS_NM = round(
              BACKGROUND_RADIUS_KM / 1.852,
              1
          )


          URL = (
              "https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{BACKGROUND_RADIUS_NM}"
          )


          now = datetime.now(
              timezone.utc
          )


          # =================================================
          # DATEIEN
          # =================================================

          AIRCRAFT_FILE = (
              "aircraft.json"
          )

          HISTORY_FILE = (
              "history.json"
          )

          BACKGROUND_FILE = (
              "background_history.json"
          )

          CURRENT_FILE = (
              "current_rotorcraft.json"
          )

          FLIGHT_STATE_FILE = (
              "flight_state.json"
          )

          PUSH_STATE_FILE = (
              "push_state.json"
          )

          DETECTED_FILE = (
              "detected.json"
          )

          DATABASE_FILE = (
              "aircraft_db.json"
          )

          UNKNOWN_FILE = (
              "unknown_aircraft.json"
          )


          # =================================================
          # BEKANNTE RUFNAMEN
          # =================================================

          KNOWN_CALLSIGNS = {

              "LIFELINER3": {

                  "name":
                      "Lifeliner 3",

                  "classification":
                      "rescue",

                  "service":
                      "Traumahelikopter",

                  "station":
                      "Volkel",

                  "country":
                      "Niederlande"

              },


              "LIFELN3": {

                  "name":
                      "Lifeliner 3",

                  "classification":
                      "rescue",

                  "service":
                      "Traumahelikopter",

                  "station":
                      "Volkel",

                  "country":
                      "Niederlande"

              },


              "CHRISTOPH9": {

                  "name":
                      "Christoph 9",

                  "classification":
                      "rescue",

                  "service":
                      "Rettungshubschrauber",

                  "station":
                      "Duisburg-Buchholz",

                  "country":
                      "Deutschland"

              },


              "CHRISTOPH8": {

                  "name":
                      "Christoph 8",

                  "classification":
                      "rescue",

                  "service":
                      "Rettungshubschrauber",

                  "station":
                      "Lünen",

                  "country":
                      "Deutschland"

              },


              "CHRISTOPH3": {

                  "name":
                      "Christoph 3",

                  "classification":
                      "rescue",

                  "service":
                      "Rettungshubschrauber",

                  "station":
                      "Köln",

                  "country":
                      "Deutschland"

              },


              "CHRISTOPHWESTFALEN": {

                  "name":
                      "Christoph Westfalen",

                  "classification":
                      "rescue",

                  "service":
                      "Intensivtransporthubschrauber",

                  "station":
                      "Greven",

                  "country":
                      "Deutschland"

              },


              "CHRISTOPHDORTMUND": {

                  "name":
                      "Christoph Dortmund",

                  "classification":
                      "rescue",

                  "service":
                      "Intensivtransporthubschrauber",

                  "station":
                      "Dortmund",

                  "country":
                      "Deutschland"

              }

          }


          # =================================================
          # HUBSCHRAUBERTYPEN
          # =================================================

          ROTOR_TYPES = (

              "EC35",
              "EC45",

              "H135",
              "H145",

              "EC135",
              "EC145",

              "BK17",

              "B06",
              "B407",

              "AS50",
              "AS55",

              "R22",
              "R44",
              "R66",

              "AW09",
              "AW109",
              "AW139",
              "AW169",

              "S76",
              "S92"

          )


          ROTOR_WORDS = (

              "HELI",

              "ROTOR",

              "CHRISTOPH",

              "LIFELINER",

              "LIFELN",

              "POLICE",

              "POLIZEI",

              "SAR"

          )


          # =================================================
          # JSON LADEN
          # =================================================

          def load_json(
              filename,
              default
          ):

              if not os.path.exists(
                  filename
              ):

                  return default


              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(
                          f
                      )


              except Exception as e:

                  print(
                      filename,
                      "konnte nicht gelesen werden:",
                      repr(e)
                  )

                  return default


          # =================================================
          # JSON SPEICHERN
          # =================================================

          def save_json(
              filename,
              data
          ):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =================================================
          # ZEIT
          # =================================================

          def parse_time(value):

              if not value:

                  return None


              try:

                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )


              except Exception:

                  return None


          # =================================================
          # ENTFERNUNG
          # =================================================

          def distance_km(
              lat1,
              lon1,
              lat2,
              lon2
          ):

              radius = 6371.0


              p1 = math.radians(
                  lat1
              )

              p2 = math.radians(
                  lat2
              )


              dp = math.radians(
                  lat2 - lat1
              )


              dl = math.radians(
                  lon2 - lon1
              )


              a = (

                  math.sin(
                      dp / 2
                  ) ** 2

                  +

                  math.cos(
                      p1
                  )

                  *

                  math.cos(
                      p2
                  )

                  *

                  math.sin(
                      dl / 2
                  ) ** 2

              )


              return (

                  2

                  *

                  radius

                  *

                  math.asin(
                      math.sqrt(
                          a
                      )
                  )

              )


          # =================================================
          # BEARING
          # =================================================

          def bearing_degrees(
              lat1,
              lon1,
              lat2,
              lon2
          ):

              p1 = math.radians(
                  lat1
              )

              p2 = math.radians(
                  lat2
              )

              dl = math.radians(
                  lon2 - lon1
              )


              y = (
                  math.sin(dl)
                  *
                  math.cos(p2)
              )


              x = (

                  math.cos(p1)
                  *
                  math.sin(p2)

                  -

                  math.sin(p1)
                  *
                  math.cos(p2)
                  *
                  math.cos(dl)

              )


              angle = math.degrees(
                  math.atan2(
                      y,
                      x
                  )
              )


              return (
                  angle + 360
              ) % 360


          # =================================================
          # HIMMELSRICHTUNG
          # =================================================

          def direction_name(
              bearing
          ):

              directions = [

                  "Nord",

                  "Nordost",

                  "Ost",

                  "Südost",

                  "Süd",

                  "Südwest",

                  "West",

                  "Nordwest"

              ]


              index = int(
                  (
                      bearing + 22.5
                  )
                  //
                  45
              ) % 8


              return directions[
                  index
              ]


          # =================================================
          # NORMALISIERUNG
          # =================================================

          def normalize(value):

              return str(
                  value or ""
              ).strip().upper()


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(
                      value
                  )
              )


          # =================================================
          # IDENTITÄT
          # =================================================

          def get_identity(ac):

              hexcode = str(
                  ac.get(
                      "hex"
                  )
                  or ""
              ).strip().lower()


              registration = compact(
                  ac.get(
                      "r"
                  )
              )


              callsign = compact(
                  ac.get(
                      "flight"
                  )
              )


              return (

                  hexcode

                  or registration

                  or callsign

              )


          # =================================================
          # HUBSCHRAUBER ERKENNEN
          # =================================================

          def is_rotorcraft(ac):

              category = normalize(
                  ac.get(
                      "category"
                  )
              )


              ac_type = normalize(
                  ac.get(
                      "t"
                  )
              )


              callsign = normalize(
                  ac.get(
                      "flight"
                  )
              )


              registration = normalize(
                  ac.get(
                      "r"
                  )
              )


              description = normalize(
                  ac.get(
                      "desc"
                  )
              )


              if category == "A7":

                  return True


              for rotor_type in ROTOR_TYPES:

                  if rotor_type in ac_type:

                      return True


              text = " ".join([

                  callsign,

                  registration,

                  description,

                  ac_type

              ])


              for word in ROTOR_WORDS:

                  if word in text:

                      return True


              return False


          # =================================================
          # DATENBANK
          # =================================================

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )


          if not isinstance(
              aircraft_db,
              dict
          ):

              aircraft_db = {}


          # =================================================
          # KLASSIFIZIERUNG
          # =================================================

          def classify_aircraft(ac):

              registration = normalize(
                  ac.get(
                      "r"
                  )
              )


              callsign = normalize(
                  ac.get(
                      "flight"
                  )
              )


              hexcode = str(
                  ac.get(
                      "hex"
                  )
                  or ""
              ).strip().lower()


              description = normalize(
                  ac.get(
                      "desc"
                  )
              )


              operator = normalize(
                  ac.get(
                      "ownOp"
                  )
              )


              reg_key = compact(
                  registration
              )


              callsign_key = compact(
                  callsign
              )


              # ---------------------------------------------
              # 1. EIGENE DATENBANK
              # ---------------------------------------------

              possible_keys = [

                  hexcode,

                  reg_key,

                  registration

              ]


              for key in possible_keys:

                  if (
                      key
                      and
                      key in aircraft_db
                  ):

                      result = aircraft_db[
                          key
                      ].copy()


                      result[
                          "classification_source"
                      ] = "aircraft_db"


                      return result


              # ---------------------------------------------
              # 2. BEKANNTER RUFNAME
              # ---------------------------------------------

              for key, profile in KNOWN_CALLSIGNS.items():

                  if key in callsign_key:

                      result = profile.copy()


                      result[
                          "classification_source"
                      ] = "callsign"


                      return result


              # ---------------------------------------------
              # 3. POLIZEI
              # ---------------------------------------------

              police_text = " ".join([

                  callsign,

                  description,

                  operator

              ])


              police_words = (

                  "POLICE",

                  "POLIZEI",

                  "BUNDESPOLIZEI",

                  "POLITIE"

              )


              if any(
                  word in police_text
                  for word in police_words
              ):

                  return {

                      "name":
                          callsign
                          or registration
                          or "Polizeihubschrauber",

                      "classification":
                          "police",

                      "service":
                          "Polizei",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"

                  }


              # ---------------------------------------------
              # 4. MILITÄR / SAR
              # ---------------------------------------------

              military_text = " ".join([

                  callsign,

                  description,

                  operator

              ])


              military_words = (

                  "SAR",

                  "MILITARY",

                  "ARMY",

                  "AIR FORCE",

                  "LUFTWAFFE",

                  "BUNDESWEHR",

                  "NAVY",

                  "KONINKLIJKE LUCHTMACHT",

                  "ROYAL NETHERLANDS AIR FORCE"

              )


              if any(
                  word in military_text
                  for word in military_words
              ):

                  return {

                      "name":
                          callsign
                          or registration
                          or "Militärhubschrauber",

                      "classification":
                          "military",

                      "service":
                          "Militär / SAR",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"

                  }


              # ---------------------------------------------
              # 5. UNBEKANNT
              # ---------------------------------------------

              return {

                  "name":
                      callsign
                      or registration
                      or "Unbekannter Hubschrauber",

                  "classification":
                      "unknown",

                  "service":
                      "noch nicht bestimmt",

                  "station":
                      None,

                  "country":
                      None,

                  "classification_source":
                      "unknown"

              }


          # =================================================
          # ADSB.LOL ABRUF
          # =================================================

          try:

              req = urllib.request.Request(

                  URL,

                  headers={

                      "User-Agent":
                          f"Luftrettung-Kleve/{VERSION}"

                  }

              )


              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )


              aircraft = source.get(
                  "ac",
                  []
              )


              if not isinstance(
                  aircraft,
                  list
              ):

                  aircraft = []


              output = {

                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "center": {

                      "name":
                          "Goch",

                      "lat":
                          GOCH_LAT,

                      "lon":
                          GOCH_LON

                  },

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "total":
                      len(
                          aircraft
                      ),

                  "ac":
                      aircraft

              }


          except Exception as e:

              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )


              output = {

                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "error":
                      str(e),

                  "total":
                      0,

                  "ac":
                      []

              }


          save_json(
              AIRCRAFT_FILE,
              output
          )


          # =================================================
          # DATEIEN LADEN
          # =================================================

          history = load_json(
              HISTORY_FILE,
              []
          )


          background_history = load_json(
              BACKGROUND_FILE,
              []
          )


          flight_state = load_json(
              FLIGHT_STATE_FILE,
              {}
          )


          push_state = load_json(
              PUSH_STATE_FILE,
              {}
          )


          unknown_db = load_json(
              UNKNOWN_FILE,
              {}
          )


          if not isinstance(
              history,
              list
          ):

              history = []


          if not isinstance(
              background_history,
              list
          ):

              background_history = []


          if not isinstance(
              flight_state,
              dict
          ):

              flight_state = {}


          if not isinstance(
              push_state,
              dict
          ):

              push_state = {}


          if not isinstance(
              unknown_db,
              dict
          ):

              unknown_db = {}


          # =================================================
          # ALTE HISTORIE BEREINIGEN
          # =================================================

          history_cutoff = (
              now
              -
              timedelta(
                  days=14
              )
          )


          background_cutoff = (
              now
              -
              timedelta(
                  days=2
              )
          )


          def keep_after(
              entries,
              cutoff
          ):

              cleaned = []


              for item in entries:

                  timestamp = parse_time(
                      item.get(
                          "timestamp"
                      )
                  )


                  if (
                      timestamp is not None
                      and
                      timestamp >= cutoff
                  ):

                      cleaned.append(
                          item
                      )


              return cleaned


          history = keep_after(
              history,
              history_cutoff
          )


          background_history = keep_after(
              background_history,
              background_cutoff
          )


          # =================================================
          # AKTUELLE DATEN
          # =================================================

          current_relevant = []

          current_background = []

          detected_for_push = []

          stored_positions = []

          rotorcraft_count = 0


          # =================================================
          # LUFTFAHRZEUGE VERARBEITEN
          # =================================================

          for ac in output.get(
              "ac",
              []
          ):


              if not is_rotorcraft(
                  ac
              ):

                  continue


              rotorcraft_count += 1


              alat = ac.get(
                  "lat"
              )


              alon = ac.get(
                  "lon"
              )


              if not (

                  isinstance(
                      alat,
                      (int, float)
                  )

                  and

                  isinstance(
                      alon,
                      (int, float)
                  )

              ):

                  continue


              identity = get_identity(
                  ac
              )


              if not identity:

                  continue


              registration = str(
                  ac.get(
                      "r"
                  )
                  or ""
              ).strip()


              callsign = str(
                  ac.get(
                      "flight"
                  )
                  or ""
              ).strip()


              hexcode = str(
                  ac.get(
                      "hex"
                  )
                  or ""
              ).strip().lower()


              ac_type = str(
                  ac.get(
                      "t"
                  )
                  or ""
              ).strip().upper()


              category = str(
                  ac.get(
                      "category"
                  )
                  or ""
              ).strip().upper()


              description = str(
                  ac.get(
                      "desc"
                  )
                  or ""
              ).strip()


              operator = str(
                  ac.get(
                      "ownOp"
                  )
                  or ""
              ).strip()


              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      alat,
                      alon
                  ),
                  1
              )


              profile = classify_aircraft(
                  ac
              )


              classification = profile.get(
                  "classification",
                  "unknown"
              )


              relevant = (
                  classification in (
                      "rescue",
                      "police",
                      "military"
                  )
              )


              # =============================================
              # BISHERIGER FLUGSTATUS
              # =============================================

              previous_state = flight_state.get(
                  identity,
                  {}
              )


              previous_seen = parse_time(
                  previous_state.get(
                      "last_seen"
                  )
              )


              previous_lat = previous_state.get(
                  "last_lat"
              )


              previous_lon = previous_state.get(
                  "last_lon"
              )


              previous_distance = previous_state.get(
                  "last_distance_km"
              )


              # =============================================
              # NEUER FLUGABSCHNITT?
              # =============================================

              new_segment = True


              if previous_seen is not None:

                  gap_seconds = (
                      now
                      -
                      previous_seen
                  ).total_seconds()


                  if gap_seconds <= 3600:

                      new_segment = False


              if new_segment:

                  segment_id = (

                      identity

                      + "-"

                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )

                  )


                  first_seen = (
                      now.isoformat()
                  )


                  first_seen_distance = (
                      dist
                  )


                  minimum_distance = (
                      dist
                  )


                  entered_30km = None


              else:

                  segment_id = (

                      previous_state.get(
                          "segment_id"
                      )

                      or

                      (
                          identity

                          + "-"

                          + now.strftime(
                              "%Y%m%dT%H%M%S"
                          )
                      )

                  )


                  first_seen = (

                      previous_state.get(
                          "first_seen"
                      )

                      or

                      now.isoformat()

                  )


                  first_seen_distance = (

                      previous_state.get(
                          "first_seen_distance_km"
                      )

                  )


                  minimum_distance = (

                      previous_state.get(
                          "minimum_distance_km"
                      )

                  )


                  if minimum_distance is None:

                      minimum_distance = dist


                  minimum_distance = min(
                      minimum_distance,
                      dist
                  )


                  entered_30km = (

                      previous_state.get(
                          "entered_30km"
                      )

                  )


              # =============================================
              # 30-KM-EINFLUG
              # =============================================

              inside_30km = (
                  dist <= ACTION_RADIUS_KM
              )


              if (
                  inside_30km
                  and
                  not entered_30km
              ):

                  entered_30km = (
                      now.isoformat()
                  )


              # =============================================
              # BEWEGUNGSRICHTUNG
              # =============================================

              movement_bearing = None

              movement_direction = None

              approaching_goch = None

              distance_change_km = None


              if (

                  isinstance(
                      previous_lat,
                      (int, float)
                  )

                  and

                  isinstance(
                      previous_lon,
                      (int, float)
                  )

              ):

                  movement_bearing = round(
                      bearing_degrees(
                          previous_lat,
                          previous_lon,
                          alat,
                          alon
                      ),
                      1
                  )


                  movement_direction = (
                      direction_name(
                          movement_bearing
                      )
                  )


              if isinstance(
                  previous_distance,
                  (int, float)
              ):

                  distance_change_km = round(
                      dist
                      -
                      previous_distance,
                      1
                  )


                  if distance_change_km < -0.5:

                      approaching_goch = True


                  elif distance_change_km > 0.5:

                      approaching_goch = False


              # =============================================
              # EINTRAG
              # =============================================

              entry = {

                  "timestamp":
                      now.isoformat(),

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "hex":
                      hexcode,

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "description":
                      description,

                  "type":
                      ac_type,

                  "category":
                      category,

                  "lat":
                      alat,

                  "lon":
                      alon,

                  "distance_km":
                      dist,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get(
                          "alt_baro"
                      ),

                  "ground_speed":
                      ac.get(
                          "gs"
                      ),

                  "track":
                      ac.get(
                          "track"
                      ),

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change_km,

                  "approaching_goch":
                      approaching_goch,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "actual_start":
                      None,

                  "actual_destination":
                      None

              }


              # =============================================
              # UNBEKANNTE MASCHINE SPEICHERN
              # =============================================

              if classification == "unknown":

                  old_unknown = unknown_db.get(
                      identity,
                      {}
                  )


                  unknown_db[
                      identity
                  ] = {

                      "identity":
                          identity,

                      "hex":
                          hexcode,

                      "registration":
                          registration,

                      "callsign":
                          callsign,

                      "type":
                          ac_type,

                      "category":
                          category,

                      "description":
                          description,

                      "operator":
                          operator,

                      "first_seen":
                          old_unknown.get(
                              "first_seen"
                          )
                          or now.isoformat(),

                      "last_seen":
                          now.isoformat(),

                      "last_lat":
                          alat,

                      "last_lon":
                          alon,

                      "last_distance_km":
                          dist,

                      "minimum_distance_km":
                          min(
                              old_unknown.get(
                                  "minimum_distance_km",
                                  dist
                              ),
                              dist
                          ),

                      "inside_30km":
                          inside_30km,

                      "status":
                          "needs_identification"

                  }


              # =============================================
              # HINTERGRUNDHISTORIE
              # =============================================

              save_background = True


              for old in reversed(
                  background_history
              ):

                  if (
                      old.get(
                          "identity"
                      )
                      != identity
                  ):

                      continue


                  old_time = parse_time(
                      old.get(
                          "timestamp"
                      )
                  )


                  if old_time is not None:

                      seconds = (
                          now
                          -
                          old_time
                      ).total_seconds()


                      if seconds < 120:

                          save_background = False


                  break


              if save_background:

                  background_history.append(
                      entry
                  )


              # =============================================
              # SICHTBARE HISTORIE
              # =============================================

              if (
                  relevant
                  and
                  inside_30km
              ):

                  save_position = True


                  for old in reversed(
                      history
                  ):

                      if (
                          old.get(
                              "identity"
                          )
                          != identity
                      ):

                          continue


                      old_time = parse_time(
                          old.get(
                              "timestamp"
                          )
                      )


                      if old_time is not None:

                          seconds = (
                              now
                              -
                              old_time
                          ).total_seconds()


                          if seconds < 120:

                              save_position = False


                      break


                  if save_position:

                      history.append(
                          entry
                      )


                      stored_positions.append(
                          entry
                      )


                  current_relevant.append(
                      entry
                  )


              else:

                  current_background.append(
                      entry
                  )


              # =============================================
              # FLIGHT STATE
              # =============================================

              flight_state[
                  identity
              ] = {

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      alat,

                  "last_lon":
                      alon,

                  "last_distance_km":
                      dist,

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change_km,

                  "approaching_goch":
                      approaching_goch,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant

              }


              # =============================================
              # PUSH
              # =============================================

              if not (
                  relevant
                  and
                  inside_30km
              ):

                  continue


              send_push = True


              last_push = push_state.get(
                  identity
              )


              if last_push:

                  last_push_time = parse_time(
                      last_push
                  )


                  if last_push_time is not None:

                      seconds = (
                          now
                          -
                          last_push_time
                      ).total_seconds()


                      if seconds < 3600:

                          send_push = False


              if send_push:

                  detected_for_push.append(
                      entry
                  )


                  push_state[
                      identity
                  ] = (
                      now.isoformat()
                  )


          # =================================================
          # ALTE FLIGHT STATES ENTFERNEN
          # =================================================

          state_cutoff = (
              now
              -
              timedelta(
                  days=2
              )
          )


          cleaned_states = {}


          for identity, state in flight_state.items():

              timestamp = parse_time(
                  state.get(
                      "last_seen"
                  )
              )


              if (
                  timestamp is not None
                  and
                  timestamp >= state_cutoff
              ):

                  cleaned_states[
                      identity
                  ] = state


          flight_state = (
              cleaned_states
          )


          # =================================================
          # SORTIEREN
          # =================================================

          history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )


          background_history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )


          # =================================================
          # SPEICHERN
          # =================================================

          save_json(
              HISTORY_FILE,
              history
          )


          save_json(
              BACKGROUND_FILE,
              background_history
          )


          save_json(
              FLIGHT_STATE_FILE,
              flight_state
          )


          save_json(
              PUSH_STATE_FILE,
              push_state
          )


          save_json(
              UNKNOWN_FILE,
              unknown_db
          )


          save_json(
              DETECTED_FILE,
              detected_for_push
          )


          save_json(
              CURRENT_FILE,
              {

                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "aircraft":
                      current_relevant

              }
          )


          # =================================================
          # LOG
          # =================================================

          print(
              "========================================="
          )

          print(
              "Luftrettung Goch V4.2"
          )

          print(
              "========================================="
          )


          print(
              "ADSB-Luftfahrzeuge im 80-km-Bereich:",
              output.get(
                  "total",
                  0
              )
          )


          print(
              "Erkannte Hubschrauber:",
              rotorcraft_count
          )


          print(
              "Relevante Hubschrauber im 30-km-Bereich:",
              len(
                  current_relevant
              )
          )


          print(
              "Hintergrundbeobachtungen:",
              len(
                  current_background
              )
          )


          print(
              "Unbekannte Hubschrauber in Datenbank:",
              len(
                  unknown_db
              )
          )


          print(
              "Neue sichtbare Positionspunkte:",
              len(
                  stored_positions
              )
          )


          print(
              "Push-Kandidaten:",
              len(
                  detected_for_push
              )
          )


          for item in current_relevant:

              print(
                  "RELEVANT:",
                  item.get(
                      "name"
                  ),
                  item.get(
                      "registration"
                  ),
                  item.get(
                      "classification"
                  ),
                  item.get(
                      "distance_km"
                  ),
                  "km",
                  "Richtung:",
                  item.get(
                      "movement_direction"
                  ),
                  "Annäherung:",
                  item.get(
                      "approaching_goch"
                  )
              )


          for identity, item in unknown_db.items():

              print(
                  "UNBEKANNT:",
                  item.get(
                      "registration"
                  ),
                  item.get(
                      "callsign"
                  ),
                  item.get(
                      "type"
                  ),
                  item.get(
                      "last_distance_km"
                  ),
                  "km"
              )

          PY


      # =====================================================
      # PUSH
      # =====================================================

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'

          import json
          import urllib.request
          import os


          TOPIC = "luftrettung-goch-jm-26092026-x7k4"


          def send_ntfy(
              title,
              message
          ):

              req = urllib.request.Request(

                  f"https://ntfy.sh/{TOPIC}",

                  data=message.encode(
                      "utf-8"
                  ),

                  method="POST",

                  headers={

                      "Title":
                          title,

                      "Priority":
                          "high",

                      "Tags":
                          "helicopter"

                  }

              )


              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return response.status


          # =================================================
          # MANUELLER TEST
          # =================================================

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              ==
              "workflow_dispatch"
          ):

              status = send_ntfy(

                  "Luftrettung KLE - V4.2 Test",

                  (
                      "Version 4.2 läuft.\n"
                      "80-km-Hintergrundüberwachung aktiv.\n"
                      "Unbekannte Hubschrauber werden gespeichert.\n"
                      "Flugrichtung und Annäherung werden ermittelt."
                  )

              )


              print(
                  "Test-Push HTTP:",
                  status
              )


              raise SystemExit(
                  0
              )


          # =================================================
          # AUTOMATISCHER BETRIEB
          # =================================================

          try:

              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  detected = json.load(
                      f
                  )


          except Exception as e:

              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []


          if not detected:

              print(
                  "Keine relevante neue Erkennung."
              )

              raise SystemExit(
                  0
              )


          for item in detected:

              name = (
                  item.get(
                      "name"
                  )
                  or
                  "Hubschrauber"
              )


              registration = (
                  item.get(
                      "registration"
                  )
                  or
                  "unbekannt"
              )


              callsign = (
                  item.get(
                      "callsign"
                  )
                  or
                  "unbekannt"
              )


              service = (
                  item.get(
                      "service"
                  )
                  or
                  "unbekannt"
              )


              station = (
                  item.get(
                      "station"
                  )
                  or
                  "noch nicht bestimmt"
              )


              distance = item.get(
                  "distance_km"
              )


              first_distance = item.get(
                  "first_seen_distance_km"
              )


              direction = item.get(
                  "movement_direction"
              )


              approaching = item.get(
                  "approaching_goch"
              )


              if distance is None:

                  distance_text = (
                      "unbekannt"
                  )

              else:

                  distance_text = (
                      f"{distance} km"
                  )


              if first_distance is None:

                  first_text = (
                      "unbekannt"
                  )

              else:

                  first_text = (
                      f"{first_distance} km"
                  )


              if approaching is True:

                  movement_text = (
                      "nähert sich Goch"
                  )


              elif approaching is False:

                  movement_text = (
                      "entfernt sich von Goch"
                  )


              else:

                  movement_text = (
                      "Bewegung noch nicht bestimmbar"
                  )


              message = (

                  f"{name} im 30-km-Radius erkannt\n"

                  f"Art: {service}\n"

                  f"Kennzeichen: {registration}\n"

                  f"Rufname: {callsign}\n"

                  f"Station: {station}\n"

                  f"Jetzt: {distance_text} von Goch\n"

                  f"Erstmals erfasst: {first_text}\n"

                  f"Flugrichtung: {direction or 'noch unbekannt'}\n"

                  f"Status: {movement_text}"

              )


              status = send_ntfy(
                  "Luftrettung KLE",
                  message
              )


              print(
                  "Push gesendet:",
                  name,
                  registration,
                  "HTTP:",
                  status
              )

          PY


