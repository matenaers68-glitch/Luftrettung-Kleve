name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flugdaten V4.1 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          import re
          from datetime import datetime, timezone, timedelta

          # =================================================
          # LUFTRETTUNG GOCH / KREIS KLEVE
          # VERSION 4.1
          #
          # NEU:
          # - 80-km-Hintergrundradius
          # - 30-km-Aktionsradius
          # - Klassifizierung:
          #     rescue
          #     police
          #     military
          #     private
          #     unknown
          # - private/unknown werden NICHT gepusht
          # - Anflug bereits außerhalb 30 km wird gespeichert
          # - aircraft_db.json als lokale Wissensdatenbank
          # =================================================

          VERSION = "4.1"

          GOCH_LAT = 51.678
          GOCH_LON = 6.159

          # -------------------------------------------------
          # RADII
          # -------------------------------------------------

          ACTION_RADIUS_KM = 30
          BACKGROUND_RADIUS_KM = 80

          # ADSB.lol erwartet nautische Meilen
          BACKGROUND_RADIUS_NM = round(
              BACKGROUND_RADIUS_KM / 1.852,
              1
          )

          URL = (
              f"https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{BACKGROUND_RADIUS_NM}"
          )

          now = datetime.now(timezone.utc)

          # =================================================
          # DATEIEN
          # =================================================

          AIRCRAFT_FILE = "aircraft.json"
          HISTORY_FILE = "history.json"
          BACKGROUND_FILE = "background_history.json"
          CURRENT_FILE = "current_rotorcraft.json"
          FLIGHT_STATE_FILE = "flight_state.json"
          PUSH_STATE_FILE = "push_state.json"
          DETECTED_FILE = "detected.json"
          DATABASE_FILE = "aircraft_db.json"

          # =================================================
          # BEKANNTE DIENSTE / RUFNAMEN
          #
          # Diese Zuordnungen dürfen nur verwendet werden,
          # wenn der Rufname hinreichend eindeutig ist.
          # =================================================

          KNOWN_CALLSIGNS = {

              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "country": "Deutschland"
              },

              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPHWESTFALEN": {
                  "name": "Christoph Westfalen",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "country": "Deutschland"
              },

              "CHRISTOPHDORTMUND": {
                  "name": "Christoph Dortmund",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "country": "Deutschland"
              }

          }

          # =================================================
          # HUBSCHRAUBERTYPEN
          # =================================================

          ROTOR_TYPES = (
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          )

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "SAR"
          )

          # =================================================
          # HILFSFUNKTIONEN
          # =================================================

          def load_json(filename, default):

              if not os.path.exists(filename):
                  return default

              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception as e:
                  print(
                      f"{filename} konnte nicht gelesen werden:",
                      repr(e)
                  )
                  return default


          def save_json(filename, data):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def parse_time(value):

              if not value:
                  return None

              try:
                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:
                  return None


          def distance_km(
              lat1,
              lon1,
              lat2,
              lon2
          ):

              r = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(
                  lat2 - lat1
              )

              dl = math.radians(
                  lon2 - lon1
              )

              a = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1)
                  * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )

              return (
                  2
                  * r
                  * math.asin(
                      math.sqrt(a)
                  )
              )


          def normalize(value):

              return str(
                  value or ""
              ).strip().upper()


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(value)
              )


          def get_identity(ac):

              hexcode = str(
                  ac.get("hex") or ""
              ).strip().lower()

              registration = compact(
                  ac.get("r")
              )

              callsign = compact(
                  ac.get("flight")
              )

              return (
                  hexcode
                  or registration
                  or callsign
              )


          # =================================================
          # ROTORCRAFT ERKENNUNG
          # =================================================

          def is_rotorcraft(ac):

              category = normalize(
                  ac.get("category")
              )

              ac_type = normalize(
                  ac.get("t")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              registration = normalize(
                  ac.get("r")
              )

              description = normalize(
                  ac.get("desc")
              )

              # ADS-B Kategorie A7 = Rotorcraft
              if category == "A7":
                  return True

              for rotor_type in ROTOR_TYPES:

                  if rotor_type in ac_type:
                      return True

              text = " ".join([
                  callsign,
                  registration,
                  description,
                  ac_type
              ])

              for word in ROTOR_WORDS:

                  if word in text:
                      return True

              return False


          # =================================================
          # DATENBANK LADEN
          # =================================================

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )

          if not isinstance(
              aircraft_db,
              dict
          ):
              aircraft_db = {}


          # =================================================
          # PROFIL / KLASSIFIZIERUNG
          # =================================================

          def classify_aircraft(ac):

              registration = normalize(
                  ac.get("r")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              hexcode = str(
                  ac.get("hex") or ""
              ).strip().lower()

              description = normalize(
                  ac.get("desc")
              )

              reg_key = compact(
                  registration
              )

              callsign_key = compact(
                  callsign
              )

              # ---------------------------------------------
              # 1. Lokale aircraft_db.json
              # ---------------------------------------------

              db_keys = [
                  hexcode,
                  reg_key,
                  registration
              ]

              for key in db_keys:

                  if (
                      key
                      and key in aircraft_db
                  ):

                      profile = aircraft_db[
                          key
                      ].copy()

                      profile[
                          "classification_source"
                      ] = "aircraft_db"

                      return profile

              # ---------------------------------------------
              # 2. Bekannter Rettungsrufname
              # ---------------------------------------------

              for key, profile in KNOWN_CALLSIGNS.items():

                  if key in callsign_key:

                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "callsign"

                      return result

              # ---------------------------------------------
              # 3. Polizei
              # ---------------------------------------------

              police_text = " ".join([
                  callsign,
                  description
              ])

              if (
                  "POLICE" in police_text
                  or "POLIZEI" in police_text
                  or "BUNDESPOLIZEI" in police_text
              ):

                  return {
                      "name": (
                          callsign
                          or registration
                          or "Polizeihubschrauber"
                      ),
                      "classification": "police",
                      "service": "Polizei",
                      "station": None,
                      "country": None,
                      "classification_source":
                          "callsign/description"
                  }

              # ---------------------------------------------
              # 4. SAR
              #
              # SAR ist in diesem Projekt relevant.
              # ---------------------------------------------

              if "SAR" in callsign:

                  return {
                      "name": (
                          callsign
                          or registration
                          or "SAR-Hubschrauber"
                      ),
                      "classification": "military",
                      "service": "SAR / Bundeswehr",
                      "station": None,
                      "country": "Deutschland",
                      "classification_source":
                          "callsign"
                  }

              # ---------------------------------------------
              # 5. Militär anhand ADS-B-Daten
              # ---------------------------------------------

              military_text = " ".join([
                  callsign,
                  description,
                  normalize(ac.get("ownOp"))
              ])

              military_words = (
                  "MILITARY",
                  "ARMY",
                  "AIR FORCE",
                  "LUFTWAFFE",
                  "BUNDESWEHR",
                  "NAVY"
              )

              if any(
                  word in military_text
                  for word in military_words
              ):

                  return {
                      "name": (
                          callsign
                          or registration
                          or "Militärhubschrauber"
                      ),
                      "classification": "military",
                      "service": "Militär",
                      "station": None,
                      "country": None,
                      "classification_source":
                          "ADSB metadata"
                  }

              # ---------------------------------------------
              # NICHT AUTOMATISCH ALS PRIVAT EINSTUFEN!
              #
              # Ein unbekanntes Kennzeichen kann ebenso
              # Rettung, Polizei oder Militär sein.
              # ---------------------------------------------

              return {
                  "name": (
                      callsign
                      or registration
                      or "Unbekannter Hubschrauber"
                  ),
                  "classification": "unknown",
                  "service": "noch nicht bestimmt",
                  "station": None,
                  "country": None,
                  "classification_source": "unknown"
              }


          # =================================================
          # ADSB.LOL – 80 KM ABRUFEN
          # =================================================

          try:

              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                      f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },
                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,
                  "action_radius_km":
                      ACTION_RADIUS_KM,
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:

              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }

          save_json(
              AIRCRAFT_FILE,
              output
          )


          # =================================================
          # BESTEHENDE DATEIEN LADEN
          # =================================================

          history = load_json(
              HISTORY_FILE,
              []
          )

          background_history = load_json(
              BACKGROUND_FILE,
              []
          )

          flight_state = load_json(
              FLIGHT_STATE_FILE,
              {}
          )

          push_state = load_json(
              PUSH_STATE_FILE,
              {}
          )

          if not isinstance(history, list):
              history = []

          if not isinstance(
              background_history,
              list
          ):
              background_history = []

          if not isinstance(
              flight_state,
              dict
          ):
              flight_state = {}

          if not isinstance(
              push_state,
              dict
          ):
              push_state = {}


          # =================================================
          # ALTE DATEN BEREINIGEN
          # =================================================

          history_cutoff = (
              now
              - timedelta(days=14)
          )

          background_cutoff = (
              now
              - timedelta(days=2)
          )


          def keep_after(
              entries,
              cutoff
          ):

              cleaned = []

              for item in entries:

                  timestamp = parse_time(
                      item.get("timestamp")
                  )

                  if (
                      timestamp is not None
                      and timestamp >= cutoff
                  ):
                      cleaned.append(
                          item
                      )

              return cleaned


          history = keep_after(
              history,
              history_cutoff
          )

          background_history = keep_after(
              background_history,
              background_cutoff
          )


          # =================================================
          # AKTUELLE HUBSCHRAUBER
          # =================================================

          current_relevant = []
          current_background = []
          detected_for_push = []
          stored_positions = []

          rotorcraft_count = 0


          # =================================================
          # VERARBEITUNG
          # =================================================

          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(ac):
                  continue

              rotorcraft_count += 1

              alat = ac.get("lat")
              alon = ac.get("lon")

              if not (
                  isinstance(
                      alat,
                      (int, float)
                  )
                  and isinstance(
                      alon,
                      (int, float)
                  )
              ):
                  continue

              identity = get_identity(
                  ac
              )

              if not identity:
                  continue

              registration = str(
                  ac.get("r") or ""
              ).strip()

              callsign = str(
                  ac.get("flight") or ""
              ).strip()

              hexcode = str(
                  ac.get("hex") or ""
              ).strip().lower()

              ac_type = str(
                  ac.get("t") or ""
              ).strip().upper()

              category = str(
                  ac.get("category") or ""
              ).strip().upper()

              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      alat,
                      alon
                  ),
                  1
              )

              profile = classify_aircraft(
                  ac
              )

              classification = profile.get(
                  "classification",
                  "unknown"
              )

              relevant = (
                  classification in (
                      "rescue",
                      "police",
                      "military"
                  )
              )

              # =============================================
              # FLUGSEGMENT
              # =============================================

              previous_state = flight_state.get(
                  identity,
                  {}
              )

              previous_seen = parse_time(
                  previous_state.get(
                      "last_seen"
                  )
              )

              new_segment = True

              if previous_seen is not None:

                  gap_seconds = (
                      now
                      - previous_seen
                  ).total_seconds()

                  if gap_seconds <= 3600:
                      new_segment = False

              if new_segment:

                  segment_id = (
                      identity
                      + "-"
                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = now.isoformat()

                  first_seen_distance = dist

                  entered_30km = None

              else:

                  segment_id = (
                      previous_state.get(
                          "segment_id"
                      )
                      or (
                          identity
                          + "-"
                          + now.strftime(
                              "%Y%m%dT%H%M%S"
                          )
                      )
                  )

                  first_seen = (
                      previous_state.get(
                          "first_seen"
                      )
                      or now.isoformat()
                  )

                  first_seen_distance = (
                      previous_state.get(
                          "first_seen_distance_km"
                      )
                  )

                  entered_30km = (
                      previous_state.get(
                          "entered_30km"
                      )
                  )

              # =============================================
              # EINFLUG IN 30-KM-RADIUS
              # =============================================

              inside_30km = (
                  dist <= ACTION_RADIUS_KM
              )

              if (
                  inside_30km
                  and not entered_30km
              ):
                  entered_30km = now.isoformat()

              # =============================================
              # EINTRAG
              # =============================================

              entry = {

                  "timestamp": now.isoformat(),

                  "identity": identity,
                  "segment_id": segment_id,

                  "hex": hexcode,
                  "registration": registration,
                  "callsign": callsign,

                  "name": profile.get(
                      "name"
                  ),

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service": profile.get(
                      "service"
                  ),

                  "station": profile.get(
                      "station"
                  ),

                  "country": profile.get(
                      "country"
                  ),

                  "type": ac_type,
                  "category": category,

                  "lat": alat,
                  "lon": alon,

                  "distance_km": dist,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get(
                          "alt_baro"
                      ),

                  "ground_speed":
                      ac.get(
                          "gs"
                      ),

                  "track":
                      ac.get(
                          "track"
                      ),

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "actual_start":
                      None,

                  "actual_destination":
                      None
              }

              # =============================================
              # 80-KM-HINTERGRUNDHISTORIE
              # =============================================

              save_background = True

              for old in reversed(
                  background_history
              ):

                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  if old_time is not None:

                      seconds = (
                          now
                          - old_time
                      ).total_seconds()

                      if seconds < 120:
                          save_background = False

                  break

              if save_background:

                  background_history.append(
                      entry
                  )

              # =============================================
              # SICHTBARE HISTORIE
              #
              # Nur relevante Maschinen innerhalb 30 km.
              # =============================================

              if (
                  relevant
                  and inside_30km
              ):

                  save_position = True

                  for old in reversed(
                      history
                  ):

                      if (
                          old.get("identity")
                          != identity
                      ):
                          continue

                      old_time = parse_time(
                          old.get("timestamp")
                      )

                      if old_time is not None:

                          seconds = (
                              now
                              - old_time
                          ).total_seconds()

                          if seconds < 120:
                              save_position = False

                      break

                  if save_position:

                      history.append(
                          entry
                      )

                      stored_positions.append(
                          entry
                      )

                  current_relevant.append(
                      entry
                  )

              # =============================================
              # UNBEKANNTE / PRIVATE
              #
              # Nur intern.
              # =============================================

              else:

                  current_background.append(
                      entry
                  )

              # =============================================
              # FLIGHT STATE
              # =============================================

              flight_state[
                  identity
              ] = {

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get(
                          "name"
                      ),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      alat,

                  "last_lon":
                      alon,

                  "last_distance_km":
                      dist,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant
              }

              # =============================================
              # PUSH
              #
              # NUR:
              # - relevant
              # - innerhalb 30 km
              # - höchstens 1x / 60 Minuten
              # =============================================

              if not (
                  relevant
                  and inside_30km
              ):
                  continue

              send_push = True

              last_push = push_state.get(
                  identity
              )

              if last_push:

                  last_push_time = parse_time(
                      last_push
                  )

                  if last_push_time is not None:

                      seconds = (
                          now
                          - last_push_time
                      ).total_seconds()

                      if seconds < 3600:
                          send_push = False

              if send_push:

                  detected_for_push.append(
                      entry
                  )

                  push_state[
                      identity
                  ] = now.isoformat()


          # =================================================
          # FLIGHT STATE BEREINIGEN
          # =================================================

          state_cutoff = (
              now
              - timedelta(days=2)
          )

          cleaned_states = {}

          for identity, state in flight_state.items():

              timestamp = parse_time(
                  state.get(
                      "last_seen"
                  )
              )

              if (
                  timestamp is not None
                  and timestamp >= state_cutoff
              ):

                  cleaned_states[
                      identity
                  ] = state

          flight_state = cleaned_states


          # =================================================
          # SORTIEREN
          # =================================================

          history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )

          background_history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )


          # =================================================
          # SPEICHERN
          # =================================================

          save_json(
              HISTORY_FILE,
              history
          )

          save_json(
              BACKGROUND_FILE,
              background_history
          )

          save_json(
              FLIGHT_STATE_FILE,
              flight_state
          )

          save_json(
              PUSH_STATE_FILE,
              push_state
          )

          save_json(
              DETECTED_FILE,
              detected_for_push
          )

          save_json(
              CURRENT_FILE,
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "aircraft":
                      current_relevant
              }
          )


          # =================================================
          # LOG
          # =================================================

          print(
              "========================================="
          )

          print(
              "Luftrettung Goch V4.1"
          )

          print(
              "========================================="
          )

          print(
              "ADSB-Luftfahrzeuge im 80-km-Bereich:",
              output.get(
                  "total",
                  0
              )
          )

          print(
              "Erkannte Hubschrauber:",
