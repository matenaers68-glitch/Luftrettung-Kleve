          ).strip()


          if not token or not chat_id:

              raise RuntimeError(
                  "TELEGRAM_BOT_TOKEN oder "
                  "TELEGRAM_CHAT_ID fehlt."
              )


          def send(text):

              url = (
                  "https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )


              data = urllib.parse.urlencode(
                  {
                      "chat_id":
                          chat_id,

                      "text":
                          text,

                      "disable_web_page_preview":
                          "true"
                  }
              ).encode(
                  "utf-8"
              )


              request = urllib.request.Request(
                  url,
                  data=data,
                  method="POST"
              )


              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  http_status = (
                      response.status
                  )

                  result = json.load(
                      response
                  )


              if not result.get(
