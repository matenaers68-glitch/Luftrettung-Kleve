name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # REPOSITORY
      # =====================================================

      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # FLUGDATEN
      # =====================================================

      - name: Flugdaten V4.5 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'

          import json
          import urllib.request
          import math
          import os
          import re

          from datetime import datetime, timezone, timedelta


          # =================================================
          # VERSION
          # =================================================

          VERSION = "4.5"


          # =================================================
          # MITTELPUNKT GOCH
          # =================================================

          GOCH_LAT = 51.678
          GOCH_LON = 6.159


          # =================================================
          # RADII
          # =================================================

          ACTION_RADIUS_KM = 30
          BACKGROUND_RADIUS_KM = 80

          BACKGROUND_RADIUS_NM = round(
              BACKGROUND_RADIUS_KM / 1.852,
              1
          )

          URL = (
              "https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{BACKGROUND_RADIUS_NM}"
          )

          now = datetime.now(timezone.utc)


          # =================================================
          # DATEIEN
          # =================================================

          AIRCRAFT_FILE = "aircraft.json"
          HISTORY_FILE = "history.json"
          BACKGROUND_FILE = "background_history.json"
          CURRENT_FILE = "current_rotorcraft.json"
          FLIGHT_STATE_FILE = "flight_state.json"
          PUSH_STATE_FILE = "push_state.json"
          DETECTED_FILE = "detected.json"
          DATABASE_FILE = "aircraft_db.json"
          UNKNOWN_FILE = "unknown_aircraft.json"


          # =================================================
          # BEKANNTE RUFNAMEN
          # =================================================

          KNOWN_CALLSIGNS = {

              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },

              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "country": "Deutschland"
              },

              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPHWESTFALEN": {
                  "name": "Christoph Westfalen",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "country": "Deutschland"
              },

              "CHRISTOPHDORTMUND": {
                  "name": "Christoph Dortmund",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "country": "Deutschland"
              }

          }


          # =================================================
          # HUBSCHRAUBERTYPEN
          # =================================================

          ROTOR_TYPES = (
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          )

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "POLITIE",
              "SAR"
          )


          # =================================================
          # JSON
          # =================================================

          def load_json(filename, default):

              if not os.path.exists(filename):
                  return default

              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)

              except Exception as e:

                  print(
                      filename,
                      "konnte nicht gelesen werden:",
                      repr(e)
                  )

                  return default


          def save_json(filename, data):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =================================================
          # ZEIT
          # =================================================

          def parse_time(value):

              if not value:
                  return None

              try:

                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:
                  return None


          # =================================================
          # ENTFERNUNG
          # =================================================

          def distance_km(lat1, lon1, lat2, lon2):

              radius = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)

              a = (
                  math.sin(dp / 2) ** 2
                  +
                  math.cos(p1)
                  *
                  math.cos(p2)
                  *
                  math.sin(dl / 2) ** 2
              )

              return (
                  2
                  *
                  radius
                  *
                  math.asin(
                      math.sqrt(a)
                  )
              )


          # =================================================
          # RICHTUNG
          # =================================================

          def bearing_degrees(lat1, lon1, lat2, lon2):

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)
              dl = math.radians(lon2 - lon1)

              y = (
                  math.sin(dl)
                  *
                  math.cos(p2)
              )

              x = (
                  math.cos(p1)
                  *
                  math.sin(p2)
                  -
                  math.sin(p1)
                  *
                  math.cos(p2)
                  *
                  math.cos(dl)
              )

              return (
                  math.degrees(
                      math.atan2(y, x)
                  )
                  +
                  360
              ) % 360


          def direction_name(bearing):

              directions = [
                  "Nord",
                  "Nordost",
                  "Ost",
                  "Südost",
                  "Süd",
                  "Südwest",
                  "West",
                  "Nordwest"
              ]

              index = int(
                  (bearing + 22.5)
                  //
                  45
              ) % 8

              return directions[index]


          # =================================================
          # NORMALISIERUNG
          # =================================================

          def normalize(value):

              return str(
                  value or ""
              ).strip().upper()


          def compact(value):

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(value)
              )


          # =================================================
          # IDENTITÄT
          # =================================================

          def get_identity(ac):

              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              registration = compact(
                  ac.get("r")
              )

              callsign = compact(
                  ac.get("flight")
              )

              return (
                  hexcode
                  or registration
                  or callsign
              )


          # =================================================
          # DATENBANK
          # =================================================

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )

          if not isinstance(
              aircraft_db,
              dict
          ):
              aircraft_db = {}


          def database_profile(ac):

              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              registration = normalize(
                  ac.get("r")
              )

              registration_compact = compact(
                  registration
              )

              possible_keys = [
                  hexcode,
                  registration,
                  registration_compact
              ]

              for key in possible_keys:

                  if not key:
                      continue

                  profile = aircraft_db.get(
                      key
                  )

                  if (
                      isinstance(profile, dict)
                      and
                      profile.get("classification")
                  ):

                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "aircraft_db"

                      return result

              return None


          # =================================================
          # HUBSCHRAUBER ERKENNEN
          # =================================================

          def is_rotorcraft(ac):

              # V4.5:
              # Stammdatenbank hat Vorrang.
              # Dadurch kann eine bekannte Maschine erkannt
              # werden, auch wenn ADSB keine A7-Kategorie liefert.

              if database_profile(ac):
                  return True

              category = normalize(
                  ac.get("category")
              )

              ac_type = normalize(
                  ac.get("t")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              registration = normalize(
                  ac.get("r")
              )

              description = normalize(
                  ac.get("desc")
              )

              operator = normalize(
                  ac.get("ownOp")
              )

              if category == "A7":
                  return True

              for rotor_type in ROTOR_TYPES:

                  if rotor_type in ac_type:
                      return True

              text = " ".join([
                  callsign,
                  registration,
                  description,
                  operator,
                  ac_type
              ])

              for word in ROTOR_WORDS:

                  if word in text:
                      return True

              return False


          # =================================================
          # KLASSIFIZIERUNG
          # =================================================

          def classify_aircraft(ac):

              db_profile = database_profile(ac)

              if db_profile:
                  return db_profile


              registration = normalize(
                  ac.get("r")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              callsign_key = compact(
                  callsign
              )

              description = normalize(
                  ac.get("desc")
              )

              operator = normalize(
                  ac.get("ownOp")
              )


              # Rufname

              for key, profile in KNOWN_CALLSIGNS.items():

                  if key in callsign_key:

                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "callsign"

                      return result


              # Polizei

              police_text = " ".join([
                  callsign,
                  description,
                  operator
              ])

              police_words = (
                  "POLICE",
                  "POLIZEI",
                  "BUNDESPOLIZEI",
                  "POLITIE"
              )

              if any(
                  word in police_text
                  for word in police_words
              ):

                  return {
                      "name":
                          callsign
                          or registration
                          or "Polizeihubschrauber",

                      "classification":
                          "police",

                      "service":
                          "Polizei",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              # Militär / SAR

              military_text = " ".join([
                  callsign,
                  description,
                  operator
              ])

              military_words = (
                  "SAR",
                  "MILITARY",
                  "ARMY",
                  "AIR FORCE",
                  "LUFTWAFFE",
                  "BUNDESWEHR",
                  "NAVY",
                  "KONINKLIJKE LUCHTMACHT",
                  "ROYAL NETHERLANDS AIR FORCE"
              )

              if any(
                  word in military_text
                  for word in military_words
              ):

                  return {
                      "name":
                          callsign
                          or registration
                          or "Militärhubschrauber",

                      "classification":
                          "military",

                      "service":
                          "Militär / SAR",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              return {
                  "name":
                      callsign
                      or registration
                      or "Unbekannter Hubschrauber",

                  "classification":
                      "unknown",

                  "service":
                      "noch nicht bestimmt",

                  "station":
                      None,

                  "country":
                      None,

                  "classification_source":
                      "unknown"
              }


          # =================================================
          # ADSB.LOL
          # =================================================

          try:

              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                          f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {

                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "total":
                      len(aircraft),

                  "ac":
                      aircraft
              }

          except Exception as e:

              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "error":
                      str(e),

                  "total":
                      0,

                  "ac":
                      []
              }


          save_json(
              AIRCRAFT_FILE,
              output
          )


          # =================================================
          # BESTEHENDE DATEN
          # =================================================

          history = load_json(
              HISTORY_FILE,
              []
          )

          background_history = load_json(
              BACKGROUND_FILE,
              []
          )

          flight_state = load_json(
              FLIGHT_STATE_FILE,
              {}
          )

          push_state = load_json(
              PUSH_STATE_FILE,
              {}
          )

          unknown_db = load_json(
              UNKNOWN_FILE,
              {}
          )


          if not isinstance(history, list):
              history = []

          if not isinstance(
              background_history,
              list
          ):
              background_history = []

          if not isinstance(
              flight_state,
              dict
          ):
              flight_state = {}

          if not isinstance(
              push_state,
              dict
          ):
              push_state = {}

          if not isinstance(
              unknown_db,
              dict
          ):
              unknown_db = {}


          # =================================================
          # HISTORIE BEREINIGEN
          # =================================================

          history_cutoff = (
              now
              -
              timedelta(days=14)
          )

          background_cutoff = (
              now
              -
              timedelta(days=2)
          )


          def keep_after(
              entries,
              cutoff
          ):

              cleaned = []

              for item in entries:

                  timestamp = parse_time(
                      item.get("timestamp")
                  )

                  if (
                      timestamp is not None
                      and
                      timestamp >= cutoff
                  ):
                      cleaned.append(item)

              return cleaned


          history = keep_after(
              history,
              history_cutoff
          )

          background_history = keep_after(
              background_history,
              background_cutoff
          )


          # =================================================
          # VERARBEITUNG
          # =================================================

          current_relevant = []
          detected_for_push = []
          rotorcraft_count = 0


          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(ac):
                  continue

              rotorcraft_count += 1

              alat = ac.get("lat")
              alon = ac.get("lon")

              if not (
                  isinstance(
                      alat,
                      (int, float)
                  )
                  and
                  isinstance(
                      alon,
                      (int, float)
                  )
              ):
                  continue


              identity = get_identity(ac)

              if not identity:
                  continue


              registration = str(
                  ac.get("r")
                  or ""
              ).strip()

              callsign = str(
                  ac.get("flight")
                  or ""
              ).strip()

              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              ac_type = str(
                  ac.get("t")
                  or ""
              ).strip().upper()

              category = str(
                  ac.get("category")
                  or ""
              ).strip().upper()

              description = str(
                  ac.get("desc")
                  or ""
              ).strip()

              operator = str(
                  ac.get("ownOp")
                  or ""
              ).strip()


              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      alat,
                      alon
                  ),
                  1
              )


              profile = classify_aircraft(ac)

              classification = profile.get(
                  "classification",
                  "unknown"
              )

              relevant = (
                  classification in (
                      "rescue",
                      "police",
                      "military"
                  )
              )


              previous_state = flight_state.get(
                  identity,
                  {}
              )

              previous_seen = parse_time(
                  previous_state.get(
                      "last_seen"
                  )
              )


              # Neuer Flugabschnitt nach 60 Minuten Pause

              new_segment = True

              if previous_seen is not None:

                  if (
                      now
                      -
                      previous_seen
                  ).total_seconds() <= 3600:

                      new_segment = False


              if new_segment:

                  segment_id = (
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = now.isoformat()
                  first_seen_distance = dist
                  minimum_distance = dist
                  entered_30km = None

              else:

                  segment_id = (
                      previous_state.get(
                          "segment_id"
                      )
                      or
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      previous_state.get(
                          "first_seen"
                      )
                      or
                      now.isoformat()
                  )

                  first_seen_distance = (
                      previous_state.get(
                          "first_seen_distance_km",
                          dist
                      )
                  )

                  minimum_distance = min(
                      previous_state.get(
                          "minimum_distance_km",
                          dist
                      ),
                      dist
                  )

                  entered_30km = (
                      previous_state.get(
                          "entered_30km"
                      )
                  )


              inside_30km = (
                  dist <= ACTION_RADIUS_KM
              )

              # Exakter Übergang in den Aktionsradius

              just_entered_30km = (
                  inside_30km
                  and
                  not previous_state.get(
                      "inside_30km",
                      False
                  )
              )

              if (
                  inside_30km
                  and
                  not entered_30km
              ):
                  entered_30km = (
                      now.isoformat()
                  )


              # Bewegung

              movement_bearing = None
              movement_direction = None
              approaching_goch = None
              distance_change_km = None

              previous_lat = previous_state.get(
                  "last_lat"
              )

              previous_lon = previous_state.get(
                  "last_lon"
              )

              previous_distance = (
                  previous_state.get(
                      "last_distance_km"
                  )
              )

              if (
                  isinstance(
                      previous_lat,
                      (int, float)
                  )
                  and
                  isinstance(
                      previous_lon,
                      (int, float)
                  )
              ):

                  movement_bearing = round(
                      bearing_degrees(
                          previous_lat,
                          previous_lon,
                          alat,
                          alon
                      ),
                      1
                  )

                  movement_direction = (
                      direction_name(
                          movement_bearing
                      )
                  )


              if isinstance(
                  previous_distance,
                  (int, float)
              ):

                  distance_change_km = round(
                      dist
                      -
                      previous_distance,
                      1
                  )

                  if distance_change_km < -0.5:
                      approaching_goch = True

                  elif distance_change_km > 0.5:
                      approaching_goch = False


              entry = {

                  "timestamp":
                      now.isoformat(),

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "hex":
                      hexcode,

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "name":
                      profile.get("name"),

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "country":
                      profile.get("country"),

                  "operator":
                      operator,

                  "description":
                      description,

                  "type":
                      ac_type,

                  "category":
                      category,

                  "lat":
                      alat,

                  "lon":
                      alon,

                  "distance_km":
                      dist,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get("alt_baro"),

                  "ground_speed":
                      ac.get("gs"),

                  "track":
                      ac.get("track"),

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change_km,

                  "approaching_goch":
                      approaching_goch,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat()
              }


              # =================================================
              # UNBEKANNTE HUBSCHRAUBER
              # =================================================

              if classification == "unknown":

                  old_unknown = unknown_db.get(
                      identity,
                      {}
                  )

                  old_min = old_unknown.get(
                      "minimum_distance_km"
                  )

                  if not isinstance(
                      old_min,
                      (int, float)
                  ):
                      old_min = dist

                  unknown_db[identity] = {

                      "identity":
                          identity,

                      "hex":
                          hexcode,

                      "registration":
                          registration,

                      "callsign":
                          callsign,

                      "type":
                          ac_type,

                      "category":
                          category,

                      "description":
                          description,

                      "operator":
                          operator,

                      "first_seen":
                          old_unknown.get(
                              "first_seen"
                          )
                          or
                          now.isoformat(),

                      "last_seen":
                          now.isoformat(),

                      "last_lat":
                          alat,

                      "last_lon":
                          alon,

                      "last_distance_km":
                          dist,

                      "minimum_distance_km":
                          min(
                              old_min,
                              dist
                          ),

                      "inside_30km":
                          inside_30km,

                      "status":
                          "needs_identification"
                  }


              # =================================================
              # 80-KM-HINTERGRUND
              # =================================================

              save_background = True

              for old in reversed(
                  background_history
              ):

                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  if old_time is not None:

                      if (
                          now
                          -
                          old_time
                      ).total_seconds() < 120:

                          save_background = False

                  break


              if save_background:

                  background_history.append(
                      entry
                  )


              # =================================================
              # SICHTBARE 30-KM-HISTORIE
              # =================================================

              if (
                  relevant
                  and
                  inside_30km
              ):

                  save_position = True

                  for old in reversed(
                      history
                  ):

                      if (
                          old.get("identity")
                          != identity
                      ):
                          continue

                      old_time = parse_time(
                          old.get("timestamp")
                      )

                      if old_time is not None:

                          if (
                              now
                              -
                              old_time
                          ).total_seconds() < 120:

                              save_position = False

                      break


                  if save_position:

                      history.append(
                          entry
                      )


                  current_relevant.append(
                      entry
                  )


              # =================================================
              # PUSH
              # =================================================

              if (
                  relevant
                  and
                  inside_30km
              ):

                  last_push_time = parse_time(
                      push_state.get(
                          identity
                      )
                  )

                  allow_push = False

                  # Neu in den 30-km-Kreis eingeflogen

                  if just_entered_30km:
                      allow_push = True

                  # Beim allerersten Erfassen bereits innerhalb

                  if (
                      not previous_state
                      and
                      inside_30km
                  ):
                      allow_push = True

                  # Sicherheit gegen Push-Spam

                  if (
                      allow_push
                      and
                      last_push_time is not None
                  ):

                      if (
                          now
                          -
                          last_push_time
                      ).total_seconds() < 3600:

                          allow_push = False


                  if allow_push:

                      detected_for_push.append(
                          entry
                      )

                      push_state[
                          identity
                      ] = now.isoformat()


              # =================================================
              # FLIGHT STATE
              # =================================================

              flight_state[identity] = {

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get("name"),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "country":
                      profile.get("country"),

                  "operator":
                      operator,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_seen_distance,

                  "minimum_distance_km":
                      minimum_distance,

                  "entered_30km":
                      entered_30km,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      alat,

                  "last_lon":
                      alon,

                  "last_distance_km":
                      dist,

                  "movement_bearing":
                      movement_bearing,

                  "movement_direction":
                      movement_direction,

                  "distance_change_km":
                      distance_change_km,

                  "approaching_goch":
                      approaching_goch,

                  "inside_30km":
                      inside_30km,

                  "relevant":
                      relevant
              }


          # =================================================
          # ALTE STATES
          # =================================================

          state_cutoff = (
              now
              -
              timedelta(days=2)
          )

          cleaned_states = {}

          for identity, state in flight_state.items():

              timestamp = parse_time(
                  state.get("last_seen")
              )

              if (
                  timestamp is not None
                  and
                  timestamp >= state_cutoff
              ):

                  cleaned_states[
                      identity
                  ] = state


          flight_state = cleaned_states


          # =================================================
          # SORTIEREN
          # =================================================

          history.sort(
              key=lambda x:
              x.get("timestamp", "")
          )

          background_history.sort(
              key=lambda x:
              x.get("timestamp", "")
          )


          # =================================================
          # SPEICHERN
          # =================================================

          save_json(
              HISTORY_FILE,
              history
          )

          save_json(
              BACKGROUND_FILE,
              background_history
          )

          save_json(
              FLIGHT_STATE_FILE,
              flight_state
          )

          save_json(
              PUSH_STATE_FILE,
              push_state
          )

          save_json(
              UNKNOWN_FILE,
              unknown_db
          )

          save_json(
              DETECTED_FILE,
              detected_for_push
          )

          save_json(
              CURRENT_FILE,
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "aircraft":
                      current_relevant
              }
          )


          # =================================================
          # LOG
          # =================================================

          print(
              "========================================="
          )

          print(
              "Luftrettung Goch V4.5"
          )

          print(
              "========================================="
          )

          print(
              "ADSB-Luftfahrzeuge im 80-km-Bereich:",
              output.get("total", 0)
          )

          print(
              "Erkannte Hubschrauber:",
              rotorcraft_count
          )

          print(
              "Relevante Hubschrauber im 30-km-Bereich:",
              len(current_relevant)
          )

          print(
              "Unbekannte Hubschrauber:",
              len(unknown_db)
          )

          print(
              "Push-Kandidaten:",
              len(detected_for_push)
          )


          for item in current_relevant:

              print(
                  "RELEVANT:",
                  item.get("name"),
                  item.get("registration"),
                  item.get("distance_km"),
                  "km",
                  item.get("movement_direction")
              )


          for identity, item in unknown_db.items():

              print(
                  "UNBEKANNT:",
                  item.get("hex"),
                  item.get("registration"),
                  item.get("callsign"),
                  item.get("type"),
                  item.get("last_distance_km"),
                  "km"
              )

          PY


      # =====================================================
      # PUSH
      # =====================================================

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'

          import json
          import urllib.request
          import os


          TOPIC = "luftrettung-goch-jm-26092026-x7k4"


          def send_ntfy(title, message):

              req = urllib.request.Request(

                  f"https://ntfy.sh/{TOPIC}",

                  data=message.encode(
                      "utf-8"
                  ),

                  method="POST",

                  headers={
                      "Title":
                          title,

                      "Priority":
                          "high",

                      "Tags":
                          "helicopter"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return response.status


          # =================================================
          # MANUELLER TEST
          # =================================================

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              ==
              "workflow_dispatch"
          ):

              status = send_ntfy(

                  "Luftrettung KLE - V4.5 Test",

                  (
                      "Version 4.5 läuft.\n"
                      "80-km-Hintergrundüberwachung aktiv.\n"
                      "30-km-Einsatzalarm aktiv.\n"
                      "aircraft_db.json aktiv.\n"
                      "Unbekannte Hubschrauber werden gespeichert."
                  )
              )

              print(
                  "Test-Push HTTP:",
                  status
              )

              raise SystemExit(0)


          # =================================================
          # AUTOMATISCH
          # =================================================

          try:

              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  detected = json.load(f)

          except Exception as e:

              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []


          if not detected:

              print(
                  "Keine relevante neue Erkennung."
              )

              raise SystemExit(0)


          for item in detected:

              name = (
                  item.get("name")
                  or
                  "Hubschrauber"
              )

              registration = (
                  item.get("registration")
                  or
                  "unbekannt"
              )

              callsign = (
                  item.get("callsign")
                  or
                  "unbekannt"
              )

              service = (
                  item.get("service")
                  or
                  "unbekannt"
              )

              station = (
                  item.get("station")
                  or
                  "noch nicht bestimmt"
              )

              distance = item.get(
                  "distance_km"
              )

              first_distance = item.get(
                  "first_seen_distance_km"
              )

              direction = item.get(
                  "movement_direction"
              )

              approaching = item.get(
                  "approaching_goch"
              )


              if approaching is True:

                  movement_text = (
                      "nähert sich Goch"
                  )

              elif approaching is False:

                  movement_text = (
                      "entfernt sich von Goch"
                  )

              else:

                  movement_text = (
                      "Bewegung noch nicht bestimmbar"
                  )


              message = (

                  f"{name} im 30-km-Radius erkannt\n"

                  f"Art: {service}\n"

                  f"Kennzeichen: {registration}\n"

                  f"Rufname: {callsign}\n"

                  f"Station: {station}\n"

                  f"Jetzt: {distance} km von Goch\n"

                  f"Erstmals erfasst: {first_distance} km\n"

                  f"Flugrichtung: {direction or 'noch unbekannt'}\n"

                  f"Status: {movement_text}"
              )


              status = send_ntfy(
                  "Luftrettung KLE",
                  message
              )

              print(
                  "Push gesendet:",
                  name,
                  registration,
                  "HTTP:",
                  status
              )

          PY


