                      lon
                  )


              # =================================================
              # DATENSATZ
              # =================================================

              entry = {

                  "timestamp":
                      now.isoformat(),

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "hex":
                      hexcode,

                  "registration":
                      registration,

