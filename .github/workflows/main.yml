                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get(
                          "service"
                      ),

                  "station":
                      profile.get(
                          "station"
                      ),

                  "country":
                      profile.get(
                          "country"
                      ),

                  "operator":
                      operator,

                  "description":
                      description,

                  "type":
                      ac_type,

                  "category":
                      category,

                  "lat":
                      lat,

                  "lon":
                      lon,

                  "location":
                      location,

                  "distance_km":
                      distance,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get(
                          "alt_baro"
                      ),

