name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten für Goch abrufen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          # Goch, NRW
          lat = 51.678
          lon = 6.159
          radius_nm = 16.2   # ca. 30 km

          url = (
              f"https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}"
          )

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Luftrettung-Kleve/3.2"}
              )

              with urllib.request.urlopen(req, timeout=25) as response:
                  source = json.load(response)

              aircraft = source.get("ac", [])

              output = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": lat,
                      "lon": lon,
                      "radius_km": 30
                  },
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:
              output = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }

          with open("aircraft.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("aircraft.json aktualisiert")
          print("Gefundene Luftfahrzeuge:", output.get("total", 0))
          PY

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"
          git add aircraft.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
          else
            git commit -m "Flugdaten automatisch aktualisiert"
            git push
          fi
