              )
          )

          print(
              "Telegram-Push-Kandidaten:",
              len(
                  detected
              )
          )

          print(
              "Geocoding-Cache:",
              len(
                  geocode_cache
              ),
              "Positionen"
          )

          print(
              "=========================================="
          )

          PY


