name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten für Goch abrufen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import urllib.request
          from datetime import datetime, timezone, timedelta

          # Mittelpunkt Goch
          lat = 51.678
          lon = 6.159
          radius_nm = 16.2   # ca. 30 km

          url = (
              f"https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}"
          )

          now = datetime.now(timezone.utc)

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Luftrettung-Kleve/3.4"}
              )

              with urllib.request.urlopen(req, timeout=25) as response:
                  source = json.load(response)

              aircraft = source.get("ac", [])

              output = {
                  "updated": now.isoformat(),
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": lat,
                      "lon": lon,
                      "radius_km": 30
                  },
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:
              output = {
                  "updated": now.isoformat(),
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }
              aircraft = []

          # Aktuellen Datenstand speichern
          with open("aircraft.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("aircraft.json aktualisiert")
          print("Gefundene Luftfahrzeuge:", output.get("total", 0))

          # ----------------------------------------------------
          # Hubschrauber / Rotorcraft erkennen
          # ----------------------------------------------------

          def text(value):
              if value is None:
                  return ""
              return str(value).strip().upper()

          def is_rotorcraft(ac):
              category = text(ac.get("category"))
              aircraft_type = text(ac.get("t"))
              description = text(ac.get("desc"))
              flight = text(ac.get("flight"))
              registration = text(ac.get("r"))

              combined = " ".join([
                  category,
                  aircraft_type,
                  description,
                  flight,
                  registration
              ])

              # ADS-B-Kategorie A7 = Rotorcraft
              if category == "A7":
                  return True

              # Häufige Hubschraubertypen
              helicopter_terms = [
                  "HELICOPTER",
                  "ROTORCRAFT",
                  "H145",
                  "H135",
                  "EC135",
                  "EC145",
                  "BK117",
                  "BK17",
                  "EC35",
                  "EC45",
                  "AS350",
                  "AS355",
                  "AW109",
                  "AW139",
                  "AW169",
                  "AW189",
                  "B06",
                  "BELL",
                  "R44",
                  "R22",
                  "S76"
              ]

              if any(term in combined for term in helicopter_terms):
                  return True

              # Bekannte Rettungs-/Polizei-Callsign-Muster
              callsign_terms = [
                  "CHRISTOPH",
                  "LIFELINER",
                  "POLICE",
                  "POLIZEI"
              ]

              if any(term in combined for term in callsign_terms):
                  return True

              return False

          rotorcraft = [ac for ac in aircraft if is_rotorcraft(ac)]

          print("Erkannte Rotorcraft:", len(rotorcraft))

          # ----------------------------------------------------
          # Historie laden
          # ----------------------------------------------------

          history_file = "history.json"

          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      history = json.load(f)

                  if not isinstance(history, list):
                      history = []

              except Exception:
                  history = []
          else:
              history = []

          # Nur letzte 7 Tage behalten
          cutoff = now - timedelta(days=7)

          cleaned_history = []

          for item in history:
              try:
                  timestamp = datetime.fromisoformat(
                      item["timestamp"].replace("Z", "+00:00")
                  )

                  if timestamp >= cutoff:
                      cleaned_history.append(item)

              except Exception:
                  pass

          history = cleaned_history

          # ----------------------------------------------------
          # Neue Treffer hinzufügen
          # ----------------------------------------------------

          for ac in rotorcraft:

              hex_code = text(ac.get("hex"))
              flight = text(ac.get("flight"))
              registration = text(ac.get("r"))
              aircraft_type = text(ac.get("t"))
              category = text(ac.get("category"))

              # Doppelten Treffer innerhalb von 10 Minuten vermeiden
              duplicate = False

              for old in reversed(history[-100:]):
                  same_aircraft = (
                      hex_code
                      and old.get("hex", "").upper() == hex_code
                  )

                  if same_aircraft:
                      try:
                          old_time = datetime.fromisoformat(
                              old["timestamp"].replace("Z", "+00:00")
                          )

                          if now - old_time < timedelta(minutes=10):
                              duplicate = True
                              break
                      except Exception:
                          pass

              if duplicate:
                  continue

              entry = {
                  "timestamp": now.isoformat(),
                  "hex": hex_code,
                  "flight": flight,
                  "registration": registration,
                  "type": aircraft_type,
                  "category": category,
                  "lat": ac.get("lat"),
                  "lon": ac.get("lon"),
                  "altitude_ft": ac.get("alt_baro"),
                  "ground_speed": ac.get("gs"),
                  "track": ac.get("track")
              }

              history.append(entry)

          # Sicherheitshalber chronologisch sortieren
          history.sort(
              key=lambda x: x.get("timestamp", ""),
              reverse=True
          )

          with open(history_file, "w", encoding="utf-8") as f:
              json.dump(history, f, ensure_ascii=False, indent=2)

          print("history.json aktualisiert")
          print("Treffer der letzten 7 Tage:", len(history))

          PY

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add aircraft.json history.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
          else
            git commit -m "Flugdaten und Historie automatisch aktualisiert"
            git push
          fi
