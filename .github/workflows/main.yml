name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten abrufen und Historie führen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          from datetime import datetime, timezone, timedelta

          # =================================================
          # GRUNDEINSTELLUNGEN V4.1
          # =================================================

          VERSION = "4.1"

          GOCH_LAT = 51.678
          GOCH_LON = 6.159

          # -------------------------------------------------
          # Zwei verschiedene Radien:
          #
          # TRACKING_RADIUS_KM:
          # Großer Bereich für Flugspuren.
          #
          # ALERT_RADIUS_KM:
          # Eigentlicher Überwachungs-/Alarmbereich.
          # -------------------------------------------------

          TRACKING_RADIUS_KM = 80
          ALERT_RADIUS_KM = 30

          TRACKING_RADIUS_NM = (
              TRACKING_RADIUS_KM / 1.852
          )

          URL = (
              f"https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{TRACKING_RADIUS_NM:.1f}"
          )

          now = datetime.now(timezone.utc)

          # =================================================
          # BEKANNTE HUBSCHRAUBER
          #
          # Station = Heimat-/Regelstation.
          # Station ist NICHT automatisch der tatsächliche
          # Startort eines konkreten Fluges.
          # =================================================

          KNOWN_AIRCRAFT = {

              "PH-DOC": {
                  "name": "Lifeliner 3",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "region": "Nijmegen / Oost-Brabant",
                  "country": "Niederlande"
              },

              "D-HZSA": {
                  "name": "Christoph 3",
                  "service": "Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "region": "Köln",
                  "country": "Deutschland"
              }

          }

          # =================================================
          # BEKANNTE RUFNAMEN
          #
          # Hier arbeiten wir bevorzugt mit Rufnamen.
          # Das ist bei Christoph-Maschinen sinnvoller als
          # eine dauerhafte Bindung an ein Kennzeichen.
          # =================================================

          KNOWN_CALLSIGNS = {

              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "service": "Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "region": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPH 3": {
                  "name": "Christoph 3",
                  "service": "Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "region": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "region": "Duisburg",
                  "country": "Deutschland"
              },

              "CHRISTOPH 9": {
                  "name": "Christoph 9",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "region": "Duisburg",
                  "country": "Deutschland"
              },

              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "region": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH 8": {
                  "name": "Christoph 8",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "region": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH WESTFALEN": {
                  "name": "Christoph Westfalen",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "region": "Münsterland",
                  "country": "Deutschland"
              },

              "CHRISTOPH DORTMUND": {
                  "name": "Christoph Dortmund",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "region": "Dortmund",
                  "country": "Deutschland"
              },

              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "region": "Nijmegen / Oost-Brabant",
                  "country": "Niederlande"
              },

              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "region": "Nijmegen / Oost-Brabant",
                  "country": "Niederlande"
              }

          }

          # =================================================
          # HUBSCHRAUBERTYPEN
          # =================================================

          KNOWN_ROTOR_TYPES = {
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          }

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "SAR"
          )

          # =================================================
          # HILFSFUNKTIONEN
          # =================================================

          def load_json(filename, default):

              if not os.path.exists(filename):
                  return default

              try:

                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return json.load(f)

              except Exception as e:

                  print(
                      filename,
                      "konnte nicht gelesen werden:",
                      repr(e)
                  )

                  return default


          def save_json(filename, data):

              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          def parse_time(value):

              if not value:
                  return None

              try:

                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:

                  return None


          def distance_km(
              lat1,
              lon1,
              lat2,
              lon2
          ):

              r = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(
                  lat2 - lat1
              )

              dl = math.radians(
                  lon2 - lon1
              )

              a = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1)
                  * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )

              return (
                  2
                  * r
                  * math.asin(
                      math.sqrt(a)
                  )
              )


          def normalize_registration(value):

              return str(
                  value or ""
              ).strip().upper()


          def normalize_callsign(value):

              return str(
                  value or ""
              ).strip().upper()


          def normalize_altitude(value):

              if value is None:
                  return None

              if isinstance(
                  value,
                  (int, float)
              ):
                  return value

              text = str(
                  value
              ).strip().lower()

              if text == "ground":
                  return 0

              try:
                  return float(text)

              except Exception:
                  return None


          def is_rotorcraft(ac):

              category = str(
                  ac.get("category") or ""
              ).strip().upper()

              ac_type = str(
                  ac.get("t") or ""
              ).strip().upper()

              callsign = normalize_callsign(
                  ac.get("flight")
              )

              registration = normalize_registration(
                  ac.get("r")
              )

              description = str(
                  ac.get("desc") or ""
              ).strip().upper()

              # ADS-B Kategorie A7
              if category == "A7":
                  return True

              # Bekannte Maschine
              if registration in KNOWN_AIRCRAFT:
                  return True

              # Typ
              for rotor_type in KNOWN_ROTOR_TYPES:

                  if rotor_type in ac_type:
                      return True

              # Textsuche
              text = " ".join([
                  callsign,
                  registration,
                  description,
                  ac_type
              ])

              for word in ROTOR_WORDS:

                  if word in text:
                      return True

              return False


          def get_profile(
              registration,
              callsign
          ):

              reg = normalize_registration(
                  registration
              )

              cs = normalize_callsign(
                  callsign
              )

              # Registrierung zuerst

              if reg in KNOWN_AIRCRAFT:

                  return KNOWN_AIRCRAFT[
                      reg
                  ].copy()

              # Bekannte Rufnamen

              for key, profile in KNOWN_CALLSIGNS.items():

                  if key in cs:

                      return profile.copy()

              # Christoph unbekannter Nummer

              if "CHRISTOPH" in cs:

                  cleaned = (
                      cs
                      .replace("_", " ")
                      .strip()
                  )

                  return {
                      "name": cleaned.title(),
                      "service":
                          "Rettungs-/Intensivtransporthubschrauber",
                      "station": None,
                      "region": None,
                      "country": "Deutschland"
                  }

              # Polizei

              if (
                  "POLICE" in cs
                  or "POLIZEI" in cs
                  or "BPO" in cs
              ):

                  return {
                      "name": "Polizeihubschrauber",
                      "service": "Polizei",
                      "station": None,
                      "region": None,
                      "country": None
                  }

              return {
                  "name": (
                      callsign
                      or registration
                      or "Unbekannter Hubschrauber"
                  ),
                  "service": "Hubschrauber",
                  "station": None,
                  "region": None,
                  "country": None
              }


          def ground_candidate(
              altitude,
              speed
          ):

              alt = normalize_altitude(
                  altitude
              )

              try:
                  gs = float(speed)
              except Exception:
                  gs = None

              if alt is not None and alt <= 300:

                  if gs is None or gs <= 35:

                      return True

              if gs is not None and gs <= 8:

                  return True

              return False


          # =================================================
          # ADSB.LOL ABRUFEN
          # =================================================

          try:

              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                      f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",

                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },

                  "tracking_radius_km":
                      TRACKING_RADIUS_KM,

                  "alert_radius_km":
                      ALERT_RADIUS_KM,

                  "total": len(aircraft),

                  "ac": aircraft
              }

          except Exception as e:

              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )

              output = {
                  "updated": now.isoformat(),
                  "version": VERSION,
                  "source": "ADSB.lol",
                  "error": str(e),
                  "tracking_radius_km":
                      TRACKING_RADIUS_KM,
                  "alert_radius_km":
                      ALERT_RADIUS_KM,
                  "total": 0,
                  "ac": []
              }

          save_json(
              "aircraft.json",
              output
          )

          # =================================================
          # HISTORIE
          # =================================================

          history = load_json(
              "history.json",
              []
          )

          if not isinstance(
              history,
              list
          ):
              history = []

          cutoff = (
              now
              - timedelta(days=14)
          )

          cleaned_history = []

          for old in history:

              old_time = parse_time(
                  old.get("timestamp")
              )

              if (
                  old_time is not None
                  and old_time >= cutoff
              ):

                  cleaned_history.append(
                      old
                  )

          history = cleaned_history

          # =================================================
          # FLUGSTATUS
          # =================================================

          flight_state = load_json(
              "flight_state.json",
              {}
          )

          if not isinstance(
              flight_state,
              dict
          ):
              flight_state = {}

          # =================================================
          # PUSH-STATUS
          # =================================================

          push_state = load_json(
              "push_state.json",
              {}
          )

          if not isinstance(
              push_state,
              dict
          ):
              push_state = {}

          detected_for_push = []
          stored_positions = []
          current_rotorcraft = []

          # =================================================
          # HUBSCHRAUBER VERARBEITEN
          # =================================================

          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(ac):
                  continue

              registration = str(
                  ac.get("r") or ""
              ).strip()

              callsign = str(
                  ac.get("flight") or ""
              ).strip()

              hexcode = str(
                  ac.get("hex") or ""
              ).strip().lower()

              ac_type = str(
                  ac.get("t") or ""
              ).strip().upper()

              category = str(
                  ac.get("category") or ""
              ).strip().upper()

              alat = ac.get("lat")
              alon = ac.get("lon")

              if not (
                  isinstance(
                      alat,
                      (int, float)
                  )
                  and isinstance(
                      alon,
                      (int, float)
                  )
              ):
                  continue

              identity = (
                  hexcode
                  or normalize_registration(
                      registration
                  )
                  or normalize_callsign(
                      callsign
                  )
              )

              if not identity:
                  continue

              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      alat,
                      alon
                  ),
                  1
              )

              # Sicherheitsprüfung:
              # Nur innerhalb des Trackingbereichs.

              if dist > TRACKING_RADIUS_KM:
                  continue

              profile = get_profile(
                  registration,
                  callsign
              )

              inside_alert_area = (
                  dist <= ALERT_RADIUS_KM
              )

              altitude = ac.get(
                  "alt_baro"
              )

              speed = ac.get(
                  "gs"
              )

              possible_ground = (
                  ground_candidate(
                      altitude,
                      speed
                  )
              )

              # =============================================
              # SEGMENT / FLUG
              # =============================================

              previous_state = flight_state.get(
                  identity,
                  {}
              )

              previous_seen = parse_time(
                  previous_state.get(
                      "last_seen"
                  )
              )

              new_segment = True

              if previous_seen is not None:

                  gap = (
                      now
                      - previous_seen
                  ).total_seconds()

                  # Bis 60 Minuten weiter derselbe
                  # beobachtete Flugzusammenhang.

                  if gap <= 3600:
                      new_segment = False

              if new_segment:

                  segment_id = (
                      identity
                      + "-"
                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      now.isoformat()
                  )

              else:

                  segment_id = (
                      previous_state.get(
                          "segment_id"
                      )
                      or (
                          identity
                          + "-"
                          + now.strftime(
                              "%Y%m%dT%H%M%S"
                          )
                      )
                  )

                  first_seen = (
                      previous_state.get(
                          "first_seen"
                      )
                      or now.isoformat()
                  )

              # =============================================
              # MÖGLICHE BODEN-/ZWISCHENLANDUNG
              # =============================================

              ground_event = False

              if possible_ground:

                  previous_ground = (
                      previous_state.get(
                          "ground_candidate",
                          False
                      )
                  )

                  if not previous_ground:
                      ground_event = True

              # =============================================
              # EINTRAG
              # =============================================

              entry = {

                  "timestamp":
                      now.isoformat(),

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "hex":
                      hexcode,

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "name":
                      profile.get("name"),

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "region":
                      profile.get("region"),

                  "country":
                      profile.get("country"),

                  "type":
                      ac_type,

                  "category":
                      category,

                  "lat":
                      alat,

                  "lon":
                      alon,

                  "distance_km":
                      dist,

                  "inside_alert_area":
                      inside_alert_area,

                  "altitude_ft":
                      altitude,

                  "ground_speed":
                      speed,

                  "track":
                      ac.get("track"),

                  "first_seen":
                      first_seen,

                  "last_seen":
                      now.isoformat(),

                  "ground_candidate":
                      possible_ground,

                  "ground_event":
                      ground_event,

                  # Wird bewusst NICHT erfunden.
                  "actual_start":
                      None,

                  "actual_destination":
                      None
              }

              current_rotorcraft.append(
                  entry
              )

              # =============================================
              # POSITION SPEICHERN
              # =============================================

              save_position = True

              for old in reversed(
                  history
              ):

                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  if old_time is not None:

                      seconds = (
                          now
                          - old_time
                      ).total_seconds()

                      # Doppelstarts unterdrücken

                      if seconds < 120:
                          save_position = False

                  break

              if save_position:

                  history.append(
                      entry
                  )

                  stored_positions.append(
                      entry
                  )

              # =============================================
              # EINTRITT IN 30-KM-BEREICH
              #
              # Entscheidend für Push:
              # außerhalb -> innerhalb
              # =============================================

              previous_inside = bool(
                  previous_state.get(
                      "inside_alert_area",
                      False
                  )
              )

              entered_alert_area = (
                  inside_alert_area
                  and not previous_inside
              )

              # =============================================
              # FLIGHT STATE
              # =============================================

              flight_state[
                  identity
              ] = {

                  "identity":
                      identity,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get("name"),

                  "registration":
                      registration,

                  "callsign":
                      callsign,

                  "type":
                      ac_type,

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "region":
                      profile.get("region"),

                  "country":
                      profile.get("country"),

                  "first_seen":
                      first_seen,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      alat,

                  "last_lon":
                      alon,

                  "last_distance_km":
                      dist,

                  "inside_alert_area":
                      inside_alert_area,

                  "ground_candidate":
                      possible_ground
              }

              # =============================================
              # PUSH NUR BEIM EINTRITT IN 30 KM
              # =============================================

              if entered_alert_area:

                  send_push = True

                  last_push = push_state.get(
                      identity
                  )

                  if last_push:

                      last_push_time = parse_time(
                          last_push
                      )

                      if last_push_time is not None:

                          seconds = (
                              now
                              - last_push_time
                          ).total_seconds()

                          # Gleiche Maschine nicht ständig
                          # erneut melden.

                          if seconds < 3600:
                              send_push = False

                  if send_push:

                      detected_for_push.append(
                          entry
                      )

                      push_state[
                          identity
                      ] = now.isoformat()

          # =================================================
          # FLIGHT STATES BEREINIGEN
          # =================================================

          state_cutoff = (
              now
              - timedelta(days=2)
          )

          cleaned_states = {}

          for identity, state in flight_state.items():

              state_time = parse_time(
                  state.get(
                      "last_seen"
                  )
              )

              if (
                  state_time is not None
                  and state_time >= state_cutoff
              ):

                  cleaned_states[
                      identity
                  ] = state

          flight_state = cleaned_states

          # =================================================
          # HISTORIE SORTIEREN
          # =================================================

          history.sort(
              key=lambda x:
              x.get(
                  "timestamp",
                  ""
              )
          )

          # =================================================
          # SPEICHERN
          # =================================================

          save_json(
              "history.json",
              history
          )

          save_json(
              "flight_state.json",
              flight_state
          )

          save_json(
              "push_state.json",
              push_state
          )

          save_json(
              "detected.json",
              detected_for_push
          )

          save_json(
              "current_rotorcraft.json",
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "tracking_radius_km":
                      TRACKING_RADIUS_KM,

                  "alert_radius_km":
                      ALERT_RADIUS_KM,

                  "aircraft":
                      current_rotorcraft
              }
          )

          # =================================================
          # LOG
          # =================================================

          print(
              "Luftrettung KLE V"
              + VERSION
          )

          print(
              "Trackingradius:",
              TRACKING_RADIUS_KM,
              "km"
          )

          print(
              "Alarmradius:",
              ALERT_RADIUS_KM,
              "km"
          )

          print(
              "Luftfahrzeuge im großen Suchgebiet:",
              output.get(
                  "total",
                  0
              )
          )

          print(
              "Erkannte Hubschrauber:",
              len(
                  current_rotorcraft
              )
          )

          print(
              "Neue Positionspunkte:",
              len(
                  stored_positions
              )
          )

          print(
              "Neue 30-km-Eintritte:",
              len(
                  detected_for_push
              )
          )

          for item in stored_positions:

              print(
                  "POSITION:",
                  item.get("name"),
                  item.get("registration"),
                  item.get("callsign"),
                  item.get("distance_km"),
                  "km",
                  "Alarmbereich:",
                  item.get(
                      "inside_alert_area"
                  ),
                  "Bodenkandidat:",
                  item.get(
                      "ground_candidate"
                  )
              )

          PY

      # =====================================================
      # PUSH
      # =====================================================

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import os

          TOPIC = "luftrettung-goch-jm-26092026-x7k4"

          def send_ntfy(
              title,
              message
          ):

              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode(
                      "utf-8"
                  ),
                  method="POST",
                  headers={
                      "Title": title,
                      "Priority": "high",
                      "Tags": "helicopter"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as response:

                  return response.status

          # =================================================
          # MANUELLER START = TEST
          # =================================================

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              == "workflow_dispatch"
          ):

              print(
                  "Manueller Start erkannt."
              )

              status = send_ntfy(
                  "Luftrettung KLE - Test",
                  (
                      "TEST - Luftrettung Goch V4.1\n"
                      "Trackingradius: 80 km\n"
                      "Alarmradius: 30 km\n"
                      "GitHub Actions funktioniert."
                  )
              )

              print(
                  "TEST-PUSH HTTP:",
                  status
              )

              raise SystemExit(0)

          # =================================================
          # AUTOMATISCHER BETRIEB
          # =================================================

          try:

              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:

                  detected = json.load(f)

          except Exception as e:

              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []

          if not detected:

              print(
                  "Kein neuer Eintritt "
                  "in den 30-km-Bereich."
              )

              raise SystemExit(0)

          for item in detected:

              name = (
                  item.get("name")
                  or "Hubschrauber"
              )

              registration = (
                  item.get("registration")
                  or "unbekannt"
              )

              callsign = (
                  item.get("callsign")
                  or "unbekannt"
              )

              ac_type = (
                  item.get("type")
                  or "unbekannt"
              )

              station = (
                  item.get("station")
                  or "unbekannt"
              )

              distance = item.get(
                  "distance_km"
              )

              if distance is None:

                  distance_text = (
                      "unbekannt"
                  )

              else:

                  distance_text = (
                      f"{distance} km"
                  )

              message = (
                  f"{name} im 30-km-Radius erkannt\n"
                  f"Kennzeichen: {registration}\n"
                  f"Rufname: {callsign}\n"
                  f"Typ: {ac_type}\n"
                  f"Station: {station}\n"
                  f"Entfernung zu Goch: "
                  f"{distance_text}"
              )

              status = send_ntfy(
                  "Luftrettung KLE",
                  message
              )

              print(
                  "Push gesendet:",
                  name,
                  registration,
                  "HTTP:",
                  status
              )

          PY

