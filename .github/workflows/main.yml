name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten abrufen und Historie führen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          from datetime import datetime, timezone, timedelta

          # Mittelpunkt Goch
          lat = 51.678
          lon = 6.159

          # ca. 30 km
          radius_nm = 16.2

          url = f"https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}"

          now = datetime.now(timezone.utc)

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Luftrettung-Kleve/3.5"}
              )

              with urllib.request.urlopen(req, timeout=25) as response:
                  source = json.load(response)

              aircraft = source.get("ac", [])

              output = {
                  "updated": now.isoformat(),
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": lat,
                      "lon": lon,
                      "radius_km": 30
                  },
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:
              output = {
                  "updated": now.isoformat(),
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }

          with open("aircraft.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          rotor_types = {
              "H1P", "H1T", "H2P", "H2T",
              "H3P", "H3T", "H4P", "H4T",
              "H5P", "H5T", "H6P", "H6T"
          }

          def distance_km(lat1, lon1, lat2, lon2):
              r = 6371.0
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)
              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)

              a = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1) * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )

              return 2 * r * math.asin(math.sqrt(a))

          def parse_time(value):
              try:
                  return datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except Exception:
                  return None

          history_file = "history.json"

          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          if not isinstance(history, list):
              history = []

          # -------------------------------------------------
          # Nur die letzten 14 Tage behalten
          # -------------------------------------------------

          cutoff = now - timedelta(days=14)

          cleaned_history = []

          for old in history:
              old_time = parse_time(old.get("timestamp", ""))

              if old_time is not None and old_time >= cutoff:
                  cleaned_history.append(old)

          history = cleaned_history

          # -------------------------------------------------
          # Letzte Push-Meldungen laden
          # -------------------------------------------------

          push_file = "push_state.json"

          if os.path.exists(push_file):
              try:
                  with open(push_file, "r", encoding="utf-8") as f:
                      push_state = json.load(f)
              except Exception:
                  push_state = {}
          else:
              push_state = {}

          if not isinstance(push_state, dict):
              push_state = {}

          detected_for_push = []
          stored_positions = []

          for ac in output.get("ac", []):

              ac_type = str(ac.get("t") or "").strip().upper()
              category = str(ac.get("category") or "").strip().upper()

              # ADS-B Kategorie A7 = Rotorcraft
              is_rotor = category == "A7" or ac_type in rotor_types

              if not is_rotor:
                  continue

              callsign = str(ac.get("flight") or "").strip()
              registration = str(ac.get("r") or "").strip()
              hexcode = str(ac.get("hex") or "").strip()

              alat = ac.get("lat")
              alon = ac.get("lon")

              dist = None

              if (
                  isinstance(alat, (int, float))
                  and isinstance(alon, (int, float))
              ):
                  dist = round(
                      distance_km(lat, lon, alat, alon),
                      1
                  )

              identity = hexcode or registration or callsign

              if not identity:
                  continue

              # Für eine Flugspur brauchen wir eine Position.
              if not (
                  isinstance(alat, (int, float))
                  and isinstance(alon, (int, float))
              ):
                  continue

              # -------------------------------------------------
              # HISTORIE:
              # ungefähr alle 5 Minuten einen Positionspunkt
              # -------------------------------------------------

              save_position = True

              for old in reversed(history):
                  if old.get("identity") != identity:
                      continue

                  old_time = parse_time(old.get("timestamp", ""))

                  if old_time is not None:
                      # Schutz gegen doppelte Runs innerhalb
                      # weniger Minuten
                      if (now - old_time).total_seconds() < 240:
                          save_position = False

                  break

              entry = {
                  "timestamp": now.isoformat(),
                  "identity": identity,
                  "hex": hexcode,
                  "registration": registration,
                  "callsign": callsign,
                  "type": ac_type,
                  "category": category,
                  "lat": alat,
                  "lon": alon,
                  "distance_km": dist,
                  "altitude_ft": ac.get("alt_baro"),
                  "ground_speed": ac.get("gs"),
                  "track": ac.get("track")
              }

              if save_position:
                  history.append(entry)
                  stored_positions.append(entry)

              # -------------------------------------------------
              # PUSH:
              # dieselbe Maschine höchstens einmal pro 60 Minuten
              # -------------------------------------------------

              send_push = True

              last_push = push_state.get(identity)

              if last_push:
                  last_push_time = parse_time(last_push)

                  if last_push_time is not None:
                      if (now - last_push_time).total_seconds() < 3600:
                          send_push = False

              if send_push:
                  detected_for_push.append(entry)
                  push_state[identity] = now.isoformat()

          # Noch einmal chronologisch sortieren
          history.sort(
              key=lambda x: x.get("timestamp", "")
          )

          with open(history_file, "w", encoding="utf-8") as f:
              json.dump(history, f, ensure_ascii=False, indent=2)

          with open(push_file, "w", encoding="utf-8") as f:
              json.dump(push_state, f, ensure_ascii=False, indent=2)

          with open("detected.json", "w", encoding="utf-8") as f:
              json.dump(
                  detected_for_push,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("aircraft.json aktualisiert")
          print("Luftfahrzeuge im Suchgebiet:", output.get("total", 0))
          print("Neue Positionspunkte:", len(stored_positions))
          print("Neue Push-Meldungen:", len(detected_for_push))

          for item in stored_positions:
              print(
                  "POSITION:",
                  item.get("registration"),
                  item.get("callsign"),
                  item.get("distance_km"),
                  "km"
              )
          PY

      - name: iPhone Push senden
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          TOPIC = "luftrettung-goch-jm-26092026-x7k4"

          try:
              with open("detected.json", "r", encoding="utf-8") as f:
                  detected = json.load(f)
          except Exception:
              detected = []

          if not detected:
              print("Keine neue Push-Erkennung.")
              raise SystemExit(0)

          for item in detected:

              registration = item.get("registration") or "unbekannt"
              callsign = item.get("callsign") or "unbekannt"
              ac_type = item.get("type") or "unbekannt"
              distance = item.get("distance_km")

              if distance is None:
                  distance_text = "unbekannt"
              else:
                  distance_text = f"{distance} km"

              message = (
                  f"Hubschrauber im 30-km-Radius erkannt\n"
                  f"Kennzeichen: {registration}\n"
                  f"Rufname: {callsign}\n"
                  f"Typ: {ac_type}\n"
                  f"Entfernung zu Goch: {distance_text}"
              )

              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode("utf-8"),
                  method="POST",
                  headers={
                      "Title": "Luftrettung KLE",
                      "Priority": "high",
                      "Tags": "helicopter"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=20
                  ) as response:

                      print(
                          "Push gesendet:",
                          registration,
                          response.status
                      )

              except Exception as e:
                  print(
                      "Push konnte nicht gesendet werden:",
                      e
                  )
          PY

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add aircraft.json history.json push_state.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
          else
            git commit -m "Flugdaten und Flugspuren aktualisiert"
            git pull --rebase origin main
            git push origin main
          fi
