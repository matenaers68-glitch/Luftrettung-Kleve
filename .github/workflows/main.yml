name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Flugdaten abrufen und Historie führen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import math
          import os
          from datetime import datetime, timezone

          # Mittelpunkt Goch
          lat = 51.678
          lon = 6.159
          radius_nm = 16.2  # ca. 30 km

          url = f"https://api.adsb.lol/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}"

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Luftrettung-Kleve/3.4"}
              )

              with urllib.request.urlopen(req, timeout=25) as response:
                  source = json.load(response)

              aircraft = source.get("ac", [])

              output = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "source": "ADSB.lol",
                  "center": {
                      "name": "Goch",
                      "lat": lat,
                      "lon": lon,
                      "radius_km": 30
                  },
                  "total": len(aircraft),
                  "ac": aircraft
              }

          except Exception as e:
              output = {
                  "updated": datetime.now(timezone.utc).isoformat(),
                  "source": "ADSB.lol",
                  "error": str(e),
                  "total": 0,
                  "ac": []
              }

          with open("aircraft.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          # Bekannte/typische Rotorcraft-Typen
          rotor_types = {
              "EC35", "EC45", "EC55",
              "H135", "H145",
              "BK17", "B06", "B407",
              "AS50", "AS55",
              "R22", "R44", "R66",
              "A109", "A139", "A169", "A189",
              "S76", "S92"
          }

          def distance_km(lat1, lon1, lat2, lon2):
              r = 6371.0
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)
              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)

              a = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1) * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )
              return 2 * r * math.asin(math.sqrt(a))

          history_file = "history.json"

          if os.path.exists(history_file):
              try:
                  with open(history_file, "r", encoding="utf-8") as f:
                      history = json.load(f)
              except Exception:
                  history = []
          else:
              history = []

          if not isinstance(history, list):
              history = []

          now = datetime.now(timezone.utc)
          detected = []

          for ac in output.get("ac", []):
              ac_type = str(ac.get("t") or "").strip().upper()
              category = str(ac.get("category") or "").strip().upper()

              # ADS-B Kategorie A7 = Rotorcraft
              is_rotor = category == "A7" or ac_type in rotor_types

              if not is_rotor:
                  continue

              callsign = str(ac.get("flight") or "").strip()
              registration = str(ac.get("r") or "").strip()
              hexcode = str(ac.get("hex") or "").strip()
              alat = ac.get("lat")
              alon = ac.get("lon")

              dist = None
              if isinstance(alat, (int, float)) and isinstance(alon, (int, float)):
                  dist = round(distance_km(lat, lon, alat, alon), 1)

              identity = hexcode or registration or callsign
              if not identity:
                  continue

              # Verhindert einen neuen Historieneintrag bei jedem 5-Minuten-Lauf:
              # dieselbe Maschine wird innerhalb von 60 Minuten nur einmal erfasst.
              duplicate = False

              for old in reversed(history[-300:]):
                  if old.get("identity") != identity:
                      continue

                  try:
                      old_time = datetime.fromisoformat(
                          old["timestamp"].replace("Z", "+00:00")
                      )
                      if (now - old_time).total_seconds() < 3600:
                          duplicate = True
                  except Exception:
                      pass

                  break

              if duplicate:
                  continue

              entry = {
                  "timestamp": now.isoformat(),
                  "identity": identity,
                  "hex": hexcode,
                  "registration": registration,
                  "callsign": callsign,
                  "type": ac_type,
                  "category": category,
                  "lat": alat,
                  "lon": alon,
                  "distance_km": dist,
                  "altitude_ft": ac.get("alt_baro"),
                  "ground_speed": ac.get("gs")
              }

              history.append(entry)
              detected.append(entry)

          # Historie begrenzen
          history = history[-2000:]

          with open(history_file, "w", encoding="utf-8") as f:
              json.dump(history, f, ensure_ascii=False, indent=2)

          print("aircraft.json aktualisiert")
          print("Luftfahrzeuge im Suchgebiet:", output.get("total", 0))
          print("Neue Rotorcraft-Historieneinträge:", len(detected))

          for item in detected:
              print(
                  item.get("registration"),
                  item.get("callsign"),
                  item.get("type"),
                  item.get("distance_km"),
                  "km"
              )
          PY

      - name: Neue Daten speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add aircraft.json history.json

          if git diff --cached --quiet; then
            echo "Keine Änderung vorhanden."
          else
            git commit -m "Flugdaten und Historie automatisch aktualisiert"
            git push
          fi
