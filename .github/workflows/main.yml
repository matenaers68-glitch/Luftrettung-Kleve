name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flugdaten V4.6 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, math, os, re
          from datetime import datetime, timezone, timedelta

          VERSION = "4.6"
          GOCH_LAT, GOCH_LON = 51.678, 6.159
          ACTION_RADIUS_KM = 30
          BACKGROUND_RADIUS_KM = 80
          BACKGROUND_RADIUS_NM = round(BACKGROUND_RADIUS_KM / 1.852, 1)
          URL = f"https://api.adsb.lol/v2/lat/{GOCH_LAT}/lon/{GOCH_LON}/dist/{BACKGROUND_RADIUS_NM}"
          now = datetime.now(timezone.utc)

          AIRCRAFT_FILE = "aircraft.json"
          HISTORY_FILE = "history.json"
          BACKGROUND_FILE = "background_history.json"
          CURRENT_FILE = "current_rotorcraft.json"
          FLIGHT_STATE_FILE = "flight_state.json"
          PUSH_STATE_FILE = "push_state.json"
          DETECTED_FILE = "detected.json"
          DATABASE_FILE = "aircraft_db.json"
          UNKNOWN_FILE = "unknown_aircraft.json"

          KNOWN_CALLSIGNS = {
              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },
              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Volkel",
                  "country": "Niederlande"
              },
              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "country": "Deutschland"
              },
              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "country": "Deutschland"
              },
              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Köln",
                  "country": "Deutschland"
              },
              "CHRISTOPHWESTFALEN": {
                  "name": "Christoph Westfalen",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "country": "Deutschland"
              },
              "CHRISTOPHDORTMUND": {
                  "name": "Christoph Dortmund",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "country": "Deutschland"
              },
          }

          ROTOR_TYPES = (
              "EC35", "EC45", "H135", "H145",
              "EC135", "EC145", "BK17",
              "B06", "B407", "AS50", "AS55",
              "R22", "R44", "R66",
              "AW09", "AW109", "AW139", "AW169",
              "S76", "S92"
          )

          ROTOR_WORDS = (
              "HELI", "ROTOR", "CHRISTOPH",
              "LIFELINER", "LIFELN",
              "POLICE", "POLIZEI", "POLITIE", "SAR"
          )

          def load_json(fn, default):
              try:
                  with open(fn, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def save_json(fn, data):
              with open(fn, "w", encoding="utf-8") as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          def parse_time(v):
              try:
                  if not v:
                      return None
                  return datetime.fromisoformat(
                      str(v).replace("Z", "+00:00")
                  )
              except Exception:
                  return None

          def distance_km(a, b, c, d):
              r = 6371.0
              p1 = math.radians(a)
              p2 = math.radians(c)
              dp = math.radians(c - a)
              dl = math.radians(d - b)

              x = (
                  math.sin(dp / 2) ** 2
                  + math.cos(p1)
                  * math.cos(p2)
                  * math.sin(dl / 2) ** 2
              )

              return 2 * r * math.asin(math.sqrt(x))

          def bearing_degrees(a, b, c, d):
              p1 = math.radians(a)
              p2 = math.radians(c)
              dl = math.radians(d - b)

              y = math.sin(dl) * math.cos(p2)

              x = (
                  math.cos(p1) * math.sin(p2)
                  - math.sin(p1)
                  * math.cos(p2)
                  * math.cos(dl)
              )

              return (
                  math.degrees(math.atan2(y, x)) + 360
              ) % 360

          def direction_name(v):
              directions = [
                  "Nord",
                  "Nordost",
                  "Ost",
                  "Südost",
                  "Süd",
                  "Südwest",
                  "West",
                  "Nordwest"
              ]

              return directions[
                  int((v + 22.5) // 45) % 8
              ]

          def normalize(v):
              return str(v or "").strip().upper()

          def compact(v):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(v)
              )

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )

          if not isinstance(aircraft_db, dict):
              aircraft_db = {}

          def database_profile(ac):
              h = str(
                  ac.get("hex") or ""
              ).strip().lower()

              r = normalize(
                  ac.get("r")
              )

              for key in (
                  h,
                  r,
                  compact(r)
              ):
                  p = (
                      aircraft_db.get(key)
                      if key
                      else None
                  )

                  if (
                      isinstance(p, dict)
                      and
                      p.get("classification")
                  ):
                      q = p.copy()
                      q["classification_source"] = "aircraft_db"
                      return q

              return None

          def is_rotorcraft(ac):
              if database_profile(ac):
                  return True

              if normalize(
                  ac.get("category")
              ) == "A7":
                  return True

              t = normalize(
                  ac.get("t")
              )

              if any(
                  x in t
                  for x in ROTOR_TYPES
              ):
                  return True

              text = " ".join(
                  normalize(ac.get(k))
                  for k in (
                      "flight",
                      "r",
                      "desc",
                      "ownOp",
                      "t"
                  )
              )

              return any(
                  x in text
                  for x in ROTOR_WORDS
              )

          def classify(ac):
              p = database_profile(ac)

              if p:
                  return p

              reg = normalize(
                  ac.get("r")
              )

              cs = normalize(
                  ac.get("flight")
              )

              ck = compact(cs)

              desc = normalize(
                  ac.get("desc")
              )

              op = normalize(
                  ac.get("ownOp")
              )

              for key, p in KNOWN_CALLSIGNS.items():
                  if key in ck:
                      q = p.copy()
                      q["classification_source"] = "callsign"
                      return q

              text = " ".join(
                  (
                      cs,
                      desc,
                      op
                  )
              )

              if any(
                  x in text
                  for x in (
                      "POLICE",
                      "POLIZEI",
                      "BUNDESPOLIZEI",
                      "POLITIE"
                  )
              ):
                  return {
                      "name":
                          cs
                          or reg
                          or "Polizeihubschrauber",

                      "classification":
                          "police",

                      "service":
                          "Polizei",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }

              if any(
                  x in text
                  for x in (
                      "SAR",
                      "MILITARY",
                      "ARMY",
                      "AIR FORCE",
                      "LUFTWAFFE",
                      "BUNDESWEHR",
                      "NAVY",
                      "KONINKLIJKE LUCHTMACHT",
                      "ROYAL NETHERLANDS AIR FORCE"
                  )
              ):
                  return {
                      "name":
                          cs
                          or reg
                          or "Militärhubschrauber",

                      "classification":
                          "military",

                      "service":
                          "Militär / SAR",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }

              return {
                  "name":
                      cs
                      or reg
                      or "Unbekannter Hubschrauber",

                  "classification":
                      "unknown",

                  "service":
                      "noch nicht bestimmt",

                  "station":
                      None,

                  "country":
                      None,

                  "classification_source":
                      "unknown"
              }

          try:
              req = urllib.request.Request(
                  URL,
                  headers={
                      "User-Agent":
                          f"Luftrettung-Kleve/{VERSION}"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=25
              ) as resp:
                  source = json.load(resp)

              aircraft = source.get(
                  "ac",
                  []
              )

              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },

                  "background_radius_km":
                      80,

                  "action_radius_km":
                      30,

                  "total":
                      len(aircraft),

                  "ac":
                      aircraft
              }

          except Exception as e:
              print(
                  "ADSB.lol Fehler:",
                  repr(e)
              )

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "error":
                      str(e),

                  "total":
                      0,

                  "ac":
                      []
              }

          save_json(
              AIRCRAFT_FILE,
              output
          )

          history = load_json(
              HISTORY_FILE,
              []
          )

          background = load_json(
              BACKGROUND_FILE,
              []
          )

          states = load_json(
              FLIGHT_STATE_FILE,
              {}
          )

          pushes = load_json(
              PUSH_STATE_FILE,
              {}
          )

          unknown = load_json(
              UNKNOWN_FILE,
              {}
          )

          if not isinstance(history, list):
              history = []

          if not isinstance(background, list):
              background = []

          if not isinstance(states, dict):
              states = {}

          if not isinstance(pushes, dict):
              pushes = {}

          if not isinstance(unknown, dict):
              unknown = {}

          def clean(entries, cutoff):
              cleaned = []

              for x in entries:
                  timestamp = parse_time(
                      x.get("timestamp")
                  )

                  if (
                      timestamp
                      and
                      timestamp >= cutoff
                  ):
                      cleaned.append(x)

              return cleaned

          history = clean(
              history,
              now - timedelta(days=14)
          )

          background = clean(
              background,
              now - timedelta(days=2)
          )

          current = []
          detected = []
          rotor_count = 0

          for ac in output.get(
              "ac",
              []
          ):
              if not is_rotorcraft(ac):
                  continue

              rotor_count += 1

              lat = ac.get("lat")
              lon = ac.get("lon")

              if not isinstance(
                  lat,
                  (int, float)
              ):
                  continue

              if not isinstance(
                  lon,
                  (int, float)
              ):
                  continue

              h = str(
                  ac.get("hex") or ""
              ).strip().lower()

              reg = str(
                  ac.get("r") or ""
              ).strip()

              cs = str(
                  ac.get("flight") or ""
              ).strip()

              ident = (
                  h
                  or compact(reg)
                  or compact(cs)
              )

              if not ident:
                  continue

              typ = str(
                  ac.get("t") or ""
              ).strip().upper()

              cat = str(
                  ac.get("category") or ""
              ).strip().upper()

              desc = str(
                  ac.get("desc") or ""
              ).strip()

              op = str(
                  ac.get("ownOp") or ""
              ).strip()

              dist = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      lat,
                      lon
                  ),
                  1
              )

              profile = classify(ac)

              classification = profile.get(
                  "classification",
                  "unknown"
              )

              relevant = (
                  classification
                  in (
                      "rescue",
                      "police",
                      "military"
                  )
              )

              prev = states.get(
                  ident,
                  {}
              )

              prev_seen = parse_time(
                  prev.get("last_seen")
              )

              new_segment = (
                  not prev_seen
                  or
                  (
                      now - prev_seen
                  ).total_seconds() > 3600
              )

              if new_segment:
                  segment_id = (
                      ident
                      + "-"
                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = now.isoformat()
                  first_dist = dist
                  minimum = dist
                  entered = None

              else:
                  segment_id = (
                      prev.get("segment_id")
                      or
                      ident
                      + "-"
                      + now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      prev.get("first_seen")
                      or now.isoformat()
                  )

                  first_dist = prev.get(
                      "first_seen_distance_km",
                      dist
                  )

                  minimum = min(
                      prev.get(
                          "minimum_distance_km",
                          dist
                      ),
                      dist
                  )

                  entered = prev.get(
                      "entered_30km"
                  )

              inside = (
                  dist <= ACTION_RADIUS_KM
              )

              just_entered = (
                  inside
                  and
                  not prev.get(
                      "inside_30km",
                      False
                  )
              )

              if (
                  inside
                  and
                  not entered
              ):
                  entered = now.isoformat()

              mb = None
              md = None
              approach = None
              delta = None

              plat = prev.get(
                  "last_lat"
              )

              plon = prev.get(
                  "last_lon"
              )

              pdist = prev.get(
                  "last_distance_km"
              )

              if (
                  isinstance(
                      plat,
                      (int, float)
                  )
                  and
                  isinstance(
                      plon,
                      (int, float)
                  )
              ):
                  mb = round(
                      bearing_degrees(
                          plat,
                          plon,
                          lat,
                          lon
                      ),
                      1
                  )

                  md = direction_name(mb)

              if isinstance(
                  pdist,
                  (int, float)
              ):
                  delta = round(
                      dist - pdist,
                      1
                  )

                  if delta < -0.5:
                      approach = True

                  elif delta > 0.5:
                      approach = False

              entry = {
                  "timestamp":
                      now.isoformat(),

                  "identity":
                      ident,

                  "segment_id":
                      segment_id,

                  "hex":
                      h,

                  "registration":
                      reg,

                  "callsign":
                      cs,

                  "name":
                      profile.get("name"),

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "country":
                      profile.get("country"),

                  "operator":
                      op,

                  "description":
                      desc,

                  "type":
                      typ,

                  "category":
                      cat,

                  "lat":
                      lat,

                  "lon":
                      lon,

                  "distance_km":
                      dist,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant,

                  "altitude_ft":
                      ac.get("alt_baro"),

                  "ground_speed":
                      ac.get("gs"),

                  "track":
                      ac.get("track"),

                  "movement_bearing":
                      mb,

                  "movement_direction":
                      md,

                  "distance_change_km":
                      delta,

                  "approaching_goch":
                      approach,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_dist,

                  "minimum_distance_km":
                      minimum,

                  "entered_30km":
                      entered,

                  "last_seen":
                      now.isoformat()
              }

              if classification == "unknown":
                  old = unknown.get(
                      ident,
                      {}
                  )

                  oldmin = old.get(
                      "minimum_distance_km"
                  )

                  if not isinstance(
                      oldmin,
                      (int, float)
                  ):
                      oldmin = dist

                  unknown[ident] = {
                      "identity":
                          ident,

                      "hex":
                          h,

                      "registration":
                          reg,

                      "callsign":
                          cs,

                      "type":
                          typ,

                      "category":
                          cat,

                      "description":
                          desc,

                      "operator":
                          op,

                      "first_seen":
                          old.get("first_seen")
                          or now.isoformat(),

                      "last_seen":
                          now.isoformat(),

                      "last_lat":
                          lat,

                      "last_lon":
                          lon,

                      "last_distance_km":
                          dist,

                      "minimum_distance_km":
                          min(
                              oldmin,
                              dist
                          ),

                      "inside_30km":
                          inside,

                      "status":
                          "needs_identification"
                  }

              def recent_same(
                  entries,
                  seconds=120
              ):
                  for old in reversed(entries):
                      if old.get(
                          "identity"
                      ) != ident:
                          continue

                      ot = parse_time(
                          old.get("timestamp")
                      )

                      return bool(
                          ot
                          and
                          (
                              now - ot
                          ).total_seconds()
                          < seconds
                      )

                  return False

              if not recent_same(
                  background
              ):
                  background.append(entry)

              if (
                  relevant
                  and
                  inside
              ):
                  if not recent_same(
                      history
                  ):
                      history.append(entry)

                  current.append(entry)

                  last_push = parse_time(
                      pushes.get(ident)
                  )

                  allow = (
                      just_entered
                      or
                      (
                          not prev
                          and
                          inside
                      )
                  )

                  if (
                      allow
                      and
                      last_push
                      and
                      (
                          now - last_push
                      ).total_seconds() < 3600
                  ):
                      allow = False

                  if allow:
                      detected.append(entry)

                      pushes[
                          ident
                      ] = now.isoformat()

              states[ident] = {
                  "identity":
                      ident,

                  "segment_id":
                      segment_id,

                  "name":
                      profile.get("name"),

                  "registration":
                      reg,

                  "callsign":
                      cs,

                  "type":
                      typ,

                  "classification":
                      classification,

                  "classification_source":
                      profile.get(
                          "classification_source"
                      ),

                  "service":
                      profile.get("service"),

                  "station":
                      profile.get("station"),

                  "country":
                      profile.get("country"),

                  "operator":
                      op,

                  "first_seen":
                      first_seen,

                  "first_seen_distance_km":
                      first_dist,

                  "minimum_distance_km":
                      minimum,

                  "entered_30km":
                      entered,

                  "last_seen":
                      now.isoformat(),

                  "last_lat":
                      lat,

                  "last_lon":
                      lon,

                  "last_distance_km":
                      dist,

                  "movement_bearing":
                      mb,

                  "movement_direction":
                      md,

                  "distance_change_km":
                      delta,

                  "approaching_goch":
                      approach,

                  "inside_30km":
                      inside,

                  "relevant":
                      relevant
              }

          cutoff = (
              now
              - timedelta(days=2)
          )

          states = {
              k: v
              for k, v in states.items()
              if parse_time(
                  v.get("last_seen")
              )
              and
              parse_time(
                  v.get("last_seen")
              ) >= cutoff
          }

          history.sort(
              key=lambda x:
                  x.get("timestamp", "")
          )

          background.sort(
              key=lambda x:
                  x.get("timestamp", "")
          )

          save_json(
              HISTORY_FILE,
              history
          )

          save_json(
              BACKGROUND_FILE,
              background
          )

          save_json(
              FLIGHT_STATE_FILE,
              states
          )

          save_json(
              PUSH_STATE_FILE,
              pushes
          )

          save_json(
              UNKNOWN_FILE,
              unknown
          )

          save_json(
              DETECTED_FILE,
              detected
          )

          save_json(
              CURRENT_FILE,
              {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "action_radius_km":
                      30,

                  "background_radius_km":
                      80,

                  "aircraft":
                      current
              }
          )

          print(
              "Luftrettung Goch V4.6"
          )

          print(
              "ADSB-Luftfahrzeuge:",
              output.get("total", 0)
          )

          print(
              "Erkannte Hubschrauber:",
              rotor_count
          )

          print(
              "Relevante im 30-km-Bereich:",
              len(current)
          )

          print(
              "Push-Kandidaten:",
              len(detected)
          )
          PY

      - name: Telegram Nachricht senden
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get(
              "TELEGRAM_BOT_TOKEN",
              ""
          ).strip()

          chat_id = os.environ.get(
              "TELEGRAM_CHAT_ID",
              ""
          ).strip()

          if not token or not chat_id:
              raise RuntimeError(
                  "TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt."
              )

          def send(text):
              url = (
                  f"https://api.telegram.org/"
                  f"bot{token}/sendMessage"
              )

              data = urllib.parse.urlencode(
                  {
                      "chat_id":
                          chat_id,

                      "text":
                          text,

                      "disable_web_page_preview":
                          "true"
                  }
              ).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(
                  req,
                  timeout=20
              ) as r:
                  result = json.load(r)

              if not result.get("ok"):
                  raise RuntimeError(
                      str(result)
                  )

              return result

          if (
              os.environ.get(
                  "GITHUB_EVENT_NAME"
              )
              ==
              "workflow_dispatch"
          ):
              send(
                  "🚁 Luftrettung KLE – V4.6 Test\n\n"
                  "Version 4.6 läuft.\n"
                  "80-km-Hintergrundüberwachung aktiv.\n"
                  "30-km-Einsatzalarm aktiv.\n"
                  "aircraft_db.json aktiv.\n"
                  "Telegram-Benachrichtigung funktioniert."
              )

              print(
                  "Telegram-Testnachricht gesendet."
              )

              raise SystemExit(0)

          try:
              with open(
                  "detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  detected = json.load(f)

          except Exception as e:
              print(
                  "detected.json Fehler:",
                  repr(e)
              )

              detected = []

          if not detected:
              print(
                  "Keine relevante neue Erkennung."
              )

              raise SystemExit(0)

          for item in detected:
              name = (
                  item.get("name")
                  or
                  "Hubschrauber"
              )

              reg = (
                  item.get("registration")
                  or
                  "unbekannt"
              )

              cs = (
                  item.get("callsign")
                  or
                  "unbekannt"
              )

              service = (
                  item.get("service")
                  or
                  "unbekannt"
              )

              station = (
                  item.get("station")
                  or
                  "noch nicht bestimmt"
              )

              distance = item.get(
                  "distance_km"
              )

              first = item.get(
                  "first_seen_distance_km"
              )

              direction = (
                  item.get(
                      "movement_direction"
                  )
                  or
                  "noch unbekannt"
              )

              approaching = item.get(
                  "approaching_goch"
              )

              if approaching is True:
                  movement = (
                      "nähert sich Goch"
                  )

              elif approaching is False:
                  movement = (
                      "entfernt sich von Goch"
                  )

              else:
                  movement = (
                      "Bewegung noch nicht bestimmbar"
                  )

              text = (
                  f"🚁 {name} im 30-km-Radius erkannt\n\n"
                  f"Art: {service}\n"
                  f"Kennzeichen: {reg}\n"
                  f"Rufname: {cs}\n"
                  f"Station: {station}\n"
                  f"Jetzt: {distance} km von Goch\n"
                  f"Erstmals erfasst: {first} km\n"
                  f"Flugrichtung: {direction}\n"
                  f"Status: {movement}"
              )

              send(text)

              print(
                  "Telegram gesendet:",
                  name,
                  reg
              )
          PY

