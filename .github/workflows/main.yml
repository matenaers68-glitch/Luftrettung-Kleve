name: Luftrettung Goch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-goch-update
  cancel-in-progress: false

jobs:
  update-aircraft:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flugdaten V4.8 abrufen und auswerten
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import math
          import re
          import time

          from datetime import datetime, timezone, timedelta


          # =====================================================
          # VERSION / GRUNDEINSTELLUNGEN
          # =====================================================

          VERSION = "4.8"

          GOCH_LAT = 51.678
          GOCH_LON = 6.159

          ACTION_RADIUS_KM = 30
          BACKGROUND_RADIUS_KM = 80

          NEW_FLIGHT_AFTER_MINUTES = 75
          REENTRY_ARM_DISTANCE_KM = 32

          BACKGROUND_RADIUS_NM = round(
              BACKGROUND_RADIUS_KM / 1.852,
              1
          )

          ADSB_URL = (
              "https://api.adsb.lol/v2/lat/"
              f"{GOCH_LAT}/lon/{GOCH_LON}/dist/"
              f"{BACKGROUND_RADIUS_NM}"
          )

          NOMINATIM_URL = (
              "https://nominatim.openstreetmap.org/reverse"
          )

          now = datetime.now(timezone.utc)


          # =====================================================
          # DATEIEN
          # =====================================================

          AIRCRAFT_FILE = "aircraft.json"
          HISTORY_FILE = "history.json"
          BACKGROUND_FILE = "background_history.json"
          CURRENT_FILE = "current_rotorcraft.json"
          FLIGHT_STATE_FILE = "flight_state.json"
          PUSH_STATE_FILE = "push_state.json"
          DETECTED_FILE = "detected.json"
          DATABASE_FILE = "aircraft_db.json"
          UNKNOWN_FILE = "unknown_aircraft.json"
          GEOCODE_CACHE_FILE = "geocode_cache.json"


          # =====================================================
          # BEKANNTE RUFNAMEN
          # =====================================================

          KNOWN_CALLSIGNS = {

              "LIFELINER3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Nijmegen/Volkel-Region",
                  "country": "Niederlande"
              },

              "LIFELN3": {
                  "name": "Lifeliner 3",
                  "classification": "rescue",
                  "service": "Traumahelikopter",
                  "station": "Nijmegen/Volkel-Region",
                  "country": "Niederlande"
              },

              "CHRISTOPH9": {
                  "name": "Christoph 9",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Duisburg-Buchholz",
                  "country": "Deutschland"
              },

              "CHRISTOPH8": {
                  "name": "Christoph 8",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Lünen",
                  "country": "Deutschland"
              },

              "CHRISTOPH3": {
                  "name": "Christoph 3",
                  "classification": "rescue",
                  "service": "Rettungshubschrauber",
                  "station": "Köln",
                  "country": "Deutschland"
              },

              "CHRISTOPHWESTFALEN": {
                  "name": "Christoph Westfalen",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Greven",
                  "country": "Deutschland"
              },

              "CHRISTOPHDORTMUND": {
                  "name": "Christoph Dortmund",
                  "classification": "rescue",
                  "service": "Intensivtransporthubschrauber",
                  "station": "Dortmund",
                  "country": "Deutschland"
              },

              "CHRISTOPHRHEINLAND": {
                  "name": "Christoph Rheinland",
                  "classification": "rescue",
                  "service": "Intensivtransport-/Rettungshubschrauber",
                  "station": "Köln/Bonn",
                  "country": "Deutschland"
              }
          }


          # =====================================================
          # HUBSCHRAUBERTYPEN
          # =====================================================

          ROTOR_TYPES = (
              "EC35",
              "EC45",
              "H135",
              "H145",
              "EC135",
              "EC145",
              "BK17",
              "B06",
              "B407",
              "AS50",
              "AS55",
              "R22",
              "R44",
              "R66",
              "AW09",
              "AW109",
              "AW139",
              "AW169",
              "S76",
              "S92"
          )

          ROTOR_WORDS = (
              "HELI",
              "ROTOR",
              "CHRISTOPH",
              "LIFELINER",
              "LIFELN",
              "POLICE",
              "POLIZEI",
              "POLITIE",
              "HUMMEL",
              "SAR"
          )


          # =====================================================
          # JSON
          # =====================================================

          def load_json(filename, default):
              try:
                  with open(
                      filename,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      return json.load(f)
              except Exception:
                  return default


          def save_json(filename, data):
              with open(
                  filename,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # ZEIT
          # =====================================================

          def parse_time(value):
              try:
                  if not value:
                      return None

                  return datetime.fromisoformat(
                      str(value).replace(
                          "Z",
                          "+00:00"
                      )
                  )
              except Exception:
                  return None


          # =====================================================
          # ENTFERNUNG
          # =====================================================

          def distance_km(lat1, lon1, lat2, lon2):
              radius = 6371.0

              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)

              a = (
                  math.sin(dp / 2) ** 2
                  +
                  math.cos(p1)
                  *
                  math.cos(p2)
                  *
                  math.sin(dl / 2) ** 2
              )

              return (
                  2
                  *
                  radius
                  *
                  math.asin(
                      math.sqrt(a)
                  )
              )


          # =====================================================
          # RICHTUNG
          # =====================================================

          def bearing_degrees(lat1, lon1, lat2, lon2):
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)

              dl = math.radians(
                  lon2 - lon1
              )

              y = (
                  math.sin(dl)
                  *
                  math.cos(p2)
              )

              x = (
                  math.cos(p1)
                  *
                  math.sin(p2)
                  -
                  math.sin(p1)
                  *
                  math.cos(p2)
                  *
                  math.cos(dl)
              )

              return (
                  math.degrees(
                      math.atan2(y, x)
                  )
                  +
                  360
              ) % 360


          def direction_name(value):
              directions = [
                  "Nord",
                  "Nordost",
                  "Ost",
                  "Südost",
                  "Süd",
                  "Südwest",
                  "West",
                  "Nordwest"
              ]

              return directions[
                  int(
                      (value + 22.5)
                      //
                      45
                  ) % 8
              ]


          # =====================================================
          # NORMALISIERUNG
          # =====================================================

          def normalize(value):
              return str(
                  value or ""
              ).strip().upper()


          def compact(value):
              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  normalize(value)
              )


          # =====================================================
          # STAMMDATENBANK
          # =====================================================

          aircraft_db = load_json(
              DATABASE_FILE,
              {}
          )

          if not isinstance(
              aircraft_db,
              dict
          ):
              aircraft_db = {}


          def database_profile(ac):

              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()

              registration = normalize(
                  ac.get("r")
              )

              registration_compact = compact(
                  registration
              )

              possible_keys = (
                  hexcode,
                  registration,
                  registration_compact
              )

              for key in possible_keys:

                  if not key:
                      continue

                  profile = aircraft_db.get(
                      key
                  )

                  if (
                      isinstance(profile, dict)
                      and
                      profile.get("classification")
                  ):
                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "aircraft_db"

                      return result

              return None


          # =====================================================
          # HUBSCHRAUBERERKENNUNG
          # =====================================================

          def is_rotorcraft(ac):

              if database_profile(ac):
                  return True

              category = normalize(
                  ac.get("category")
              )

              if category == "A7":
                  return True

              ac_type = normalize(
                  ac.get("t")
              )

              if any(
                  rotor_type in ac_type
                  for rotor_type in ROTOR_TYPES
              ):
                  return True

              text = " ".join(
                  normalize(
                      ac.get(key)
                  )
                  for key in (
                      "flight",
                      "r",
                      "desc",
                      "ownOp",
                      "t"
                  )
              )

              return any(
                  word in text
                  for word in ROTOR_WORDS
              )


          # =====================================================
          # KLASSIFIZIERUNG
          # =====================================================

          def classify(ac):

              profile = database_profile(ac)

              if profile:
                  return profile

              registration = normalize(
                  ac.get("r")
              )

              callsign = normalize(
                  ac.get("flight")
              )

              callsign_key = compact(
                  callsign
              )

              description = normalize(
                  ac.get("desc")
              )

              operator = normalize(
                  ac.get("ownOp")
              )


              for key, profile in KNOWN_CALLSIGNS.items():

                  if key in callsign_key:

                      result = profile.copy()

                      result[
                          "classification_source"
                      ] = "callsign"

                      return result


              if callsign_key.startswith(
                  "CHRISTOPH"
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Christoph Rettungshubschrauber",

                      "classification":
                          "rescue",

                      "service":
                          "Rettungshubschrauber",

                      "station":
                          None,

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign"
                  }


              if (
                  callsign_key.startswith(
                      "LIFELINER"
                  )
                  or
                  callsign_key.startswith(
                      "LIFELN"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Lifeliner",

                      "classification":
                          "rescue",

                      "service":
                          "Traumahelikopter",

                      "station":
                          None,

                      "country":
                          "Niederlande",

                      "classification_source":
                          "callsign"
                  }


              if (
                  callsign_key.startswith(
                      "HUMMEL"
                  )
                  or
                  re.fullmatch(
                      r"NRW\d+",
                      callsign_key
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Polizeihubschrauber NRW",

                      "classification":
                          "police",

                      "service":
                          "Polizeihubschrauber NRW",

                      "station":
                          "Polizeifliegerstaffel NRW",

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign"
                  }


              if (
                  callsign_key.startswith(
                      "POLICE"
                  )
                  or
                  callsign_key.startswith(
                      "ZXP"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          "Politie Nederland",

                      "classification":
                          "police",

                      "service":
                          "Politiehelikopter",

                      "station":
                          "Dienst Luchtvaartpolitie",

                      "country":
                          "Niederlande",

                      "classification_source":
                          "callsign"
                  }


              if (
                  re.fullmatch(
                      r"BPO\d+",
                      callsign_key
                  )
                  or
                  "BUNDESPOLIZEI" in operator
                  or
                  "BUNDESPOLIZEI" in description
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Bundespolizei",

                      "classification":
                          "police",

                      "service":
                          "Bundespolizei-Flugdienst",

                      "station":
                          None,

                      "country":
                          "Deutschland",

                      "classification_source":
                          "callsign/metadata"
                  }


              police_text = " ".join(
                  (
                      callsign,
                      description,
                      operator
                  )
              )

              if any(
                  word in police_text
                  for word in (
                      "POLICE",
                      "POLIZEI",
                      "BUNDESPOLIZEI",
                      "POLITIE"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Polizeihubschrauber",

                      "classification":
                          "police",

                      "service":
                          "Polizei",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              military_text = " ".join(
                  (
                      callsign,
                      description,
                      operator
                  )
              )

              if any(
                  word in military_text
                  for word in (
                      "SAR",
                      "MILITARY",
                      "ARMY",
                      "AIR FORCE",
                      "LUFTWAFFE",
                      "BUNDESWEHR",
                      "NAVY",
                      "KONINKLIJKE LUCHTMACHT",
                      "ROYAL NETHERLANDS AIR FORCE"
                  )
              ):
                  return {
                      "name":
                          callsign
                          or
                          registration
                          or
                          "Militärhubschrauber",

                      "classification":
                          "military",

                      "service":
                          "Militär / SAR",

                      "station":
                          None,

                      "country":
                          None,

                      "classification_source":
                          "ADSB metadata"
                  }


              return {
                  "name":
                      callsign
                      or
                      registration
                      or
                      "Unbekannter Hubschrauber",

                  "classification":
                      "unknown",

                  "service":
                      "noch nicht bestimmt",

                  "station":
                      None,

                  "country":
                      None,

                  "classification_source":
                      "unknown"
              }


          # =====================================================
          # V4.8 – REVERSE GEOCODING
          # =====================================================

          geocode_cache = load_json(
              GEOCODE_CACHE_FILE,
              {}
          )

          if not isinstance(
              geocode_cache,
              dict
          ):
              geocode_cache = {}


          def geocode_key(lat, lon):

              # Rundung auf ca. 100 Meter.
              # Dadurch vermeiden wir unnötig viele Anfragen.

              return (
                  f"{round(lat, 3):.3f},"
                  f"{round(lon, 3):.3f}"
              )


          def reverse_geocode(lat, lon):

              key = geocode_key(
                  lat,
                  lon
              )


              if key in geocode_cache:

                  cached = geocode_cache[
                      key
                  ]

                  if isinstance(
                      cached,
                      dict
                  ):
                      return cached


              params = urllib.parse.urlencode(
                  {
                      "lat": lat,
                      "lon": lon,
                      "format": "jsonv2",
                      "addressdetails": 1,
                      "zoom": 18
                  }
              )


              url = (
                  NOMINATIM_URL
                  +
                  "?"
                  +
                  params
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Luftrettung-Kleve/4.8 "
                          "(private non-commercial monitoring)"
                  }
              )


              try:

                  print(
                      "Geocoding:",
                      key
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      data = json.load(
                          response
                      )


                  address = data.get(
                      "address",
                      {}
                  )


                  road = (
                      address.get("road")
                      or
                      address.get("pedestrian")
                      or
                      address.get("footway")
                      or
                      address.get("path")
                      or
                      address.get("residential")
                      or
                      address.get("cycleway")
                      or
                      address.get("service")
                  )


                  house_number = address.get(
                      "house_number"
                  )


                  city = (
                      address.get("city")
                      or
                      address.get("town")
                      or
                      address.get("village")
                      or
                      address.get("municipality")
                      or
                      address.get("hamlet")
                  )


                  district = (
                      address.get("city_district")
                      or
                      address.get("suburb")
                      or
                      address.get("quarter")
                  )


                  postcode = address.get(
                      "postcode"
                  )


                  county = address.get(
                      "county"
                  )


                  state = address.get(
                      "state"
                  )


                  country = address.get(
                      "country"
                  )


                  display_parts = []


                  if road:

                      road_text = road

                      if house_number:
                          road_text += (
                              " "
                              +
                              house_number
                          )

                      display_parts.append(
                          road_text
                      )


                  if postcode or city:

                      city_text = " ".join(
                          x
                          for x in (
                              postcode,
                              city
                          )
                          if x
                      )

                      if city_text:
                          display_parts.append(
                              city_text
                          )


                  if not display_parts:

                      if city:
                          display_parts.append(
                              city
                          )

                      elif county:
                          display_parts.append(
                              county
                          )

                      else:
                          display_parts.append(
                              data.get(
                                  "display_name",
                                  "Ort nicht bestimmbar"
                              )
                          )


                  location = {
                      "display":
                          ", ".join(
                              display_parts
                          ),

                      "road":
                          road,

                      "house_number":
                          house_number,

                      "city":
                          city,

                      "district":
                          district,

                      "postcode":
                          postcode,

                      "county":
                          county,

                      "state":
                          state,

                      "country":
                          country,

                      "source":
                          "OpenStreetMap / Nominatim",

                      "geocoded_at":
                          now.isoformat()
                  }


                  geocode_cache[
                      key
                  ] = location


                  # Öffentlichen Dienst nicht mit
                  # schnellen Folgeanfragen belasten.
                  time.sleep(
                      1.1
                  )


                  return location


              except Exception as error:

                  print(
                      "Geocoding fehlgeschlagen:",
                      key,
                      repr(error)
                  )


                  # Geocoding-Fehler darf niemals
                  # den Luftrettungs-Workflow stoppen.

                  return {
                      "display":
                          None,

                      "road":
                          None,

                      "house_number":
                          None,

                      "city":
                          None,

                      "district":
                          None,

                      "postcode":
                          None,

                      "county":
                          None,

                      "state":
                          None,

                      "country":
                          None,

                      "source":
                          "Geocoding fehlgeschlagen"
                  }


          # =====================================================
          # ADSB.LOL
          # =====================================================

          try:

              request = urllib.request.Request(
                  ADSB_URL,
                  headers={
                      "User-Agent":
                          f"Luftrettung-Kleve/{VERSION}"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=25
              ) as response:

                  source = json.load(
                      response
                  )


              aircraft = source.get(
                  "ac",
                  []
              )


              if not isinstance(
                  aircraft,
                  list
              ):
                  aircraft = []


              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "center": {
                      "name": "Goch",
                      "lat": GOCH_LAT,
                      "lon": GOCH_LON
                  },

                  "background_radius_km":
                      BACKGROUND_RADIUS_KM,

                  "action_radius_km":
                      ACTION_RADIUS_KM,

                  "total":
                      len(aircraft),

                  "ac":
                      aircraft
              }


          except Exception as error:

              print(
                  "ADSB.lol Fehler:",
                  repr(error)
              )

              output = {
                  "updated":
                      now.isoformat(),

                  "version":
                      VERSION,

                  "source":
                      "ADSB.lol",

                  "error":
                      str(error),

                  "total":
                      0,

                  "ac":
                      []
              }


          save_json(
              AIRCRAFT_FILE,
              output
          )


          # =====================================================
          # BESTEHENDE DATEN
          # =====================================================

          history = load_json(
              HISTORY_FILE,
              []
          )

          background = load_json(
              BACKGROUND_FILE,
              []
          )

          states = load_json(
              FLIGHT_STATE_FILE,
              {}
          )

          pushes = load_json(
              PUSH_STATE_FILE,
              {}
          )

          unknown = load_json(
              UNKNOWN_FILE,
              {}
          )


          if not isinstance(history, list):
              history = []

          if not isinstance(background, list):
              background = []

          if not isinstance(states, dict):
              states = {}

          if not isinstance(pushes, dict):
              pushes = {}

          if not isinstance(unknown, dict):
              unknown = {}


          # =====================================================
          # HISTORIE BEREINIGEN
          # =====================================================

          def clean(entries, cutoff):

              cleaned = []

              for item in entries:

                  timestamp = parse_time(
                      item.get("timestamp")
                  )

                  if (
                      timestamp
                      and
                      timestamp >= cutoff
                  ):
                      cleaned.append(
                          item
                      )

              return cleaned


          history = clean(
              history,
              now - timedelta(days=14)
          )

          background = clean(
              background,
              now - timedelta(days=2)
          )


          # =====================================================
          # DOPPELTE PUNKTE VERHINDERN
          # =====================================================

          def recent_same(
              entries,
              identity,
              seconds=120
          ):

              for old in reversed(
                  entries
              ):

                  if (
                      old.get("identity")
                      != identity
                  ):
                      continue

                  old_time = parse_time(
                      old.get("timestamp")
                  )

                  return bool(
                      old_time
                      and
                      (
                          now - old_time
                      ).total_seconds()
                      <
                      seconds
                  )

              return False


          # =====================================================
          # VERARBEITUNG
          # =====================================================

          current = []
          detected = []

          rotor_count = 0


          for ac in output.get(
              "ac",
              []
          ):

              if not is_rotorcraft(
                  ac
              ):
                  continue


              rotor_count += 1


              lat = ac.get(
                  "lat"
              )

              lon = ac.get(
                  "lon"
              )


              if not isinstance(
                  lat,
                  (int, float)
              ):
                  continue


              if not isinstance(
                  lon,
                  (int, float)
              ):
                  continue


              hexcode = str(
                  ac.get("hex")
                  or ""
              ).strip().lower()


              registration = str(
                  ac.get("r")
                  or ""
              ).strip()


              callsign = str(
                  ac.get("flight")
                  or ""
              ).strip()


              identity = (
                  hexcode
                  or
                  compact(registration)
                  or
                  compact(callsign)
              )


              if not identity:
                  continue


              ac_type = str(
                  ac.get("t")
                  or ""
              ).strip().upper()


              category = str(
                  ac.get("category")
                  or ""
              ).strip().upper()


              description = str(
                  ac.get("desc")
                  or ""
              ).strip()


              operator = str(
                  ac.get("ownOp")
                  or ""
              ).strip()


              distance = round(
                  distance_km(
                      GOCH_LAT,
                      GOCH_LON,
                      lat,
                      lon
                  ),
                  1
              )


              profile = classify(
                  ac
              )


              classification = profile.get(
                  "classification",
                  "unknown"
              )


              relevant = (
                  classification
                  in (
                      "rescue",
                      "police",
                      "military"
                  )
              )


              # =================================================
              # ALTER ZUSTAND
              # =================================================

              previous = states.get(
                  identity,
                  {}
              )


              previous_seen = parse_time(
                  previous.get(
                      "last_seen"
                  )
              )


              # =================================================
              # NEUER FLUG
              # =================================================

              new_flight = False


              if not previous_seen:

                  new_flight = True

              else:

                  gap_seconds = (
                      now
                      -
                      previous_seen
                  ).total_seconds()


                  if (
                      gap_seconds
                      >
                      NEW_FLIGHT_AFTER_MINUTES
                      *
                      60
                  ):
                      new_flight = True


              if new_flight:

                  segment_id = (
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )

                  first_seen = (
                      now.isoformat()
                  )

                  first_distance = (
                      distance
                  )

                  minimum_distance = (
                      distance
                  )

                  entered_30km = None

                  alert_sent_for_segment = False

                  reentry_armed = (
                      distance
                      >
                      REENTRY_ARM_DISTANCE_KM
                  )


              else:

                  segment_id = (
                      previous.get(
                          "segment_id"
                      )
                      or
                      identity
                      +
                      "-"
                      +
                      now.strftime(
                          "%Y%m%dT%H%M%S"
                      )
                  )


                  first_seen = (
                      previous.get(
                          "first_seen"
                      )
                      or
                      now.isoformat()
                  )


                  first_distance = (
                      previous.get(
                          "first_seen_distance_km",
                          distance
                      )
                  )


                  old_minimum = (
                      previous.get(
                          "minimum_distance_km",
                          distance
                      )
                  )


                  if not isinstance(
                      old_minimum,
                      (int, float)
                  ):
                      old_minimum = distance


                  minimum_distance = min(
                      old_minimum,
                      distance
                  )


                  entered_30km = (
                      previous.get(
                          "entered_30km"
                      )
                  )


                  alert_sent_for_segment = bool(
                      previous.get(
                          "alert_sent_for_segment",
                          False
                      )
                  )


                  reentry_armed = bool(
                      previous.get(
                          "reentry_armed",
                          False
                      )
                  )


              # =================================================
              # 30-KM-ZUSTAND
              # =================================================

              inside = (
                  distance
                  <=
                  ACTION_RADIUS_KM
              )


              if (
                  distance
                  >
                  REENTRY_ARM_DISTANCE_KM
              ):
                  reentry_armed = True


              if (
                  inside
                  and
                  not entered_30km
              ):
                  entered_30km = (
                      now.isoformat()
                  )


              # =================================================
              # BEWEGUNG
              # =================================================

              movement_bearing = None
              movement_direction = None
              approaching_goch = None
              distance_change = None


              previous_lat = previous.get(
                  "last_lat"
              )

              previous_lon = previous.get(
                  "last_lon"
              )

              previous_distance = previous.get(
                  "last_distance_km"
              )


              if (
                  isinstance(
                      previous_lat,
                      (int, float)
                  )
                  and
                  isinstance(
                      previous_lon,
                      (int, float)
                  )
              ):

                  movement_bearing = round(
                      bearing_degrees(
                          previous_lat,
                          previous_lon,
                          lat,
                          lon
                      ),
                      1
                  )

                  movement_direction = (
                      direction_name(
                          movement_bearing
                      )
                  )


              if isinstance(
                  previous_distance,
                  (int, float)
              ):

                  distance_change = round(
                      distance
                      -
                      previous_distance,
                      1
                  )


                  if distance_change < -0.5:
                      approaching_goch = True

                  elif distance_change > 0.5:
                      approaching_goch = False


              # =================================================
              # PUSH
              # =================================================

              push_reason = None
              allow_push = False


              if relevant and inside:

                  if (
                      new_flight
                      and
                      not alert_sent_for_segment
                  ):

                      allow_push = True

                      push_reason = (
                          "neuer Flug erstmals "
                          "innerhalb 30 km erkannt"
                      )


                  elif (
                      reentry_armed
                      and
                      not previous.get(
                          "inside_30km",
                          False
                      )
                  ):

                      allow_push = True

                      push_reason = (
                          "neuer 30-km-Eintritt"
                      )


              # =================================================
              # V4.8 – ORT NUR FÜR NEUEN HISTORIENPUNKT
              # =================================================

              location = None


              should_store_history = (
                  relevant
                  and
                  inside
                  and
                  not recent_same(
                      history,
                      identity
                  )
              )


              if should_store_history:

                  location = reverse_geocode(
