name: Luftrettung Einsatz-Zuordnung

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: luftrettung-einsatz-zuordnung
  cancel-in-progress: false

jobs:
  incident-match:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Presseberichte suchen und Flügen zuordnen
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import html
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from difflib import SequenceMatcher

          VERSION = "1.0"
          HISTORY_FILE = "history.json"
          MATCH_FILE = "incident_matches.json"
          STATE_FILE = "incident_match_state.json"
          DETECTED_FILE = "incident_detected.json"

          LOOKBACK_HOURS = 48
          MIN_SCORE = 60
          VERY_LIKELY_SCORE = 85
          MAX_TIME_DIFFERENCE_HOURS = 24

          now = datetime.now(timezone.utc)

          # -----------------------------------------------------
          # JSON
          # -----------------------------------------------------

          def load_json(filename, default):
              try:
                  with open(filename, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          def save_json(filename, data):
              with open(filename, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

          def parse_time(value):
              try:
                  if not value:
                      return None
                  return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except Exception:
                  return None

          def clean_text(value):
              value = html.unescape(str(value or ""))
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def norm(value):
              value = clean_text(value).lower()
              value = value.replace("ä", "ae").replace("ö", "oe").replace("ü", "ue").replace("ß", "ss")
              return re.sub(r"[^a-z0-9 ]+", " ", value)

          # -----------------------------------------------------
          # HTTP
          # -----------------------------------------------------

          HEADERS = {
              "User-Agent": "Luftrettung-Kleve-Einsatzzuordnung/1.0"
          }

          def fetch(url, timeout=20):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          # -----------------------------------------------------
          # QUELLEN
          # -----------------------------------------------------
          # Presseportal stellt RSS-Suchen bereit. Für Feuerwehr
          # Goch und TV Niederrhein nutzen wir zunächst deren
          # öffentlich erreichbare Seiten/RSS, sofern vorhanden.
          #
          # Ein Ausfall EINER Quelle beendet den Workflow nicht.
          # -----------------------------------------------------

          def rss_items(url, source_name):
              items = []
              try:
                  raw = fetch(url)
                  root = ET.fromstring(raw)
                  for item in root.findall(".//item"):
                      title = clean_text(item.findtext("title"))
                      link = clean_text(item.findtext("link"))
                      description = clean_text(item.findtext("description"))
                      pub = clean_text(item.findtext("pubDate"))
                      dt = None
                      if pub:
                          try:
                              from email.utils import parsedate_to_datetime
                              dt = parsedate_to_datetime(pub)
                              if dt.tzinfo is None:
                                  dt = dt.replace(tzinfo=timezone.utc)
                              dt = dt.astimezone(timezone.utc)
                          except Exception:
                              pass
                      items.append({
                          "source": source_name,
                          "title": title,
                          "url": link,
                          "description": description,
                          "published": dt.isoformat() if dt else None
                      })
              except Exception as e:
                  print("RSS-Fehler:", source_name, repr(e))
              return items

          def google_news_items(query, source_name):
              q = urllib.parse.quote(query)
              url = (
                  "https://news.google.com/rss/search?"
                  f"q={q}&hl=de&gl=DE&ceid=DE:de"
              )
              return rss_items(url, source_name)

          def collect_articles():
              articles = []

              # 1. Kreispolizeibehörde Kleve / Presseportal
              articles += google_news_items(
                  'site:presseportal.de/blaulicht/nr/65849 (Goch OR Kleve OR Kevelaer OR Kalkar OR Bedburg-Hau OR Uedem OR Weeze OR Kranenburg OR Rees OR Geldern) ',
                  "Kreispolizeibehörde Kleve / Presseportal"
              )

              # 2. Feuerwehr Goch
              articles += google_news_items(
                  'site:feuerwehr-goch.de',
                  "Feuerwehr Goch"
              )

              # 3. TV Niederrhein
              articles += google_news_items(
                  'site:tv-niederrhein.de (Goch OR Kleve OR Kevelaer OR Kalkar OR Uedem OR Weeze OR Rees OR Geldern)',
                  "TV Niederrhein"
              )

              # 4. Rheinische Post
              articles += google_news_items(
                  'site:rp-online.de (Goch OR Kleve OR Kevelaer OR Kalkar OR Uedem OR Weeze OR Rees OR Geldern) (Hubschrauber OR Rettungshubschrauber OR Unfall OR Einsatz)',
                  "Rheinische Post"
              )

              # 5. NRZ / WAZ
              articles += google_news_items(
                  '(site:nrz.de OR site:waz.de) (Goch OR Kleve OR Kevelaer OR Kalkar OR Uedem OR Weeze OR Rees OR Geldern) (Hubschrauber OR Rettungshubschrauber OR Unfall OR Einsatz)',
                  "NRZ / WAZ"
              )

              # Duplikate entfernen
              unique = {}
              for article in articles:
                  key = article.get("url") or (article.get("source","") + "|" + article.get("title",""))
                  if key:
                      unique[key] = article

              return list(unique.values())

          # -----------------------------------------------------
          # FLÜGE
          # -----------------------------------------------------

          history = load_json(HISTORY_FILE, [])
          if not isinstance(history, list):
              history = []

          cutoff = now - timedelta(hours=LOOKBACK_HOURS)

          segments = {}

          for item in history:
              ts = parse_time(item.get("timestamp"))
              if not ts or ts < cutoff:
                  continue

              segment_id = item.get("segment_id")
              if not segment_id:
                  continue

              segments.setdefault(segment_id, []).append(item)

          flights = []

          for segment_id, points in segments.items():
              points.sort(key=lambda x: x.get("timestamp", ""))
              first = points[0]
              last = points[-1]

              # Punkt mit geringster Distanz zu Goch
              nearest = min(
                  points,
                  key=lambda x: x.get("distance_km")
                  if isinstance(x.get("distance_km"), (int, float))
                  else 9999
              )

              # Bevorzugt einen Punkt mit Ortsangabe
              located = [
                  p for p in points
                  if isinstance(p.get("location"), dict)
                  and p["location"].get("display")
              ]

              best_location_point = nearest
              if located:
                  best_location_point = min(
                      located,
                      key=lambda x: x.get("distance_km")
                      if isinstance(x.get("distance_km"), (int, float))
                      else 9999
                  )

              location = best_location_point.get("location") or {}

              flights.append({
                  "segment_id": segment_id,
                  "identity": last.get("identity"),
                  "name": last.get("name") or first.get("name") or "Hubschrauber",
                  "registration": last.get("registration") or first.get("registration"),
                  "callsign": last.get("callsign") or first.get("callsign"),
                  "service": last.get("service") or first.get("service"),
                  "first_seen": first.get("timestamp"),
                  "last_seen": last.get("timestamp"),
                  "city": location.get("city"),
                  "road": location.get("road"),
                  "postcode": location.get("postcode"),
                  "location": location.get("display"),
                  "nearest_distance_km": nearest.get("distance_km"),
                  "nearest_lat": nearest.get("lat"),
                  "nearest_lon": nearest.get("lon"),
                  "points": len(points)
              })

          print("Zu prüfende Flugsegmente:", len(flights))

          # -----------------------------------------------------
          # BEWERTUNG
          # -----------------------------------------------------

          HELI_WORDS = (
              "rettungshubschrauber",
              "hubschrauber",
              "rettungshelikopter",
              "helikopter",
              "christoph",
              "lifeliner"
          )

          INCIDENT_WORDS = (
              "unfall",
              "verkehrsunfall",
              "einsatz",
              "schwer verletzt",
              "schwerverletzt",
              "lebensgefahr",
              "rettungsdienst",
              "feuerwehr",
              "polizei",
              "brand",
              "arbeitsunfall",
              "motorrad",
              "pedelec",
              "radfahrer",
              "fußgänger",
              "fussgaenger"
          )

          PRIORITY_SOURCES = {
              "Kreispolizeibehörde Kleve / Presseportal": 15,
              "Feuerwehr Goch": 15,
              "TV Niederrhein": 15,
              "Rheinische Post": 8,
              "NRZ / WAZ": 8
          }

          def article_time(article):
              return parse_time(article.get("published"))

          def score_match(flight, article):
              text = norm(
                  article.get("title", "") + " " +
                  article.get("description", "")
              )

              score = 0
              reasons = []

              city = norm(flight.get("city"))
              road = norm(flight.get("road"))
              name = norm(flight.get("name"))
              callsign = norm(flight.get("callsign"))

              if city and city in text:
                  score += 30
                  reasons.append("Ort stimmt überein")

              if road and len(road) >= 4 and road in text:
                  score += 25
                  reasons.append("Straße stimmt überein")

              if any(norm(word) in text for word in HELI_WORDS):
                  score += 20
                  reasons.append("Hubschrauber wird erwähnt")

              if any(norm(word) in text for word in INCIDENT_WORDS):
                  score += 10
                  reasons.append("Einsatz-/Unfallbezug")

              if name and name not in ("hubschrauber", "unbekannter hubschrauber"):
                  if name in text:
                      score += 20
                      reasons.append("Hubschraubername stimmt überein")

              if callsign and len(callsign) >= 4 and callsign in text:
                  score += 20
                  reasons.append("Rufname stimmt überein")

              score += PRIORITY_SOURCES.get(article.get("source"), 0)
              if PRIORITY_SOURCES.get(article.get("source"), 0):
                  reasons.append("priorisierte Quelle")

              flight_time = parse_time(flight.get("last_seen"))
              pub_time = article_time(article)

              time_diff_hours = None

              if flight_time and pub_time:
                  time_diff_hours = abs(
                      (pub_time - flight_time).total_seconds()
                  ) / 3600

                  if time_diff_hours <= 3:
                      score += 20
                      reasons.append("sehr zeitnah")
                  elif time_diff_hours <= 8:
                      score += 15
                      reasons.append("zeitnah")
                  elif time_diff_hours <= 24:
                      score += 8
                      reasons.append("innerhalb 24 Stunden")
                  elif time_diff_hours > MAX_TIME_DIFFERENCE_HOURS:
                      score -= 25

              # Titelähnlichkeit als kleiner Zusatzindikator
              if city:
                  similarity = SequenceMatcher(
                      None,
                      city,
                      norm(article.get("title"))
                  ).ratio()
                  if similarity > 0.45:
                      score += 5

              return score, reasons, time_diff_hours

          # -----------------------------------------------------
          # ARTIKEL LADEN
          # -----------------------------------------------------

          articles = collect_articles()
          print("Gefundene Presse-/News-Einträge:", len(articles))

          # -----------------------------------------------------
          # MATCHES
          # -----------------------------------------------------

          existing_matches = load_json(MATCH_FILE, [])
          state = load_json(STATE_FILE, {})

          if not isinstance(existing_matches, list):
              existing_matches = []

          if not isinstance(state, dict):
              state = {}

          detected = []
          new_matches = []

          # Beste bereits vorhandene Matches pro Flug erhalten
          existing_by_key = {}
          for old in existing_matches:
              key = (
                  str(old.get("segment_id", "")) +
                  "|" +
                  str(old.get("article_url", ""))
              )
              existing_by_key[key] = old

          for flight in flights:
              candidates = []

              for article in articles:
                  score, reasons, diff = score_match(flight, article)

                  if score < MIN_SCORE:
                      continue

                  confidence = "möglicher Zusammenhang"
                  if score >= VERY_LIKELY_SCORE:
                      confidence = "sehr wahrscheinlicher Zusammenhang"
                  elif score >= 70:
                      confidence = "wahrscheinlicher Zusammenhang"

                  candidates.append({
                      "version": VERSION,
                      "checked_at": now.isoformat(),
                      "segment_id": flight.get("segment_id"),
                      "aircraft_name": flight.get("name"),
                      "registration": flight.get("registration"),
                      "callsign": flight.get("callsign"),
                      "service": flight.get("service"),
                      "flight_first_seen": flight.get("first_seen"),
                      "flight_last_seen": flight.get("last_seen"),
                      "flight_location": flight.get("location"),
                      "flight_city": flight.get("city"),
                      "flight_road": flight.get("road"),
                      "nearest_distance_km": flight.get("nearest_distance_km"),
                      "article_source": article.get("source"),
                      "article_title": article.get("title"),
                      "article_url": article.get("url"),
                      "article_published": article.get("published"),
                      "score": score,
                      "confidence": confidence,
                      "reasons": reasons,
                      "time_difference_hours": round(diff, 1) if diff is not None else None
                  })

              candidates.sort(key=lambda x: x.get("score", 0), reverse=True)

              # Pro Flug maximal die drei besten Treffer speichern.
              for match in candidates[:3]:
                  key = (
                      str(match.get("segment_id", "")) +
                      "|" +
                      str(match.get("article_url", ""))
                  )
                  existing_by_key[key] = match

              # Telegram nur für den besten Treffer eines Fluges.
              if candidates:
                  best = candidates[0]
                  state_key = str(best.get("segment_id"))
                  old = state.get(state_key, {})

                  already_url = old.get("article_url")
                  already_score = old.get("score", 0)

                  # Neue Meldung, wenn noch nie gemeldet oder
                  # ein deutlich besserer Treffer auftaucht.
                  should_notify = (
                      not already_url
                      or (
                          best.get("article_url") != already_url
                          and best.get("score", 0) >= already_score + 10
                      )
                  )

                  if should_notify:
                      detected.append(best)
                      state[state_key] = {
                          "notified_at": now.isoformat(),
                          "article_url": best.get("article_url"),
                          "score": best.get("score"),
                          "confidence": best.get("confidence")
                      }

          new_matches = list(existing_by_key.values())

          # Nur 14 Tage aufbewahren
          match_cutoff = now - timedelta(days=14)
          cleaned_matches = []

          for match in new_matches:
              ts = parse_time(match.get("flight_last_seen"))
              if ts and ts >= match_cutoff:
                  cleaned_matches.append(match)

          cleaned_matches.sort(
              key=lambda x: (
                  x.get("flight_last_seen", ""),
                  x.get("score", 0)
              ),
              reverse=True
          )

          save_json(MATCH_FILE, cleaned_matches)
          save_json(STATE_FILE, state)
          save_json(DETECTED_FILE, detected)

          print("Gespeicherte Zuordnungen:", len(cleaned_matches))
          print("Neue Telegram-Kandidaten:", len(detected))

          for item in detected:
              print(
                  "TREFFER:",
                  item.get("aircraft_name"),
                  "|",
                  item.get("flight_location"),
                  "|",
                  item.get("article_source"),
                  "| Score:",
                  item.get("score"),
                  "|",
                  item.get("article_title")
              )
          PY

      - name: Telegram Nachricht bei Presse-Treffer
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              raise RuntimeError(
                  "TELEGRAM_BOT_TOKEN oder TELEGRAM_CHAT_ID fehlt."
              )

          def send(text):
              url = f"https://api.telegram.org/bot{token}/sendMessage"

              data = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "false"
              }).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.load(response)

              if not result.get("ok"):
                  raise RuntimeError("Telegram-Fehler: " + str(result))

              return result

          try:
              with open(
                  "incident_detected.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  detected = json.load(f)
          except Exception:
              detected = []

          if not detected:
              print("Kein neuer Presse-Treffer.")
              raise SystemExit(0)

          def german_time(value):
              try:
                  d = datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
                  return d.strftime("%d.%m.%Y %H:%M")
              except Exception:
                  return str(value or "unbekannt")

          for item in detected:
              name = item.get("aircraft_name") or "Hubschrauber"
              location = item.get("flight_location") or item.get("flight_city") or "Ort noch nicht bestimmt"
              source = item.get("article_source") or "Quelle unbekannt"
              title = item.get("article_title") or "Einsatzbericht"
              url = item.get("article_url") or ""
              confidence = item.get("confidence") or "möglicher Zusammenhang"
              score = item.get("score") or 0
              flight_time = german_time(item.get("flight_last_seen"))

              reasons = item.get("reasons") or []
              reason_text = " · ".join(reasons[:5])

              text = (
                  f"🚁 {name} – möglicher Einsatz gefunden\n\n"
                  f"Flug: {flight_time} Uhr\n"
                  f"Bereich: {location}\n\n"
                  f"🚨 {title}\n\n"
                  f"Quelle: {source}\n"
                  f"Zuordnung: {confidence}\n"
                  f"Bewertung: {score} Punkte\n"
              )

              if reason_text:
                  text += f"Übereinstimmung: {reason_text}\n"

              if url:
                  text += f"\nBericht öffnen:\n{url}"

              send(text)

              print(
                  "Telegram Presse-Treffer gesendet:",
                  name,
                  "|",
                  source,
                  "|",
                  score
              )
          PY

      - name: Ergebnisse speichern
        shell: bash
        run: |
          git config user.name "Luftrettung-Kleve Bot"
          git config user.email "actions@github.com"

          git add \
            incident_matches.json \
            incident_match_state.json \
            incident_detected.json

          if git diff --cached --quiet; then
            echo "Keine neuen Einsatz-Zuordnungen."
          else
            git commit -m "Einsatz-Zuordnung aktualisiert"

            git pull \
              --rebase \
              origin main

            git push \
              origin main
          fi
